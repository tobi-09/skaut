<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pozvánka na program</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-bar { background: linear-gradient(135deg, #255C9E 0%, #20649B 100%); }
        .event-card { box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .info-section { border-left: 4px solid #255C9E; }
        .confirm-section { background: linear-gradient(135deg, #E8F4F8 0%, #D4E8F0 100%); }
        @print {
            body { background: white; }
            .no-print { display: none; }
            .event-card { page-break-inside: avoid; box-shadow: none; border: 1px solid #e5e7eb; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen">
    <div class="w-full h-3 header-bar"></div>

    <div id="loading" class="flex justify-center items-center py-32">
        <div class="text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
            <p class="text-slate-600">Načítám pozvánku...</p>
        </div>
    </div>

    <div id="app" class="hidden max-w-3xl mx-auto px-4 py-12">
        <div class="event-card bg-white rounded-2xl p-8 mb-6">
            <h1 id="eventName" class="text-4xl font-bold text-blue-900 mb-4"></h1>
            <div id="mainTextDiv" class="text-lg text-slate-700 mb-4 leading-relaxed whitespace-pre-wrap hidden"></div>
            <p class="text-slate-600 border-b pb-4">Těšíme se na Vaši účast!</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-6">
            <div class="info-section bg-white rounded-xl p-6">
                <h2 class="text-lg font-bold text-blue-900 mb-3 flex items-center gap-2">
                    <span>📍 Kde?</span>
                </h2>
                <p id="location" class="text-slate-700 text-lg">-</p>
            </div>

            <div class="info-section bg-white rounded-xl p-6">
                <h2 class="text-lg font-bold text-blue-900 mb-3 flex items-center gap-2">
                    <span>🕐 Kdy?</span>
                </h2>
                <div>
                    <p id="date" class="text-slate-700 font-medium">-</p>
                    <p id="time" class="text-slate-700">-</p>
                </div>
            </div>
        </div>

        <div id="descriptionCard" class="info-section bg-white rounded-xl p-6 mb-6 hidden">
            <h2 class="text-lg font-bold text-blue-900 mb-3 flex items-center gap-2">
                <span>📝 Program</span>
            </h2>
            <p id="description" class="text-slate-700 whitespace-pre-wrap leading-relaxed"></p>
        </div>

        <div id="whatToCard" class="info-section bg-white rounded-xl p-6 mb-6 hidden">
            <h2 class="text-lg font-bold text-blue-900 mb-3 flex items-center gap-2">
                <span>🎒 Co si vzít</span>
            </h2>
            <p id="whatToBring" class="text-slate-700 whitespace-pre-wrap leading-relaxed"></p>
        </div>

        <div id="contactCard" class="info-section bg-blue-50 rounded-xl p-6 mb-6 hidden">
            <h2 class="text-lg font-bold text-blue-900 mb-3 flex items-center gap-2">
                <span>📧 Kontakt</span>
            </h2>
            <p id="contact" class="text-slate-700"></p>
        </div>

        <div id="notesCard" class="info-section bg-yellow-50 rounded-xl p-6 mb-6 hidden">
            <h2 class="text-lg font-bold text-blue-900 mb-3 flex items-center gap-2">
                <span>💡 Poznámky</span>
            </h2>
            <p id="notes" class="text-slate-700 whitespace-pre-wrap"></p>
        </div>

        <!-- Confirmation Section -->
        <div class="confirm-section rounded-xl p-8 mb-6 no-print">
            <h2 class="text-2xl font-bold text-blue-900 mb-4 flex items-center gap-2">
                <span>✋ Potvrď svou účast</span>
            </h2>
            <form id="confirmForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">Tvoje jméno *</label>
                    <input type="text" id="confirmName" required placeholder="Např: Jan Novák" class="w-full p-3 border-2 border-blue-300 rounded-lg focus:border-blue-600 focus:outline-none"/>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">Tvůj email *</label>
                    <input type="email" id="confirmEmail" required placeholder="tvuj@email.com" class="w-full p-3 border-2 border-blue-300 rounded-lg focus:border-blue-600 focus:outline-none"/>
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition text-lg">
                    ✓ Potvrdím účast
                </button>
            </form>
            <div id="confirmSuccess" class="hidden mt-4 p-4 bg-green-100 border-2 border-green-500 rounded-lg">
                <p class="text-green-800 font-bold">✓ Děkujeme! Tvoje účast byla zaregistrována.</p>
            </div>
            <div id="confirmError" class="hidden mt-4 p-4 bg-red-100 border-2 border-red-500 rounded-lg">
                <p id="confirmErrorMsg" class="text-red-800 font-bold"></p>
            </div>
        </div>

        <div class="bg-white rounded-xl p-6 text-center">
            <button onclick="window.print()" class="no-print bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition">
                🖨️ Tisk
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAgqIX3_OHPrh27vuMJsIUpKLjVLcxMOaU",
            authDomain: "skladatel-progrmu-a-her.firebaseapp.com",
            databaseURL: "https://skladatel-progrmu-a-her-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "skladatel-progrmu-a-her"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const invitationId = urlParams.get('id');

        if (invitationId) {
            get(ref(db, `invitations/${invitationId}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');

                    document.getElementById('eventName').textContent = data.meta?.name || "Pozvánka";
                    document.getElementById('location').textContent = data.location || "Místo určeno";
                    
                    if (data.mainText) {
                        document.getElementById('mainTextDiv').textContent = data.mainText;
                        document.getElementById('mainTextDiv').classList.remove('hidden');
                    }
                    
                    if (data.date) {
                        const dateObj = new Date(data.date);
                        document.getElementById('date').textContent = dateObj.toLocaleDateString('cs-CZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                    }
                    
                    document.getElementById('time').textContent = data.time ? `Začátek v ${data.time}` : 'Čas určen';

                    if (data.description) {
                        document.getElementById('descriptionCard').classList.remove('hidden');
                        document.getElementById('description').textContent = data.description;
                    }

                    if (data.whatToBring) {
                        document.getElementById('whatToCard').classList.remove('hidden');
                        document.getElementById('whatToBring').textContent = data.whatToBring;
                    }

                    if (data.contact) {
                        document.getElementById('contactCard').classList.remove('hidden');
                        document.getElementById('contact').textContent = data.contact;
                    }

                    if (data.notes) {
                        document.getElementById('notesCard').classList.remove('hidden');
                        document.getElementById('notes').textContent = data.notes;
                    }

                    document.getElementById('confirmForm').addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const name = document.getElementById('confirmName').value.trim();
                        const email = document.getElementById('confirmEmail').value.trim();

                        if (!name || !email) {
                            showError('Vyplň prosím všechna pole');
                            return;
                        }

                        try {
                            await push(ref(db, `invitations/${invitationId}/confirmations`), {
                                name,
                                email,
                                confirmedAt: new Date().toISOString()
                            });
                            document.getElementById('confirmForm').classList.add('hidden');
                            document.getElementById('confirmSuccess').classList.remove('hidden');
                        } catch (err) {
                            showError('Chyba při ukládání: ' + err.message);
                        }
                    });

                    function showError(msg) {
                        document.getElementById('confirmErrorMsg').textContent = msg;
                        document.getElementById('confirmError').classList.remove('hidden');
                        setTimeout(() => {
                            document.getElementById('confirmError').classList.add('hidden');
                        }, 5000);
                    }

                } else {
                    document.getElementById('loading').innerHTML = "<p class='text-red-600 font-medium text-xl'>Pozvánka nenalezena.</p>";
                }
            }).catch(err => {
                document.getElementById('loading').innerHTML = `<p class='text-red-600 font-medium'>Chyba: ${err.message}</p>`;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Letecký Simulátor V10.0 - Full Texture Sync</title>
    <style>
        :root { --paper: #f4e4bc; --ink: #3e2723; --grass: #2d5a27; --asphalt: #222; --soil: #3d2b1f; }
        body { background: #1a1510; color: var(--ink); font-family: 'Courier New', monospace; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        #side-menu { width: 420px; background: var(--paper); border-right: 5px double var(--ink); padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; z-index: 300; overflow-y: auto; }
        #operator-panel { background: #000; color: #0f0; padding: 10px; border: 2px inset #444; font-size: 0.7em; border-radius: 5px; min-height: 110px; }
        .danger { color: #ff3333; font-weight: bold; }
        .ok { color: #00ff00; font-weight: bold; }
        .control-group { display: flex; flex-direction: column; border-bottom: 1px solid rgba(0,0,0,0.1); padding: 2px 0; }
        label { font-weight: bold; font-size: 0.55em; text-transform: uppercase; color: #5d4037; }
        select, input { padding: 2px; border: 1px solid var(--ink); font-size: 0.8em; background: #fff; }
        
        #main-stage { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; }
        #world { position: relative; width: 850px; height: 500px; background: #87CEEB; border: 8px solid var(--paper); overflow: hidden; }
        
        /* TERÉN A VRSTVY */
        #deep-earth { position: absolute; bottom: 0; width: 100%; height: 100px; background: var(--soil); z-index: 1; }
        .mountain { position: absolute; bottom: 100px; height: 350px; width: 851px; background-size: 100% 100%; z-index: 2; }
        /* zelený blok od úrovně ranveje dolů (pod texturou) */
        #green-bg { position: absolute; bottom: 0px; width: 100%; height: 200px; background: #4caf50; z-index: 2; display: block; }
        /* textura zem.png dlažděná vodorovně, každá dlaždice stejná velikost pro plynulé překládání */
        .ground-tex { position: absolute; bottom: 0px; height: 200px; width: 851px; background-image: url('https://tobi-09.github.io/skaut/img/zem.png'); background-size: 851px 200px; background-repeat: repeat-x; z-index: 3; display: block; }
        
        /* nižší ranvej aby texture a zelený blok byly pod ní */
        .runway { position: absolute; bottom: 60px; height: 30px; background: var(--asphalt); z-index: 10; border: 1px solid #444; }
        .runway-line { position: absolute; top: 50%; width: 100%; height: 3px; background: repeating-linear-gradient(90deg, #fff, #fff 30px, transparent 30px, transparent 60px); transform: translateY(-50%); }
        
        /* umístit letadlo níže při rozjezdu (nad ranvejí) */
        #plane-container { position: absolute; bottom: 75px; left: 80px; width: 120px; z-index: 50; transform: scaleX(-1) rotate(-335deg); transition: left 0.04s linear, bottom 0.04s linear, transform 0.08s ease; }
        #propeller { position: absolute; width: 30px; top: 72px; left: 10px; z-index: 51; transform-origin: center; }
        .cloud { position: absolute; width: 120px; opacity: 0.8; z-index: 8; pointer-events: none; }
        .status { position: absolute; top: 15px; left: 15px; background: var(--paper); padding: 10px; border: 2px solid var(--ink); z-index: 200; font-size: 0.75em; font-weight: bold; }
        #explosion { position: absolute; width: 280px; display: none; transform: translate(-50%, 0); z-index: 100; bottom: 0; }
        .btn-launch { background: #b22222; color: #fff; padding: 12px; cursor: pointer; font-weight: bold; border: 4px outset #8b0000; margin-top: 10px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin { animation: spin 0.4s linear infinite; }
        /* OVERLAY FX pro počasí */
        #overlay-fx { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 99; pointer-events: none; display: none; }
        .overlay-fog { background: rgba(255, 255, 255, 0.4); }
        .overlay-sand { background: rgba(210, 180, 100, 0.3); }
        .overlay-storm { background: rgba(80, 80, 120, 0.2); }
          /* Fullscreen režim - zvětší hlavní "okénko" (#world) na celou obrazovku
              bez trvalého skrytí postranního panelu; JS poté dynamicky škáluje #world. */
          body.fullscreen-mode { overflow: hidden; }
          /* Rozšířit main-stage tak, aby využívalo výšku okna; panel zůstane viditelný */
          body.fullscreen-mode #main-stage { flex: none; width: calc(100vw); height: 100vh; display:flex; align-items:center; justify-content:center; }
          /* #world bude pozicován/škálován dynamicky v JS (origin vlevo nahoře) */
          body.fullscreen-mode #world { border: 0; transform-origin: left top; }
          /* Lehké úpravy prvků v režimu fullscreen (JS provede hlavní škálování) */
          body.fullscreen-mode #plane-container { transition: transform 0.08s ease, bottom 0.04s linear; }
          body.fullscreen-mode #propeller { transition: none; }
          body.fullscreen-mode .cloud { opacity: 0.95; }
          body.fullscreen-mode .mountain { height: 420px; }
          body.fullscreen-mode .ground-tex { height: 300px; background-size: cover; }
    </style>
</head>
<body>

<div id="side-menu">
    <h2 style="margin:0; font-size: 0.9em; text-align: center;">✈️ AERODYNAMIKA V10.0</h2>
    <div id="operator-panel"><div id="op-res"></div><div id="op-stats"></div><div id="op-calc" style="font-size:0.7em;margin-top:6px;line-height:1.2em;"></div></div>
    
    <div class="control-group"><label>Biom (Lokalita)</label>
        <select id="sel-biome" onchange="initWorldState()"><option value="louka">🌳 LOUKA (standard)</option><option value="hory">🏔️ HORY</option><option value="pust">🏜️ POUŠŤ</option><option value="arktida">❄️ ARKTIDA</option></select>
    </div>
    <div class="control-group"><label>Počasí</label>
        <select id="sel-weather" onchange="initWorldState()"><option value="jasno">☀️ JASNO</option><option value="mlha">🌫️ MLHA</option><option value="piesecna">🌪️ PÍSEČNÁ BOUŘE</option><option value="boure">⛈️ BOUŘE</option></select>
    </div>
    <div class="control-group"><label>Vzdálenost (km)</label><input type="number" id="inp-km" value="1200" onchange="updateOperator()"></div>
    <div class="control-group"><label>Ranvej (m)</label><input type="number" id="inp-rw" value="1000" onchange="updateOperator()"></div>

    <div id="ui-gen"></div>
    <button class="btn-launch" onclick="launchSimulation()">ZAHÁJIT LET</button>
    <button id="btn-full" class="btn-launch" style="background:#333;margin-top:6px;">ZOBRAZIT NA CELOU OBRAZOVKU</button>
</div>

<div id="main-stage">
    <div id="world">
        <div class="status" id="msg">PŘIPRAVEN KE STARTU</div>
        <div id="overlay-fx"></div>
        <div id="green-bg"></div>
        <div id="mount1" class="mountain"></div><div id="mount2" class="mountain"></div>
        <div id="deep-earth"></div>
        <div id="g1" class="ground-tex" style="left: 0;"></div><div id="g2" class="ground-tex" style="left: 851px;"></div>
        <div id="grass-layer"></div>
        
        <div id="rw-s" class="runway"><div class="runway-line"></div></div>
        <div id="rw-f" class="runway" style="display:none;"><div class="runway-line"></div></div>
        
        <div id="plane-container">
            <img id="plane-img" src="https://tobi-09.github.io/skaut/img/letadlo.png" style="width:100%;">
            <img id="propeller" src="https://tobi-09.github.io/skaut/img/vrtule.png">
        </div>
        <img id="explosion" src="https://tobi-09.github.io/skaut/img/bum.png">
    </div>
</div>

<script>
const DB = {
    M: { n: "MOTOR", opt: [
        { id: "M1", vz:150, va:40, price:100, sp:10, od:1, ma:2, ry:60 },
        { id: "M2", vz:400, va:90, price:250, sp:25, od:2, ma:3, ry:110 },
        { id: "M3", vz:800, va:180, price:500, sp:45, od:3, ma:1, ry:160 },
        { id: "M4", vz:1200, va:310, price:850, sp:70, od:4, ma:0, ry:220 },
        { id: "M5", vz:1800, va:550, price:1400, sp:110, od:5, ma:-3, ry:280 }
    ] },
    K: { n: "KŘÍDLA", opt: [
        { id: "K1", vz:100, va:20, price:50, od:5, ma:1, ry:-30 },
        { id: "K2", vz:300, va:60, price:150, od:2, ma:4, ry:20 },
        { id: "K3", vz:700, va:150, price:300, od:4, ma:2, ry:-10 },
        { id: "K4", vz:1100, va:280, price:600, od:3, ma:1, ry:0 },
        { id: "K5", vz:2200, va:600, price:1100, od:-4, ma:2, ry:-60 }
    ] },
    T: { n: "TRUP", opt: [
        { id: "T1", vz:0, va:15, price:30, od:-5, ma:4, ry:10 },
        { id: "T2", vz:0, va:80, price:100, od:2, ma:2, ry:0 },
        { id: "T3", vz:0, va:160, price:250, od:4, ma:1, ry:-10 },
        { id: "T4", vz:0, va:350, price:700, od:8, ma:-1, ry:-25 },
        { id: "T5", vz:0, va:800, price:1500, od:15, ma:-5, ry:-80 }
    ] },
    P: { n: "PALIVO", opt: [
        { id: "P1", vz:0, va:30, price:20, pal:20, od:0, ma:1, ry:0 },
        { id: "P2", vz:0, va:100, price:60, pal:50, od:1, ma:0, ry:-5 },
        { id: "P3", vz:0, va:250, price:150, pal:100, od:-2, ma:1, ry:-15 },
        { id: "P4", vz:0, va:500, price:300, pal:250, od:-5, ma:-2, ry:-40 },
        { id: "P5", vz:0, va:300, price:500, pal:80, od:8, ma:-1, ry:-10 }
    ] },
    D: { n: "PODVOZEK", opt: [
        { id: "D1", vz:0, va:20, price:30, od:1, ma:0, ry:0 },
        { id: "D2", vz:0, va:35, price:70, od:3, ma:-1, ry:-5 },
        { id: "D3", vz:0, va:30, price:80, od:4, ma:0, ry:-10 },
        { id: "D4", vz:50, va:120, price:200, od:-30, ma:-3, ry:2 },
        { id: "D5", vz:0, va:150, price:550, od:2, ma:4, ry:25 }
    ] },
    R: { n: "VRTULE", opt: [
        { id: "R1", vz:20, va:5, price:20, od:0, ma:1, ry:10 },
        { id: "R2", vz:50, va:15, price:60, od:1, ma:0, ry:30 },
        { id: "R3", vz:100, va:25, price:150, od:1, ma:2, ry:50 },
        { id: "R4", vz:200, va:45, price:300, od:2, ma:-1, ry:70 },
        { id: "R5", vz:350, va:80, price:600, od:3, ma:1, ry:100 }
    ] },
    O: { n: "KOKPIT", opt: [
        { id: "O1", vz:0, va:5, price:10, od:-3, ma:2, ry:5 },
        { id: "O2", vz:0, va:15, price:40, od:0, ma:1, ry:0 },
        { id: "O3", vz:0, va:40, price:120, od:2, ma:0, ry:-5 },
        { id: "O4", vz:0, va:70, price:250, od:5, ma:-1, ry:-15 },
        { id: "O5", vz:0, va:180, price:700, od:10, ma:-4, ry:-40 }
    ] },
    N: { n: "NÁKLAD", opt: [
        { id: "N1", vz:0, va:50, price:10, od:0, ma:0, ry:0 },
        { id: "N2", vz:0, va:85, price:100, od:0, ma:0, ry:0 },
        { id: "N3", vz:0, va:170, price:200, od:0, ma:-1, ry:0 },
        { id: "N4", vz:0, va:400, price:500, od:-3, ma:0, ry:0 },
        { id: "N5", vz:0, va:900, price:1200, od:0, ma:-6, ry:0 }
    ] },
    G: { n: "NAVIGACE", opt: [
        { id: "G1", vz:0, va:1, price:5 },
        { id: "G2", vz:0, va:2, price:25 },
        { id: "G3", vz:0, va:15, price:150 },
        { id: "G4", vz:0, va:25, price:400 },
        { id: "G5", vz:0, va:5, price:200 }
    ] },
    C: { n: "CHLAZENÍ", opt: [
        { id: "C1", vz:0, va:5, price:15, od:-2, ma:1, ry:5 },
        { id: "C2", vz:0, va:30, price:60, od:2, ma:0, ry:0 },
        { id: "C3", vz:0, va:45, price:120, od:4, ma:0, ry:-5 },
        { id: "C4", vz:0, va:80, price:300, od:5, ma:-1, ry:-10 },
        { id: "C5", vz:0, va:100, price:500, od:8, ma:0, ry:-15 }
    ] }
};

const ui = document.getElementById('ui-gen');
for(let k in DB){
    let d = document.createElement('div'); d.className='control-group';
    d.innerHTML=`<label>${DB[k].n}</label><select id="s-${k}" onchange="updateOperator()">${DB[k].opt.map(o=>`<option value="${o.id}">${o.id}</option>`).join('')}</select>`;
    ui.appendChild(d);
}

let clouds = [], currentSpeed = 0, stormActive = false;

function getStats() {
    let s = {VZ:0, VA:0, OD:0, RY:0, PAL:0, SP:0, MA:0, G:0, C:0, IMG:"letadlo.png"};
    for(let k in DB){
        let val = document.getElementById('s-'+k).value;
        let o = DB[k].opt.find(x=>x.id===val);
        for(let key in s) if(key!=="IMG") s[key] += o[key.toLowerCase()]||0;
    }
    // Explicitně nastavit úroveň Navigace (G) a Chlazení (C) podle vybrané položky (G1..G5, C1..C5)
    try {
        const gsel = document.getElementById('s-G') && document.getElementById('s-G').value;
        s.G = gsel ? parseInt(gsel.replace(/\D/g,'')) || 0 : s.G;
    } catch(e) { s.G = s.G; }
    try {
        const csel = document.getElementById('s-C') && document.getElementById('s-C').value;
        s.C = csel ? parseInt(csel.replace(/\D/g,'')) || 0 : s.C;
    } catch(e) { s.C = s.C; }

    if(document.getElementById('s-T').value === "T5") s.IMG = "letadlo2.png";
    return s;
}

// Odhad ceny dílů na základě vybraných úrovní komponent
function estimatePartsCost() {
    let total = 0;
    for (let k in DB) {
        try {
            const sel = document.getElementById('s-'+k).value;
            const opt = DB[k].opt.find(x => x.id === sel);
            if(opt && typeof opt.price === 'number') total += opt.price;
        } catch(e) { /* ignore if missing */ }
    }
    return Math.round(total);
}

// OKAMŽITÉ NAČTENÍ SVĚTA
function initWorldState() {
    const biome = document.getElementById('sel-biome').value;
    const weather = document.getElementById('sel-weather').value;
    const m1 = document.getElementById('mount1'), m2 = document.getElementById('mount2');
    const rw_s = document.getElementById('rw-s');
    const s = getStats();
    const overlay = document.getElementById('overlay-fx');

    // Generuj runwey až do vzletu (zvýšit pixelovou šířku podle vstupu)
    const inputRw = parseInt(document.getElementById('inp-rw').value) || 1000;
    const scale = 1.5; // škálovací faktor pixelů na metr pro širší runvej
    const estimatedTakeoffPixels = (s.VZ > s.VA) ? Math.round(200 * 0.7 + 100) : 1500;
    const rwPixels = Math.round(Math.max(inputRw * scale, estimatedTakeoffPixels));
    rw_s.style.width = Math.min(rwPixels, 4000) + "px"; // omezit maximálně
    rw_s.style.left = "0px";
    // Nižší pozice runwaye tak, aby textura/green blok byly pod ní
    const runwayBottom = 60;
    const runwayHeight = 30;
    rw_s.style.bottom = runwayBottom + "px";
    if(document.getElementById('rw-f')) document.getElementById('rw-f').style.bottom = runwayBottom + "px";
    // Nastav zelený blok tak, aby jeho horní hrana byla na úrovni horní hrany runwaye
    const green = document.getElementById('green-bg');
    if(green){
        green.style.bottom = '0px';
        green.style.height = (runwayBottom + runwayHeight) + 'px';
        // Barva země podle biomu
        const worldEl = document.getElementById('world');
        if(biome === 'louka') {
            green.style.background = '#4caf50';
            if(worldEl) worldEl.style.background = '#87CEEB';
        } else if(biome === 'hory') {
            green.style.background = '#2e8b57';
            if(worldEl) worldEl.style.background = '#9fb7c8';
        } else if(biome === 'pust') {
            green.style.background = '#cbb28a';
            if(worldEl) worldEl.style.background = '#f6e6c2';
        } else if(biome === 'arktida') {
            green.style.background = '#e6f9ff';
            if(worldEl) worldEl.style.background = '#eafcff';
        }
    }

    // BIOM LOGIKA: Nastavení hor a terénu
    const setM = (el) => {
        if(biome === "hory") {
            el.style.display = "block";
            el.style.backgroundImage = `url('https://tobi-09.github.io/skaut/img/Hory-${Math.random()>0.5?'jaro':'zyma'}.png')`;
        } else {
            el.style.display = "none";
        }
    };
    setM(m1); setM(m2); m1.style.left="0px"; m2.style.left="851px";

    // POČASÍ LOGIKA: Overlay FX nastavení
    overlay.className = '';
    overlay.style.display = 'none';
    
    let weatherFilter = 'brightness(1.8)'; // Default jasno
    
    if(weather === "mlha") {
        overlay.className = 'overlay-fog';
        overlay.style.display = 'block';
        weatherFilter = 'brightness(1.2)';
    } else if(weather === "piesecna") {
        overlay.className = 'overlay-sand';
        overlay.style.display = 'block';
        weatherFilter = 'brightness(1.0) sepia(0.3)';
    } else if(weather === "boure") {
        overlay.className = 'overlay-storm';
        overlay.style.display = 'block';
        weatherFilter = 'brightness(0.3) hue-rotate(220deg)';
    }
    
    clouds.forEach(c => {
        c.el.style.filter = weatherFilter;
    });
    // Pokud je biom arktida nebo poušť, skryj dlažděnou zemní texturu (použij čistou barvu)
    const g1El = document.getElementById('g1'), g2El = document.getElementById('g2');
    if (biome === 'arktida' || biome === 'pust') {
        if (g1El) g1El.style.display = 'none';
        if (g2El) g2El.style.display = 'none';
    } else {
        if (g1El) g1El.style.display = 'block';
        if (g2El) g2El.style.display = 'block';
    }
    
    // Umístit letadlo níže nad ranvejí
    document.getElementById('plane-container').style.bottom = "75px";
    updateOperator();
}

function updateOperator() {
    const s = getStats();
    const km = parseInt(document.getElementById('inp-km').value);
    const biome = document.getElementById('sel-biome').value;
    const weather = document.getElementById('sel-weather').value;
    document.getElementById('plane-img').src = "https://tobi-09.github.io/skaut/img/" + s.IMG;

    // Modifikátor spotřeby paliva podle biomu
    let fuelModifier = 1.0;
    if (biome === "pust") fuelModifier = 1.2; // Poušť: +20% spotřeba
    
    // Vzorec: fuelNeeded = (SP/50 * km/8 + 1.2) * fuelModifier
    // Lineárně závislá na km (bez nesmyslné konstanty 300)
    let fuelNeeded = (s.SP/50 * (km/8) + 1.2) * fuelModifier;
    let outcome = "DOLETÍ V POŘÁDKU";
    let issues = [];

    // Kontrola výšky a váhy
    if (s.VZ <= s.VA) { outcome = "NESTIHL VZLETĚT!"; issues.push("VZ ≤ VA"); }
    
    // Kontrola paliva
    else if (s.PAL < fuelNeeded) { outcome = "PALIVO - HAVÁRIE!"; issues.push("Palivo"); }
    
    // Biom: HORY
    else if (biome === "hory" && s.MA < 2) { outcome = "NÁRAZ DO HOR!"; issues.push("MA < 2"); }
    
    // Biom: ARKTIDA
    else if (biome === "arktida" && s.OD < 12) { outcome = "TRUP ZKŘEHNE!"; issues.push("OD < 12"); }
    
    // Počasí: BOUŘE
    else if (weather === "boure" && s.OD < 10) { outcome = "BOUŘE - HAVÁRIE!"; issues.push("OD < 10"); }
    
    // Počasí: MLHA (navigace)
    else if (weather === "mlha" && s.G*5 < 15) { outcome = "BLOUDĚNÍ - PALIVO!"; issues.push("G nízké"); }
    
    // Počasí: PÍSEČNÁ BOUŘE (je kombinace mlhy a vysokého odporu)
    else if (weather === "piesecna" && (s.G*5 < 12 || s.OD < 6)) { outcome = "PÍSEČNÁ BOUŘE - HAVÁRIA!"; issues.push("G/OD"); }
    
    // BIOM: POUŠŤ - Vyžaduje dostatečné chlazení (vysoká tepla v motoru)
    // V poušti: heatGeneration = 0.1 + 0.15 = 0.25 base; pak se násobí (1 + SP/100) během letu
    // Chlazení sníží teplotu o C*0.05 per tick
    const baseHeatInDesert = 0.25;
    const coolingPerTick = s.C * 0.05;
    if (biome === "pust" && coolingPerTick < baseHeatInDesert * 0.5) {
        outcome = "MOTOR PŘEHŘEJE V POUŠTI!";
        issues.push("Chlazení < 12.5% base heat");
    }

    document.getElementById('op-res').innerHTML = `VÝSLEDEK: <span class="${outcome.includes('POŘÁDKU')?'ok':'danger'}">${outcome}</span>`;
    document.getElementById('op-stats').innerHTML = `VZTLAK: ${s.VZ} | VÁHA: ${s.VA} | OD: ${s.OD} | NAVIGACE: ${s.G} | CHLADIČ: ${s.C} | PAL: ${s.PAL}L`;

    // Detailed calculation breakdown
    const power = s.VZ - s.VA;
    const powerDisplay = Math.round(power);
    const accel = Math.max(power / 1000, 0.5);
    const v_takeoff = Math.max(20, s.VA / 10);
    const t_to_takeoff = +(v_takeoff / accel).toFixed(2);
    const dist_to_takeoff = +(0.5 * accel * t_to_takeoff * t_to_takeoff).toFixed(1);
    const fuelRemaining = +(s.PAL - fuelNeeded).toFixed(1);
    const fuelPerKm = +(fuelNeeded / Math.max(1, km)).toFixed(2);
    const estFrames = Math.round(t_to_takeoff / 0.03);

    const partsCost = estimatePartsCost();

    // Diagnostika chlazení a tepla motoru podle biomu
    let heatInfo = "";
    if (biome === "pust") {
        const baseHeat = 0.25; // 0.1 + 0.15
        const coolingPower = s.C * 0.05;
        const heatBalance = coolingPower - baseHeat;
        const status = heatBalance >= 0 ? "✓ OK" : "⚠️ RIZIKO";
        heatInfo = `<div><strong>🔥 Chlazení v poušti:</strong></div>
                   <div>Heat Gen.: ${baseHeat} L/tick | Cooling: ${coolingPower.toFixed(2)} L/tick | Bilance: ${heatBalance.toFixed(2)} ${status}</div>`;
    } else if (biome === "arktida") {
        heatInfo = `<div><strong>❄️ Arktida:</strong> Nízké teplo, chlazení není kritické. OD ≥ 12 = potřeba odolnosti.</div>`;
    }

    const calcHtml = `
        <div><strong>Výpočty:</strong></div>
        <div>Biom: ${biome.toUpperCase()} (mod: ${(fuelModifier*100).toFixed(0)}%)</div>
        <div>Power margin (VZ-VA): ${powerDisplay}</div>
        <div>Akcelerace (m/s²): ${accel.toFixed(2)}</div>
        <div>Požadovaná rychlost vzletu (m/s): ${v_takeoff.toFixed(1)}</div>
        <div>Spotřeba paliva (celkem): ${fuelNeeded.toFixed(1)} L</div>
        <div>Zbývající palivo: ${fuelRemaining} L</div>
        <div>Cena dílů (orient.): ${partsCost} Kč</div>
        ${heatInfo}
        ${issues.length > 0 ? `<div style="color: #ff3333;"><strong>⚠️ Problémy:</strong> ${issues.join(', ')}</div>` : ''}
        <hr>
        <div><strong>Jak fungují výpočty:</strong></div>
        <div>- Vztlak vs Váha: porovnává se <em>VZ</em> a <em>VA</em>. Pokud <em>VZ ≤ VA</em>, stroj nezvládne vzlet.</div>
        <div>- Spotřeba paliva: <em>(SP/50 × km/8 + 1.2) × fuelMod</em>. V poušti se násobí <em>1.2</em>.</div>
        <div>- Navigace (G): úroveň od 1-5. Při mlze/bouři s G&lt;3 může dojít ke ztracení (missionEnd += 300).</div>
        <div>- Odolnost (OD): součet atributů T+O+K. Bouře vyžaduje OD≥10; Arktida OD≥8.</div>
        <div>- Chlazení (C): každé tick sníží teplotu o <em>C×0.05°C</em>. V poušti je base heat 0.25°C/tick.</div>
        <div>- Přehřátí: pokud <em>engineTemp &gt; 100°C</em> ve vzduchu → pád.</div>
    `;
    document.getElementById('op-calc').innerHTML = calcHtml;
}

// Fallback detailed prediction generator used if original is missing
function predictFlightDetailed() {
    const s = getStats();
    const km = parseInt(document.getElementById('inp-km').value);
    const rw_m = parseInt(document.getElementById('inp-rw').value);
    const weather = document.getElementById('sel-weather').value;
    const biome = document.getElementById('sel-biome').value;

    // quick pre-checks (match updateOperator rules)
    // VZOREC: fuelNeeded = (s.SP/50 * km/8 + 1.2) * fuelModifier
    // Lineárně závislá na km, bez konstanty
    let fuelModifier = (biome === "pust") ? 1.2 : 1.0;
    let fuelNeeded = (s.SP/50 * (km/8) + 1.2) * fuelModifier;
    if (s.VZ <= s.VA) return { success:false, reason: 'NESTIHL VZLETĚT!' };
    if (s.PAL < fuelNeeded) return { success:false, reason: 'PALIVO NEDOSTAČUJE' };
    if (biome === 'hory' && s.MA < 2) return { success:false, reason: 'NÁRAZ DO HOR' };
    if (weather === 'boure' && s.OD < 8) return { success:false, reason: 'BOUŘE - NEBEZPEČÍ' };

    const frames = [];
    const dt = 0.03; // seconds per frame (playback uses 30ms)
    let v = 0; // m/s
    let x = 0; // meters travelled along runway
    // visual mapping: ensure predicted px stays inside the world
    const worldWidth = (document.getElementById('world') && document.getElementById('world').clientWidth) || 850;
    const planeWidth = (document.getElementById('plane-container') && document.getElementById('plane-container').clientWidth) || 120;
    const maxPx = Math.max(100, worldWidth - planeWidth - 10);
    let px = 80;

    // simple physics tuning based on stat difference
    const power = Math.max(s.VZ - s.VA, 50);
    const a = Math.max(power / 1000, 0.5); // m/s^2
    const v_takeoff = Math.max(20, s.VA / 10); // heuristic

    // ground roll frames
    let t = 0;
    const initialBottom = 75;
    while (t < 20000 && x < rw_m && frames.length < 10000) {
        v += a * dt;
        x += v * dt;
        t += dt;
        const cs = v * 0.08; // convert m/s -> visual unit for background movement
        const tilt = Math.min(12, v * 0.4);
        // advance visual x, clamp to world
        px += Math.min(4, Math.max(0.3, v * 0.06));
        if(px > maxPx) px = maxPx;
        frames.push({ time: Math.round(t), py: initialBottom, cs: cs, tilt: tilt, falling: false, px: Math.round(px) });
        if (v >= v_takeoff && x >= Math.min(rw_m, Math.max(50, rw_m * 0.2))) break; // allow short run to accelerate
    }

    // if runway exhausted and still not reached takeoff speed -> failure
    if (x < rw_m && v < v_takeoff) {
        return { success: false, reason: 'NEDOSTATEK RYCHLOSTI NA KONCI RANVEJE' };
    }

    // liftoff and climb frames
    const climbFrames = 80;
    for (let i=0;i<climbFrames;i++){
        const climbProgress = (i+1)/climbFrames;
        // climb: increase bottom (py) so plane appears to rise on screen
        const py = initialBottom + Math.round( 60 * Math.sin(climbProgress * Math.PI/2) );
        const cs = v * 0.08;
        const tilt = Math.min(12, v * 0.4) - Math.round(climbProgress*6);
        px += Math.min(3, Math.max(0.5, v * 0.04));
        if(px > maxPx) px = maxPx;
        frames.push({ time: Math.round(t + i*dt), py: py, cs: cs, tilt: tilt, falling: false, px: Math.round(px) });
    }

    const partsCost = estimatePartsCost();

    return { success: true, frames: frames, partsCost: partsCost, fuelNeeded: Math.round(fuelNeeded) };
}

function launchSimulation() {
    updateOperator();
    const s = getStats(), km = parseInt(document.getElementById('inp-km').value);
    const biome = document.getElementById('sel-biome').value;
    const weather = document.getElementById('sel-weather').value;
    const rw_s = document.getElementById('rw-s'), rw_f = document.getElementById('rw-f');
    const log = document.getElementById('msg');
    
    document.getElementById('explosion').style.display="none";
    document.getElementById('plane-container').style.display="block";
    // ensure propeller visible at start
    const propStart = document.getElementById('propeller'); if(propStart) propStart.style.display='block';
    rw_f.style.display = "none";
    rw_s.style.left = "0px"; // reset runway position
    rw_s.style.bottom = "60px"; // nižší ranvej pro shodu s texturou
    if(rw_f) rw_f.style.bottom = "60px";

    // Generate runway to takeoff point (increase pixel width)
    const inputRw2 = parseInt(document.getElementById('inp-rw').value) || 1000;
    const scale = 1.5; // local scale (pixels per meter heuristic)
    const estimatedTakeoffPixels = (s.VZ > s.VA) ? Math.round(200 * 0.7 + 100) : 1500;
    const runwayBottom = 60;
    const runwayHeight = 30;
    const rwPixels2 = Math.round(Math.max(inputRw2 * scale, estimatedTakeoffPixels));
    if (s.VZ > s.VA) {
        rw_s.style.width = Math.min(rwPixels2, 4000) + "px";
    } else {
        rw_s.style.width = Math.round(200 * scale) + "px";
    }
    rw_s.style.bottom = runwayBottom + "px";
    if(rw_f) rw_f.style.bottom = runwayBottom + "px";
    const green = document.getElementById('green-bg');
    if (green) green.style.height = (runwayBottom + runwayHeight) + 'px';

    let px=80, py=75, time=0, falling=false, reason="", g1x=0, g2x=851, h1x=0, h2x=851;
    let fuel=s.PAL, targetSpeed=10+(s.RY/35);
    let fallRotation = 0; // extra nose-down rotation applied during fall
    let fallRotationTarget = 0;
    let takeoffTick = null; // tick when climb/takeoff started
    let flipToOtherSide = false; // flip plane horizontally on storm crash
    let engineTemp = 20; // Teplota motoru (počáteční 20°C)
    let navigationLost = false; // Je letadlo ztracené?
    stormActive = false;
    let stormImpactCountdown = null; // pokud se bouře aktivuje, začne odpočet k zásahu oka
    let severeStorm = false;
    let severeStormTicks = 0;
    let stormCrashCountdown = null;

    // SYSTÉM NAVIGACE: Pokud je počasí špatné a navigace slabá, letadlo se ztratí
    if((weather === "mlha" || weather === "piesecna" || weather === "boure") && s.G < 3) {
        navigationLost = true;
    }

    // Vypočti očekávanou celkovou spotřebu dle predikčního vzorce
    // fuelNeeded = (SP/50 * (km/8) + 1.2) * fuelModifier
    let launchFuelModifier = (biome === "pust") ? 1.2 : 1.0;
    let expectedFuelNeeded = (s.SP/50 * (km/8) + 1.2) * launchFuelModifier;
    // Rozložení spotřeby bude nyní závislé na skutečně ujeté vzdálenosti (L na metr)
    const totalDistanceMeters = Math.max(1, km * 1000);
    const fuelPerMeter = expectedFuelNeeded / totalDistanceMeters; // L per meter

    // Odhad délky mise v tickech (dt = 0.03s na tick). Použij průměrnou rychlost založenou na targetSpeed
    const dt = 0.03;
    const avgSpeed = Math.max(10, targetSpeed); // m/s (konzervativní odhad)
    // Omezit délku mise na maximálně 60 sekund (nezávisle na vzdálenosti)
    const maxMissionTicks = Math.round(60 / dt); // ~2000 ticků
    let missionEnd = Math.round((totalDistanceMeters / avgSpeed) / dt) + 500; // ticks (+rezerva pro start/climb)
    missionEnd = Math.min(missionEnd, maxMissionTicks);
    // Pokud se letadlo ztratí v mlze/písku, prodluž misi o ~300 ticků
    // (navigationLost je nastaveno výše)
    if((weather === "mlha" || weather === "piesecna" || weather === "boure") && s.G < 3) {
        missionEnd += 300;
    }

    // Sleduj skutečně ujetou vzdálenost pro korektní zobrazení a logiku
    let distanceTravelled = 0;

    const loop = setInterval(() => {
        time++;
        document.getElementById('propeller').style.transform = `rotate(${time * 30}deg)`;
        if(currentSpeed < targetSpeed && !falling) currentSpeed += 0.1;
        // fullscreen scaling available for climb/cruise calculations
        const worldEl_top = document.getElementById('world');
        const fullscreen_top = document.body.classList.contains('fullscreen-mode');
        const worldH_top = worldEl_top ? worldEl_top.clientHeight : 500;
        const fsScale_top = fullscreen_top ? (worldH_top / 500) : 1;

        // MOTOR - TEPLOTA A CHLAZENÍ
        // Motor se přehřívá POUZE při dlouhých letech (>500km) nebo v extrémních podmínkách
        const shouldGenerateHeat = (km > 500) || (biome === "pust") || (weather === "piesecna") || (weather === "boure");
        if (shouldGenerateHeat) {
            let heatGeneration = 0.1; // Základní teplo
            if(biome === "pust") heatGeneration += 0.15; // Poušť = +50% více tepla
            if(time > 200) heatGeneration *= (1 + s.SP/100); // Čím větší motor, tím více tepla
            engineTemp += heatGeneration;
        }
        // Chlazení: Vychladit motor
        engineTemp = Math.max(20, engineTemp - s.C * 0.05); // Chlazení sníží teplotu
        
        // Pokud motor přehřeje, způsobí pád pouze pokud je letadlo už ve vzduchu (a když má smysl)
        if(shouldGenerateHeat && engineTemp > 100 && py > 120) {
            falling = true;
            reason = "PŘEHŘÁTÝ MOTOR!";
        }

        // POČASÍ - OKO BOUŘE
            // Aktivuj bouři až po vzletu (po rampě)
            if(weather === "boure" && !stormActive && time > 200) {
                stormActive = true;
                stormImpactCountdown = 30; // ~30 ticks do zásahu oka
                for(let i=0; i<30; i++){
                    let c = document.createElement('img'); c.src="https://tobi-09.github.io/skaut/img/mrak.png";
                    c.className='cloud'; c.style.filter="brightness(0.2)";
                    let cx = 850+Math.random()*400; let ct = Math.random()*350;
                    c.style.left=cx+"px"; c.style.top=ct+"px";
                    document.getElementById('world').appendChild(c);
                    clouds.push({el:c, x:cx, s:1.5, baseTop: ct});
                }
            }

            // Pokud bouře byla aktivována, začne odpočítávání k zásahu oka bouře.
            if(stormActive && stormImpactCountdown !== null) {
                stormImpactCountdown--;
                // Po vypršení odpočtu nevypouštíme okamžitý pád, ale aktivujeme fázi silné turbulence
                if(stormImpactCountdown <= 0 && (time > 200 || py > 75)) {
                    stormImpactCountdown = null;
                    // severeStorm trvá určitou dobu; pokud není OD dostatečná, může po ukončení selhat
                    severeStorm = true;
                    severeStormTicks = 180; // ~několik sekund velmi silné turbulence
                    // Pokud je odolnost pod prahem, spusť krátký odpočet do možného selhání
                    if (s.OD < 10) {
                        stormCrashCountdown = 10; // ~10 ticků do pádu
                    }
                }
            }

        // POHYB TERÉNU
        g1x -= currentSpeed; g2x -= currentSpeed;
        if(g1x<=-851) g1x=g2x+851; if(g2x<=-851) g2x=g1x+851;
        document.getElementById('g1').style.left=g1x+"px"; document.getElementById('g2').style.left=g2x+"px";
        rw_s.style.left = (parseFloat(rw_s.style.left) - currentSpeed) + "px";

        if(biome==="hory"){
            h1x -= currentSpeed*0.35; h2x -= currentSpeed*0.35;
            if(h1x<=-851) { h1x=h2x+851; } if(h2x<=-851) { h2x=h1x+851; }
            document.getElementById('mount1').style.left=h1x+"px"; document.getElementById('mount2').style.left=h2x+"px";
        }

        // LOGIKA PÁDU - Všechny selhání
        if(!falling){
            // Spotřeba paliva založená na ujeté vzdálenosti (v metrech)
            const dt_local = 0.03; // seconds per tick (shodné s loop interval)
            // Během fáze cestování (po stoupání) necháme vzdálenost ubíhat lineárně podle missionEnd
            let distanceThisTick;
            if (time >= 500 && missionEnd > 0) {
                const perTickDistance = totalDistanceMeters / missionEnd; // garantuje, že do missionEnd uběhne celá vzdálenost
                distanceThisTick = perTickDistance;
            } else {
                distanceThisTick = currentSpeed * dt_local; // při rozjezdu a stoupání použij reálnou rychlost
            }
            distanceTravelled += distanceThisTick;
            fuel -= fuelPerMeter * distanceThisTick;

            if (fuel <= 0 && py > 75) {
                falling = true; reason = "PALIVO VYČERPÁNO!";
            }
            
            // BIOM: HORY - Vyžaduje MA >= 2
            if(biome==="hory" && s.MA < 2 && time > 400) { 
                falling=true; reason="NÁRAZ DO HOR!";
            }
            
            // BIOM: ARKTIDA - Vyžaduje OD >= 12, trup zkřehne v polovině letu
            if(biome==="arktida" && s.OD < 12 && time > missionEnd * 0.5) {
                falling=true; reason="TRUP ZKŘEHNE!";
            }
            
            // POČASÍ: BOUŘE - Vyžaduje OD >= 10 (pád až po polovině mise)
            if(weather==="boure" && s.OD < 10 && stormActive && time > missionEnd * 0.5) {
                falling = true; reason = "BOUŘE - HAVÁRIE!";
            }
            
            // POČASÍ: MLHA - Nízká navigace znamená kolizi
            if(weather==="mlha" && navigationLost && time > missionEnd * 0.8 && s.G < 3) {
                falling=true; reason="BLOUDĚNÍ - KOLIZE!";
            }
            
            // POČASÍ: PÍSEČNÁ BOUŘE - Kombinace slabé navigace a slabé odolnosti
            if(weather==="piesecna" && (s.G < 2 || s.OD < 6) && time > 400) {
                falling=true; reason="PÍSEČNÁ BOUŘE - HAVÁRIE!";
            }
        }

        if(!falling) {
            // ROZJEZD: akcelerace na runway (0-200)
            if(time < 200) { 
                px += (s.VZ > s.VA ? 0.7 : 0.05); 
                if(py < 85 && time > 180 && s.VZ <= s.VA) { 
                    falling=true; reason="NESTIHL VZLETĚT!";
                } 
            }
            // STOUPÁNÍ: zvyšování výšky (200-500)
            else if(time < 500) { 
                // zvyšte rychlost stoupání při fullscreen proporčně
                const climbTarget = Math.min(worldH_top * 0.65, 320 * fsScale_top);
                py = Math.min(py + 2 * fsScale_top, climbTarget); 
                // zaznamenat okamžik vzletu (první tick stoupání)
                if (!takeoffTick) takeoffTick = time;
            }
            // CESTOVÁNÍ: stabilní let v uvedené výšce (500-missionEnd)
                else if(time < missionEnd) { 
                const cruiseAlt = Math.min(worldH_top * 0.65, 320 * fsScale_top);
                py = cruiseAlt + Math.sin(time*0.1) * 5 * fsScale_top;
                const remainMeters = Math.max(0, totalDistanceMeters - distanceTravelled);
                const remainKm = Math.round(remainMeters/1000);
                let navInfo = navigationLost ? " ⚠️ ZTRACENO!" : "";
                log.innerText="VZDÁLENOST: "+remainKm+"km" + navInfo;
            }
            // PŘISTÁNÍ: sestup k ranveji (missionEnd+)
            else {
                rw_f.style.display="block"; 
                rw_f.style.width="1500px";
                let fPos = 1200 - (time-missionEnd)*currentSpeed; 
                rw_f.style.left = fPos+"px";
                py -= 2; 
                if(py <= 75) { 
                    py=75; 
                    px = 425;
                    rw_f.style.left = (px - 750) + "px";
                    currentSpeed = 0;
                    clearInterval(loop); 
                    log.innerText="MISE SPLNĚNA!"; 
                } else {
                    currentSpeed *= 0.95;
                }
            }
        } else {
            // PÁD: snížení výšky a brzda (rychlejší sestup při pádu)
            py -= 12; 
            currentSpeed *= 0.95; 
            if(py <= 10) {
                py = 0; 
                clearInterval(loop); 
                currentSpeed = 0;
                let ex = document.getElementById('explosion');
                ex.style.left=px+"px"; 
                ex.style.display="block";
                document.getElementById('plane-container').style.display="none"; 
                log.innerText=reason;
            }
        }
        // Turbulence and visual storm effects (milder)
        const planeEl = document.getElementById('plane-container');
        const worldEl = document.getElementById('world');
        // fullscreen scale factor (1 = normal, >1 = fullscreen taller world)
        const fullscreen = document.body.classList.contains('fullscreen-mode');
        const worldH = worldEl ? worldEl.clientHeight : 500;
        const fsScale = fullscreen ? (worldH / 500) : 1;
        let tiltLocal = Math.min(12 * fsScale, currentSpeed * 0.4 * fsScale);
        if (weather === "boure") {
            const turbStrength = severeStorm ? 4 : (stormActive ? 2 : 1);
            const jitterX = (Math.random() - 0.5) * turbStrength;
            const jitterY = (Math.random() - 0.5) * turbStrength;
            px += jitterX;
            py += jitterY;
            const stormTilt = (Math.random() - 0.5) * turbStrength * 0.8;
            tiltLocal += stormTilt;
            // subtle world shake
            if (worldEl) worldEl.style.transform = `translate(${(Math.random()-0.5)*turbStrength/2}px, ${(Math.random()-0.5)*turbStrength/2}px)`;
            // clouds: faster movement and gentle vertical bobbing, scale positions/sizes in fullscreen
            clouds.forEach(c => {
                c.x -= (0.6 + turbStrength*0.12 + Math.random()*0.6) * fsScale;
                const brightness = Math.max(0.35, 0.9 - turbStrength*0.08);
                c.el.style.filter = `brightness(${brightness})`;
                // scale baseTop and bob amplitude
                const base = (c.baseTop || 100) * fsScale;
                const bob = Math.sin((time*0.06 + c.x)*0.02) * (2 + turbStrength) * fsScale;
                const newTop = base + bob;
                c.el.style.top = newTop + 'px';
                c.el.style.width = (120 * fsScale) + 'px';
                if (c.x < -300 * fsScale) c.x = 900 + Math.random()*300 * fsScale;
                c.el.style.left = c.x + 'px';
            });

            // severeStorm duration handling
            if (severeStorm) {
                severeStormTicks--;
                if (severeStormTicks <= 0) {
                    // end of severe phase
                    severeStorm = false;
                    stormActive = false;
                }
            }

            // Pokud je nastaven krátký odpočet do pádu kvůli slabé OD, snižuj ho a spust pád pokud dojde na nulu
            if (typeof stormCrashCountdown === 'number' && stormCrashCountdown !== null) {
                stormCrashCountdown--;
                // Počkej minimálně 10 sekund (≈333 ticků) od vzletu než umožníme pád
                const minTicksAfterTakeoff = Math.round(10 / dt);
                const canCrash = takeoffTick ? (time > takeoffTick + minTicksAfterTakeoff) : (time > 200 + minTicksAfterTakeoff);
                if (stormCrashCountdown <= 0 && canCrash) {
                    stormCrashCountdown = null;
                    falling = true; reason = "BOUŘE - SELHÁNÍ ODOLNOSTI";
                    // při bouřkovém selhání otočit letadlo na druhou stranu (horizontální zrcadlení)
                    flipToOtherSide = true;
                }
            }
        } else {
            if (worldEl) worldEl.style.transform = '';
            // ensure clouds scale back when not fullscreen
            if (!fullscreen) clouds.forEach(c => c.el.style.width = '120px');
        }
        // Update fallRotation target when falling begins
        if (falling && fallRotationTarget === 0) {
            fallRotationTarget = 120 * fsScale; // degrees of nose-down tilt to reach, larger in fullscreen
        }
        // animate fallRotation towards target
        if (fallRotation < fallRotationTarget) fallRotation = Math.min(fallRotationTarget, fallRotation + 6);
        if (!falling && fallRotation > 0) fallRotation = Math.max(0, fallRotation - 6);

        if (planeEl) {
            planeEl.style.left = px + "px";
            // adjust bottom target according to fullscreen scale
            planeEl.style.bottom = py + "px";
            const extra = falling ? fallRotation : 0;
            const scaleXValue = flipToOtherSide ? 1 : -1;
            planeEl.style.transform = `scaleX(${scaleXValue}) rotate(${ -335 + tiltLocal + extra }deg)`;
            // scale plane size dynamically if not handled by CSS
            if (fullscreen) planeEl.style.width = (220) + 'px';
            else planeEl.style.width = '';
        }
    }, 30);
}

// FULLSCREEN: toggle and handlers
function toggleFullscreen() {
    // request fullscreen for the whole document so side-panel stays part of layout
    const el = document.documentElement;
    if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
    }
}

function applyFullscreenScale(){
    const worldEl = document.getElementById('world');
    const sideEl = document.getElementById('side-menu');
    if(!worldEl) return;
    const sideW = sideEl ? sideEl.clientWidth : 0;
    const availW = window.innerWidth - sideW;
    const availH = window.innerHeight;
    // base design size used in layout
    const baseW = 850, baseH = 500;
    const scale = Math.min(Math.max(1, availW / baseW), Math.max(1, availH / baseH));
    // position and scale world so it appears as a zoomed window to the right of the side-panel
    worldEl.style.position = 'absolute';
    worldEl.style.transformOrigin = 'left top';
    worldEl.style.transform = `scale(${scale})`;
    // place it to the right of the side panel and center vertically
    const left = sideW + Math.max(0, (availW - baseW * scale) / 2);
    const top = Math.max(0, (availH - baseH * scale) / 2);
    worldEl.style.left = left + 'px';
    worldEl.style.top = top + 'px';
    worldEl.style.width = baseW + 'px';
    worldEl.style.height = baseH + 'px';
}

document.addEventListener('fullscreenchange', () => {
    if (document.fullscreenElement) {
        document.body.classList.add('fullscreen-mode');
        applyFullscreenScale();
        window.addEventListener('resize', applyFullscreenScale);
    } else {
        document.body.classList.remove('fullscreen-mode');
        const worldEl = document.getElementById('world');
        if(worldEl) {
            worldEl.style.transform = '';
            worldEl.style.position = '';
            worldEl.style.left = '';
            worldEl.style.top = '';
            worldEl.style.width = '';
            worldEl.style.height = '';
        }
        window.removeEventListener('resize', applyFullscreenScale);
    }
});

// attach button after DOM is ready
document.addEventListener('DOMContentLoaded', () => {
    const b = document.getElementById('btn-full');
    if (b) b.addEventListener('click', toggleFullscreen);
});

initClouds();
initWorldState();
</script>

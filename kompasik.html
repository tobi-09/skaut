<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magická Královská Stezka</title>
    <style>
        /* Globální reset a nastavení box-sizingu pro mobilní layout */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #0b132b, #1c2541);
            color: #f4ebd0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* Ochrana před výřezy a lištami moderních iPhonů */
            padding: calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
        }

        .karta {
            background: rgba(28, 37, 65, 0.9); /* Mírně zvýšená opacita pro lepší čitelnost na slunci */
            padding: 25px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 2px solid #d4af37; /* Královská zlatá */
            max-width: 450px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px); /* Podpora pro Safari na iOS */
        }

        h1 {
            color: #d4af37;
            font-size: 1.8rem; /* Mírně zmenšeno pro užší displeje */
            margin-top: 0;
            margin-bottom: 15px;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
        }

        p {
            font-size: 1rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .vstup-sekce {
            margin-bottom: 20px;
        }

        input {
            padding: 12px;
            font-size: 16px; /* iOS nezpůsobí auto-zoom při clicku */
            border: 2px solid #d4af37;
            border-radius: 8px;
            background-color: #0b132b;
            color: #f4ebd0;
            width: 80%; /* Širší pole pro pohodlnější zadávání prstem */
            text-align: center;
            outline: none;
            -webkit-appearance: none; /* Odstranění nativního stínu v iOS Safari */
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #d4af37;
            color: #0b132b;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            margin-top: 15px;
            width: 80%; /* Stejná šířka jako input pro lepší mobilní UI */
            -webkit-tap-highlight-color: transparent; /* Odstranění šedého záblesku při kliku na iOS */
        }

        /* Efekt při podržení/stisknutí prstu na iPhonu */
        button:active {
            background-color: #f4ebd0;
            transform: scale(0.98);
        }

        .zprava-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(11, 19, 43, 0.8);
            border-left: 4px solid #d4af37;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="karta">
    <h1>Královská Stezka</h1>
    <p>Zadej kód stanoviště pro odhalení dalších instrukcí:</p>
    
    <div class="vstup-sekce">
        <input type="text" id="kodStanoviste" inputmode="numeric" pattern="[0-9]*" placeholder="Zadej číslo kódu...">
        <br>
        <button onclick="odhalZpravu()">Odhalit tajemství</button>
    </div>

    <div class="zprava-box" id="vystupZpravy">
        Zde se objeví tvůj magický úkol...
    </div>
</div>

<script>
    // Texty jednotlivých stanovišť uložené podle kódů
    const stanoviste = {
        "1": "<strong>Stanoviště 1: Průchod</strong><br><br>Právě jsi prošel průchodem. Vydej se doprava až ke schodům, kde na tebe čeká další stanoviště.",
        "2": "<strong>Stanoviště 2: Schody a garáž</strong><br><br>Dorazil jsi ke schodům. Sejdi po nich dolů. Cestou tě bude někdo sledovat - neboj se, je to přítel. Sejdi ještě níž po následujících schodech až do garáže, kde tě tvůj pozorovatel navede dál.",
        "3": "<strong>Stanoviště 3: Bazén</strong><br><br>Už jsi skoro u bazénu. Celý ho obejdi dokola a pak se vydej směrem k pavučině.",
        "4": "<strong>Stanoviště 4: Pavučina</strong><br><br>Jakmile dorazíš k pavučině, prolez otvorem uprostřed a vydej se na zpáteční cestu na start."
    };

    function odhalZpravu() {
        const inputEl = document.getElementById("kodStanoviste");
        const kod = inputEl.value.trim();
        const vystup = document.getElementById("vystupZpravy");

        if (stanoviste[kod]) {
            vystup.innerHTML = stanoviste[kod];
            vystup.style.borderColor = "#d4af37"; 
        } else {
            vystup.innerHTML = "<em>Tento kód neotvírá žádnou komnatu. Zkus to znovu!</em>";
            vystup.style.borderColor = "#cc0000"; 
        }

        // Schová klávesnici na iPhonu po kliknutí na tlačítko, aby uživatel viděl výsledek
        inputEl.blur();
    }

    document.getElementById("kodStanoviste").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            odhalZpravu();
        }
    });
</script>

</body>
</html>

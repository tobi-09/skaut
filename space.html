<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SPACE SHIPE — Tobiáš Pejsar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #000; --accent: #fff; --muted: #888; --border: rgba(255,255,255,.15); --font-main: 'Inter', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--accent); font-family: var(--font-main); line-height: 1.4; -webkit-font-smoothing: antialiased; }
    .nav-top { position: fixed; top: 30px; left: 50px; right: 50px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; mix-blend-mode: difference; }
    .works-link { color: #fff; text-decoration: none; font-size: 11px; text-transform: uppercase; letter-spacing: .3em; opacity: .6; transition: .3s; }
    .works-link:hover { opacity: 1; }
    .lang-switcher { display: flex; gap: 15px; }
    .lang-link { background: transparent; border: 0; color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; opacity: .4; }
    .lang-link:hover { opacity: 1; }
    #lang-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: .8s; }
    .lang-btn { background: transparent; border: 1px solid var(--border); color: #fff; padding: 15px 40px; cursor: pointer; text-transform: uppercase; margin: 10px; font-size: 13px; letter-spacing: .2em; }
    .lang-btn:hover { background: #fff; color: #000; }
    .hero { position: relative; width: 100%; height: 100vh; margin-bottom: 120px; }
    .hero-media, .hero-media img { width: 100%; height: 100%; }
    .hero-media img { object-fit: cover; filter: brightness(.6); }
    .hero-info { position: absolute; bottom: 80px; left: 50px; }
    .hero-info h1 { font-size: clamp(60px, 15vw, 180px); text-transform: uppercase; letter-spacing: -.05em; line-height: .8; font-weight: 500; }
    .wrap { max-width: 1500px; margin: 0 auto; padding: 0 50px; }
    .desc { font-size: clamp(22px, 2.5vw, 34px); line-height: 1.5; white-space: pre-line; margin-bottom: 150px; font-weight: 300; max-width: 1100px; }
    .video-section { margin-bottom: 150px; background: #000; }
    .video-container { border: 1px solid var(--border); overflow: hidden; }
    video { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; }
    .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); margin-bottom: 120px; }
    .meta .card { border-top: 1px solid var(--border); padding: 50px 0; }
    .meta pre { white-space: pre-wrap; font-family: var(--font-main); color: var(--muted); font-size: 14px; line-height: 1.8; }
    .chapter { border-top: 1px solid var(--border); padding-top: 100px; margin-bottom: 150px; }
    .chapter .title { font-size: 12px; text-transform: uppercase; letter-spacing: .5em; margin-bottom: 40px; color: var(--muted); }
    .slider { position: relative; overflow: hidden; }
    .track { display: flex; transition: transform 1.2s cubic-bezier(.16,1,.3,1); }
    .slide { min-width: 100%; height: 85vh; background: #000; }
    .slide img { width: 100%; height: 100%; object-fit: contain; }
    .nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 30px; }
    .btn { pointer-events: auto; background: rgba(0,0,0,.4); border: 0; color: #fff; width: 60px; height: 100px; cursor: pointer; font-size: 30px; backdrop-filter: blur(10px); }
    .btn:hover { background: #fff; color: #000; }
    .dots { position: absolute; bottom: 40px; left: 50px; display: flex; gap: 15px; }
    .dot { width: 40px; height: 2px; background: rgba(255,255,255,.2); border: 0; cursor: pointer; }
    .dot.active { background: #fff; width: 80px; transition: .4s; }
    @media (max-width: 768px) { .wrap { padding: 0 25px; } .hero-info { left: 25px; } .slide { height: 60vh; } .nav-top { left: 25px; right: 25px; } }
  </style>
</head>
<body>
  <nav class="nav-top">
    <a href="https://tobi-09.github.io/skaut/rozhan%C3%AD%20videomaping.html" class="works-link">← Portfolio</a>
    <div class="lang-switcher"><button class="lang-link" onclick="setLanguage('cs')">CS</button><button class="lang-link" onclick="setLanguage('en')">EN</button></div>
  </nav>
  <div id="lang-overlay">
    <h1 style="letter-spacing:.8em;text-transform:uppercase;font-weight:300;font-size:14px;margin-bottom:40px;">SPACE SHIPE</h1>
    <button class="lang-btn" onclick="setLanguage('cs')">česky</button>
    <button class="lang-btn" onclick="setLanguage('en')">english</button>
  </div>
  <header class="hero">
    <div class="hero-media"><img src="https://tobi-09.github.io/skaut/spaceship%201%20-%2001.png" alt="Space Shipe"></div>
    <div class="hero-info"><div style="font-size:11px;letter-spacing:.8em;opacity:.4;margin-bottom:20px;font-weight:700;">OUTDOOR FACADE PROJECTION</div><h1 id="h-title">SPACE SHIPE</h1></div>
  </header>
  <div class="wrap">
    <p class="desc" id="h-desc"></p>
    <section class="video-section"><div class="video-container"><video controls playsinline><source src="https://tobi-09.github.io/skaut/img/spaceshipe.mp4" type="video/mp4"></video></div></section>
    <section class="meta"><div class="card"><div style="font-size:11px;opacity:.4;margin-bottom:25px;text-transform:uppercase;letter-spacing:.3em;">Info</div><pre id="m-info"></pre></div><div class="card"><div style="font-size:11px;opacity:.4;margin-bottom:25px;text-transform:uppercase;letter-spacing:.3em;">Credits</div><pre id="m-credits"></pre></div></section>
    <section class="chapter"><div class="title" id="h-gallery-title"></div><div class="slider" id="main-slider"><div class="track" id="gallery-track"></div><div class="nav"><button class="btn prev" aria-label="Předchozí obrázek">‹</button><button class="btn next" aria-label="Další obrázek">›</button></div><div class="dots" id="gallery-dots"></div></div></section>
  </div>
  <script>
const data = {
      cs: {
        title: 'SPACE SHIP',
        desc: `Představte si budovu, která přestává být statickým objektem a mění se v živé ovládací rozhraní vesmírného plavidla.\n\nVideomapping "SPACE SHIP" pracující přímo s architekturou fasády provádí diváka fázemi systémové diagnostiky a startu. Vstupní sekvence odhaluje vnitřní kódy, datové matice a terminálové příkazy, které postupně přecházejí v neonové kontury oken, organické pulzující textury a prostorový efekt hvězdné oblohy.\n\nProjekt konceptuálně navazuje na předchozí projekci Bílá Díra.`,
        info: `ROLE: Direction & Design & Concept\nTYPE: Outdoor Facade Projection\nDATE: 2026\nDURATION: 02' 00" (Short Cut 00' 30")`,
        credits: `DIRECTION, DESIGN & CONCEPT: Tobiáš Pejsar\nVISUAL ARTIST: Tobiáš Pejsar\nTECHNICAL DIRECTION: Tobiáš Pejsar\nPHOTOGRAPHER: Tobiáš Pejsar`,
        gallery: 'Vizuální archiv'
      },
      en: {
        title: 'SPACE SHIP',
        desc: `Imagine a building that ceases to be a static object and transforms into the active control interface of a spacecraft.\n\nThe "SPACE SHIP" videomapping works directly with the architecture of the facade to guide the viewer through phases of system diagnostics and launch. The opening sequence reveals inner code, data matrices, and terminal commands, gradually shifting into neon window contours, organic pulsating textures, and a spatial star field effect.\n\nThe project conceptually follows up on the previous projection White Hole.`,
        info: `ROLE: Direction & Design & Concept\nTYPE: Outdoor Facade Projection\nDATE: 2026\nDURATION: 02' 00" (Short Cut 00' 30")`,
        credits: `DIRECTION, DESIGN & CONCEPT: Tobiáš Pejsar\nVISUAL ARTIST: Tobiáš Pejsar\nTECHNICAL DIRECTION: Tobiáš Pejsar\nPHOTOGRAPHER: Tobiáš Pejsar`,
        gallery: 'Visual archive'
      }
    };
    const photos = [
      'https://tobi-09.github.io/skaut/spaceship%201%20-%2001.png',
      'https://tobi-09.github.io/skaut/spaceship%201%20-%2002.png',
      'https://tobi-09.github.io/skaut/img/spaceship%201%20-%2004.png',
      'https://tobi-09.github.io/skaut/img/spaceship%201%20-%2005.png',
      'https://tobi-09.github.io/skaut/img/spaceship%201%20-%2003.png'
    ];
    let currentIdx = 0;
    let timer;
    function setLanguage(language) { localStorage.setItem('lang', language); document.getElementById('lang-overlay').classList.add('hidden'); document.body.style.overflow = 'auto'; render(language); }
    function render(language) {
      const project = data[language];
      document.getElementById('h-title').textContent = project.title;
      document.getElementById('h-desc').textContent = project.desc;
      document.getElementById('m-info').textContent = project.info;
      document.getElementById('m-credits').textContent = project.credits;
      document.getElementById('h-gallery-title').textContent = project.gallery;
      const track = document.getElementById('gallery-track');
      const dots = document.getElementById('gallery-dots');
      track.innerHTML = photos.map(photo => `<div class="slide"><img src="${photo}" alt="Space Shipe"></div>`).join('');
      dots.innerHTML = photos.map((_, index) => `<button class="dot ${index === 0 ? 'active' : ''}" aria-label="Obrázek ${index + 1}" onclick="jumpTo(${index})"></button>`).join('');
      initSlider();
    }
    function initSlider() {
      const track = document.getElementById('gallery-track');
      const dotElements = document.querySelectorAll('#gallery-dots .dot');
      const total = photos.length;
      if (timer) clearInterval(timer);
      const update = () => { track.style.transform = `translateX(-${currentIdx * 100}%)`; dotElements.forEach((dot, index) => dot.classList.toggle('active', index === currentIdx)); };
      window.jumpTo = index => { currentIdx = index; update(); };
      document.querySelector('.next').onclick = () => { currentIdx = (currentIdx + 1) % total; update(); };
      document.querySelector('.prev').onclick = () => { currentIdx = (currentIdx - 1 + total) % total; update(); };
      const slider = document.getElementById('main-slider');
      const start = () => { if (!timer) timer = setInterval(() => { currentIdx = (currentIdx + 1) % total; update(); }, 5000); };
      const stop = () => { clearInterval(timer); timer = null; };
      slider.onmouseenter = stop;
      slider.onmouseleave = start;
      start();
    }
    window.onload = () => { const saved = localStorage.getItem('lang'); if (saved) setLanguage(saved); else document.body.style.overflow = 'hidden'; };
  </script>
</body>
</html>

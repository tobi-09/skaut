<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mars Operational Terminal v3.4</title>
    <style>
        :root { --green: #00ff41; --bg: #050505; --red: #ff3131; --panel: #111; --blue: #008cff; }
        
        body { 
            font-family: 'Consolas', monospace; background: var(--bg); color: #ccc; 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            height: 100vh; margin: 0; touch-action: manipulation; overflow: hidden;
        }

        #stats-bar {
            width: 100%; max-width: 500px; display: flex; justify-content: space-between;
            padding: 8px 15px; background: #000; border-bottom: 1px solid #333;
            box-sizing: border-box; font-size: 0.75rem; z-index: 100;
        }

        #quiz-container { 
            width: 100%; max-width: 500px; flex-grow: 1; display: flex; flex-direction: column;
            background: var(--panel); position: relative; overflow-y: auto; padding: 10px; box-sizing: border-box;
        }

        .viewscreen { 
            width: 100%; min-height: 150px; max-height: 220px; background: #000; border: 1px solid #333; 
            display: flex; justify-content: center; align-items: center; margin-bottom: 10px; flex-shrink: 1;
        }
        .viewscreen img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .status-box { background: #000; padding: 10px; border-left: 4px solid var(--red); margin-bottom: 10px; flex-shrink: 0; }
        .error-msg { color: var(--red); font-weight: bold; font-size: 0.95rem; text-transform: uppercase; }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; flex-shrink: 0; }
        .option-btn { 
            background: #0a0a0a; border: 1px solid #444; color: #aaa; padding: 12px; 
            text-align: left; cursor: pointer; font-family: inherit; font-size: 0.8rem; border-radius: 4px;
        }
        .option-btn.correct { border-color: var(--green); color: var(--green); background: rgba(0, 255, 65, 0.05); }
        .option-btn.wrong { border-color: var(--red); color: var(--red); opacity: 0.3; }

        .next-btn { 
            width: 100%; margin-top: 15px; background: var(--green); color: #000; 
            border: none; padding: 16px; font-weight: bold; cursor: pointer; display: none; 
            border-radius: 4px; font-size: 1rem; box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }

        #feedback { text-align: center; margin-top: 10px; font-weight: bold; min-height: 1.2rem; font-size: 0.75rem; }
        #flash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

        .loading-dots:after { content: ' .'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); }
          40% { color: var(--green); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); }
          60% { text-shadow: .5em 0 0 var(--green), 1em 0 0 rgba(0,0,0,0); }
          80%, 100% { text-shadow: .5em 0 0 var(--green), 1em 0 0 var(--green); } }
    </style>
</head>
<body>

<div id="flash-overlay"></div>

<div id="stats-bar">
    <div class="stat-item">OK: <span id="count-correct" style="color:var(--green)">0</span></div>
    <div class="stat-item">ERR: <span id="count-wrong" style="color:var(--red)">0</span></div>
    <div class="stat-item">SUM: <span id="count-total" style="color:var(--blue)">0</span></div>
</div>

<div id="quiz-container">
    <div class="viewscreen">
        <img id="asset-img" src="" alt="SYNC...">
    </div>
    <div class="status-box">
        <span class="error-msg" id="display-err-text">ANALÝZA...</span>
    </div>
    <div id="options" class="options-grid"></div>
    <div id="feedback"></div>
    <button id="next-btn" class="next-btn">POKRAČOVAT</button>
</div>

<script>
    const baseUrl = "https://tobi-09.github.io/skaut/img/mars/";
    const variants = ["0", "A", "B", "C", "D"];
    const assets = [
        { id: "1", cat: "Vehicle" }, { id: "2", cat: "Aerial" }, { id: "3", cat: "Vehicle" },
        { id: "4", cat: "Bot" },     { id: "5", cat: "Energy" },  { id: "6", cat: "Energy" },
        { id: "7", cat: "Energy" },  { id: "8", cat: "Hab" },     { id: "9", cat: "Hab" },
        { id: "10", cat: "Hab" },    { id: "11", cat: "Energy" }, { id: "12", cat: "Energy" }, 
        { id: "13", cat: "Vehicle" }, { id: "14", cat: "Vehicle" }, { id: "15", cat: "Bio" },
        { id: "16", cat: "Bot" },    { id: "17", cat: "Bio" },    { id: "18", cat: "Vehicle" },
        { id: "19", cat: "Energy" }, { id: "20", cat: "Vehicle" }, { id: "21", cat: "Energy" },
        { id: "23", cat: "Bio" }
    ];

    const errorParts = {
        Vehicle: ["motoru", "podvozku", "kol", "antény", "ramene", "převodovky", "brzd", "Lidaru", "navigace", "baterie"],
        Bot: ["kloubu", "procesoru", "mikrofonu", "optiky", "rovnováhy", "paměti", "gyroskopu", "stisku", "chlazení", "řeči"],
        Energy: ["článku", "měniče", "kabeláže", "jádra", "transformátoru", "izolace", "svorky", "monitoru", "chladiva", "relé"],
        Hab: ["přechodové komory", "ventilace", "těsnění", "osvětlení", "topení", "filtru", "senzoru tlaku", "zámku", "pláště", "UI terminálu"],
        Bio: ["hydroponie", "závlahy", "LED spektra", "pH metru", "hnojení", "ventilátoru", "čerpadla", "vlhkosti", "skla", "dveří"],
        Aerial: ["rotoru", "vztlaku", "výškoměru", "stabilizace", "vysílače", "lopatek", "kompasu", "telemetrie", "kamery", "podvozku"]
    };

    const actions = ["Restartovat", "Rekalibrovat", "Zvýšit napětí v", "Vyčistit impulsy", "Přepsat registry", "Aktivovat záložní", "Spustit diagnostiku", "Upravit parametry", "Vzdáleně propláchnout", "Nulovat hodnoty"];

    let correctCount = 0, wrongCount = 0, totalCount = 0, audioCtx = null;

    function updateStats() {
        document.getElementById('count-correct').innerText = correctCount;
        document.getElementById('count-wrong').innerText = wrongCount;
        document.getElementById('count-total').innerText = totalCount;
    }

    function triggerFinalEffects() {
        if (navigator.vibrate) navigator.vibrate([150, 50, 150]);
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);

        const overlay = document.getElementById('flash-overlay');
        let count = 0;
        const interval = setInterval(() => {
            overlay.style.backgroundColor = (count % 2 === 0) ? "rgba(255, 0, 0, 0.4)" : "rgba(255, 255, 255, 0.4)";
            count++;
            if (count > 8) { clearInterval(interval); overlay.style.backgroundColor = "transparent"; }
        }, 70);
    }

    function loadQuestion() {
        const asset = assets[Math.floor(Math.random() * assets.length)];
        const v = variants[Math.floor(Math.random() * variants.length)];
        const errorIndex = Math.floor(Math.random() * 10);
        const parts = errorParts[asset.cat];
        const targetPart = parts[errorIndex % parts.length];
        const correctAction = actions[(errorIndex + v.charCodeAt(0)) % actions.length];
        const solution = `${correctAction} ${targetPart}`;
        
        document.getElementById('asset-img').src = `${baseUrl}${asset.id}_${v}.jpg`;
        document.getElementById('display-err-text').innerText = `PORUCHA ${targetPart}`;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";

        let choices = [solution];
        let usedActions = [correctAction];
        while(choices.length < 4) {
            let randAction = actions[Math.floor(Math.random() * actions.length)];
            if(!usedActions.includes(randAction)) {
                choices.push(`${randAction} ${targetPart}`);
                usedActions.push(randAction);
            }
        }
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = `CMD: ${choice}`;
            btn.onclick = () => {
                if(choice === solution) {
                    correctCount++; totalCount++; updateStats();
                    document.querySelectorAll('.option-btn').forEach(b => {
                        b.disabled = true;
                        if(b.innerText.includes(choice)) b.classList.add('correct');
                    });
                    const fb = document.getElementById('feedback');
                    fb.style.color = "var(--green)";
                    fb.innerHTML = "<span class='loading-dots'>VYSÍLÁM PAKET</span>";
                    setTimeout(() => {
                        fb.innerText = "POTVRZENO";
                        triggerFinalEffects();
                        document.getElementById('next-btn').style.display = "block";
                        // Scroll k tlačítku
                        document.getElementById('quiz-container').scrollTo({top: 1000, behavior: 'smooth'});
                    }, Math.floor(Math.random() * 25000) + 5000);
                } else {
                    wrongCount++; totalCount++; updateStats();
                    btn.classList.add('wrong'); btn.disabled = true;
                    document.getElementById('feedback').innerText = "CHYBA - ODMÍTNUTO";
                    document.getElementById('feedback').style.color = "var(--red)";
                }
            };
            optionsDiv.appendChild(btn);
        });
    }

    document.getElementById('next-btn').onclick = loadQuestion;
    window.onload = loadQuestion;
</script>
</body>
</html>

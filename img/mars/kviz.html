<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mars Asset Repair Database - Mobile Ready</title>
    <style>
        :root { 
            --green: #00ff41; 
            --bg: #050505; 
            --panel: #111; 
            --red: #ff3131;
        }
        
        body { 
            font-family: 'Courier New', monospace; 
            background: var(--bg); 
            color: #ccc; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            min-height: 100vh;
            margin: 0; 
            overflow-x: hidden;
        }

        /* Speciální vrstva pro blikání na mobilu */
        #flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            background-color: transparent;
        }

        #quiz-container { 
            width: 90%; 
            max-width: 500px; 
            background: var(--panel); 
            border: 2px solid #222; 
            padding: 20px; 
            border-radius: 5px; 
            position: relative;
            z-index: 10;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.75rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .viewscreen { 
            width: 100%; 
            height: 250px; 
            background: #000; 
            border: 1px solid #333; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-bottom: 15px; 
        }

        .viewscreen img { max-width: 100%; max-height: 100%; }

        .status-box { 
            background: #000; 
            padding: 12px; 
            border-left: 4px solid var(--red); 
            margin-bottom: 15px; 
        }

        .error-msg { color: var(--red); font-weight: bold; font-size: 0.9rem; }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }

        .option-btn { 
            background: #0a0a0a; border: 1px solid #444; color: #aaa; padding: 12px; 
            text-align: left; cursor: pointer; font-family: inherit; font-size: 0.85rem;
            -webkit-tap-highlight-color: transparent; /* Odstraní modrý stín na mobilu */
        }

        .option-btn.correct-locked { border-color: var(--green) !important; color: var(--green); }
        .option-btn.wrong-locked { border-color: var(--red) !important; color: var(--red); opacity: 0.5; }

        #feedback { margin-top: 10px; font-size: 0.8rem; text-align: center; min-height: 20px; }

        .next-btn { 
            width: 100%; margin-top: 15px; background: var(--green); color: #000; 
            border: none; padding: 15px; font-weight: bold; cursor: pointer; display: none; 
        }
    </style>
</head>
<body>

<div id="flash-overlay"></div>

<div id="quiz-container">
    <div class="scoreboard">
        <span>ÚSPĚCH: <b id="stat-correct" style="color:var(--green)">0</b></span>
        <span>CHYBY: <b id="stat-wrong" style="color:var(--red)">0</b></span>
        <span>KOLO: <b id="stat-total" style="color:#fff">1</b></span>
    </div>

    <div class="viewscreen">
        <img id="asset-img" src="" alt="LOADING...">
    </div>

    <div class="status-box">
        <span class="error-msg" id="error-desc">DEŠIFRUJI...</span>
    </div>

    <div id="options" class="options-grid"></div>
    <div id="feedback"></div>
    <button id="next-btn" class="next-btn">NAČÍST DALŠÍ DATA</button>
</div>

<script>
    const baseUrl = "https://tobi-09.github.io/skaut/img/mars/";
    let scoreCorrect = 0;
    let scoreWrong = 0;
    let currentRound = 1;
    let audioCtx = null; // Inicializace až po interakci

    const banks = {
        motor: ["Vzdáleně propláchnout motoru", "Aktivovat záložní motoru", "Spustit diagnostiku motoru", "Upravit parametry motoru"],
        podvozek: ["Nulovat hodnoty podvozku", "Spustit diagnostiku podvozku", "Upravit parametry podvozku", "Vzdáleně propláchnout podvozku"],
        antena: ["Rekalibrovat antény", "Vzdáleně propláchnout antény", "Nulovat hodnoty antény", "Restartovat antény"],
        ventilace: ["Nulovat hodnoty ventilace", "Spustit diagnostiku ventilace", "Upravit parametry ventilace", "Vzdáleně propláchnout ventilace"],
        tesneni: ["Restartovat těsnění", "Upravit parametry těsnění", "Vzdáleně propláchnout těsnění", "Nulovat hodnoty těsnění"],
        optika: ["Rekalibrovat optiky", "Vzdáleně propláchnout optiky", "Nulovat hodnoty optiky", "Restartovat optiky"]
    };

    const quizData = [
        { id: "3", v: "0", err: "Porucha motoru", cmd: "Vzdáleně propláchnout motoru", type: "motor" },
        { id: "3", v: "A", err: "Porucha podvozku", cmd: "Spustit diagnostiku podvozku", type: "podvozek" },
        { id: "18", v: "C", err: "Porucha antény", cmd: "Restartovat antény", type: "antena" },
        { id: "8", v: "A", err: "Porucha ventilace", cmd: "Spustit diagnostiku ventilace", type: "ventilace" },
        { id: "9", v: "B", err: "Porucha těsnění", cmd: "Vzdáleně propláchnout těsnění", type: "tesneni" }
    ];

    function playSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    }

    function triggerFlash() {
        const overlay = document.getElementById('flash-overlay');
        let flashes = 0;
        const interval = setInterval(() => {
            overlay.style.backgroundColor = (flashes % 2 === 0) ? "rgba(255,0,0,0.8)" : "rgba(255,255,255,0.8)";
            flashes++;
            if (flashes > 10) {
                clearInterval(interval);
                overlay.style.backgroundColor = "transparent";
            }
        }, 70);
    }

    function loadQuestion() {
        const data = quizData[Math.floor(Math.random() * quizData.length)];
        document.getElementById('asset-img').src = `${baseUrl}${data.id}_${data.v}.jpg`;
        document.getElementById('error-desc').innerText = `CHYBA: ${data.err.toUpperCase()}`;
        document.getElementById('stat-total').innerText = currentRound;
        
        const optionsDiv = document.getElementById('options');
        optionsDiv.innerHTML = "";
        document.getElementById('feedback').innerText = "";
        document.getElementById('next-btn').style.display = "none";

        let choices = [...banks[data.type]];
        choices.sort(() => Math.random() - 0.5);

        choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = "CMD:> " + choice;
            btn.onclick = () => {
                // Aktivace audia na mobilu při prvním kliku
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                if(choice === data.cmd) {
                    btn.classList.add('correct-locked');
                    scoreCorrect++;
                    document.getElementById('stat-correct').innerText = scoreCorrect;
                    handleSuccess();
                } else {
                    btn.classList.add('wrong-locked');
                    btn.disabled = true;
                    scoreWrong++;
                    document.getElementById('stat-wrong').innerText = scoreWrong;
                }
            };
            optionsDiv.appendChild(btn);
        });
    }

    function handleSuccess() {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        const fb = document.getElementById('feedback');
        fb.innerText = "NAVAZUJI SPOJENÍ S MARSEM...";
        fb.style.color = "var(--green)";

        const wait = Math.floor(Math.random() * 5000) + 1000; // Na mobilu raději kratší (1-6s)
        
        setTimeout(() => {
            playSound();
            triggerFlash();
            fb.innerText = "SPOJENÍ POTVRZENO.";
            document.getElementById('next-btn').style.display = "block";
            currentRound++;
        }, wait);
    }

    document.getElementById('next-btn').onclick = loadQuestion;
    window.onload = loadQuestion;
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Video Mapping — oprava čar + 20+ efektů</title>
<style>
  :root{--ui-bg:rgba(0,0,0,0.55);--ui-color:#fff}
  html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,Arial}
  #video-container{position:absolute;inset:0;overflow:hidden;background:#000}
  #video-container video, #video-container img, #video-container .media {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  #canvas-overlay{position:absolute;inset:0;cursor:crosshair;z-index:5}
  .controls{position:fixed;left:12px;top:12px;background:var(--ui-bg);color:var(--ui-color);padding:10px;border-radius:8px;z-index:120;min-width:300px;max-width:520px}
  .controls input[type=color]{width:100%}
  .controls button, .controls input[type=file]{width:100%;margin-top:6px;padding:6px;border-radius:6px;border:0;background:#222;color:#fff}
  #polygonAnimControls{max-height:66vh;overflow:auto;margin-top:8px}
  .polygon-controls{margin-top:8px;padding:8px;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
  .polygon-controls h4{margin:0 0 6px 0;font-size:13px}
  .effect-grid{display:flex;flex-wrap:wrap;gap:6px}
  .effect-grid button{flex:1 1 48%;font-size:12px;padding:6px}
  .hint{font-size:12px;opacity:0.9;margin-top:6px}
  label.small{font-size:12px;display:block;margin-top:6px}
  input[type=range]{width:100%}
  .hidden-ui{display:none !important; opacity:0 !important; pointer-events:none !important;}
</style>
</head>
<body>

<div id="video-container">
  <video id="video" src="" autoplay loop muted playsinline></video>
  <canvas id="canvas-overlay"></canvas>
</div>

<div class="controls" id="ui">
  <label>Barva polygonu</label>
  <input id="colorPicker" type="color" value="#ff0044"/>
  <button id="finishPolygon">Dokončit polygon (nebo dvojklik)</button>
  <button id="clearPolygons">Vymazat vše</button>
  <button id="resetBtn" title="Vyčistit a restartovat vše">RESET (restart)</button>
  <button id="presentBtn" title="Skrýt UI a vyplnit obrazovku (toggle)">PRESENT (hide UI)</button>
  <button id="exportPNG">Export PNG (včetně média)</button>
  <button id="fullscreen">Fullscreen (video+canvas)</button>
  <input id="uploadMedia" type="file" accept="image/*,video/*"/>
  <div class="hint">Klikni pro přidání bodu. Dvojklik dokončí polygon. Pro každý polygon níže jsou tlačítka efektů.</div>
  <div id="polygonAnimControls"></div>
</div>

<script>
/* ===== Hi-DPI canvas ===== */
const canvas = document.getElementById('canvas-overlay');
const ctx = canvas.getContext('2d');
let DPR = Math.max(1, window.devicePixelRatio || 1);
function resizeCanvas(){
  DPR = Math.max(1, window.devicePixelRatio || 1);
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  canvas.width = Math.round(window.innerWidth * DPR);
  canvas.height = Math.round(window.innerHeight * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

/* ===== State & UI refs ===== */
const videoContainer = document.getElementById('video-container');
const video = document.getElementById('video');
let mediaLayer = null;
let lastMediaURL = null;
let polygons = [];
let currentPolygon = null;
let rafId = null;
const ui = {
  root: document.getElementById('ui'),
  color: document.getElementById('colorPicker'),
  finishBtn: document.getElementById('finishPolygon'),
  clearBtn: document.getElementById('clearPolygons'),
  exportBtn: document.getElementById('exportPNG'),
  fullscreenBtn: document.getElementById('fullscreen'),
  upload: document.getElementById('uploadMedia'),
  resetBtn: document.getElementById('resetBtn'),
  presentBtn: document.getElementById('presentBtn'),
  controlsArea: document.getElementById('polygonAnimControls'),
};

/* ===== Helpers (kept) ===== */
function getMousePos(evt){
  const rect = canvas.getBoundingClientRect();
  return { x: (evt.clientX - rect.left), y: (evt.clientY - rect.top) };
}
function polygonCentroid(points){ let x=0,y=0; for(const p of points){ x+=p.x; y+=p.y; } return {x:x/points.length, y:y/points.length}; }
function polygonBBox(points){ let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9; for(const p of points){ if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y; } return {minX,minY,maxX,maxY,width:maxX-minX,height:maxY-minY}; }
function computeEdges(points){ const edges=[]; let total=0; for(let i=0;i<points.length;i++){ const a=points[i], b=points[(i+1)%points.length]; const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy); edges.push({a,b,len,dx,dy}); total+=len;} return {edges,total}; }
function pointAtDistance(pointsData, dist){ const {edges, total} = pointsData; if(!edges||edges.length===0) return {x:0,y:0}; if(total===0) return edges[0].a; let d=(dist%total+total)%total; for(const e of edges){ if(d<=e.len){ const t=e.len===0?0:d/e.len; return {x:e.a.x + e.dx*t, y:e.a.y + e.dy*t}; } d-=e.len;} const last=edges[edges.length-1]; return {x:last.b.x,y:last.b.y}; }

/* ===== UI wiring ===== */
ui.finishBtn.addEventListener('click', finishPolygon);
ui.clearBtn.addEventListener('click', ()=>{ polygons=[]; currentPolygon=null; ui.controlsArea.innerHTML=''; });
ui.fullscreenBtn.addEventListener('click', ()=> {
  if(!document.fullscreenElement) videoContainer.requestFullscreen().catch(e=>alert(e));
  else document.exitFullscreen();
});
ui.exportBtn.addEventListener('click', exportPNG);
ui.upload.addEventListener('change', handleUpload);
ui.resetBtn.addEventListener('click', ()=> { if(!confirm('Opravdu RESETovat?')) return; resetApp(); });
ui.presentBtn.addEventListener('click', ()=> togglePresentation());

/* ===== Mouse: add/double-click/drag ===== */
let dragPoint = null;
canvas.addEventListener('click', (e)=>{ const pos=getMousePos(e); if(dragPoint) return; if(!currentPolygon) currentPolygon = createEmptyPolygon(ui.color.value); currentPolygon.points.push(pos); });
canvas.addEventListener('dblclick', (e)=>{ e.preventDefault(); finishPolygon(); });
canvas.addEventListener('mousedown', (e)=>{ const pos=getMousePos(e); const threshold=8; for(const poly of polygons.concat(currentPolygon? [currentPolygon]:[])){ for(const pt of poly.points){ if(Math.hypot(pt.x-pos.x,pt.y-pos.y) <= threshold){ dragPoint = {poly,pt}; return; }}}});
canvas.addEventListener('mousemove', (e)=>{ const pos=getMousePos(e); if(dragPoint){ dragPoint.pt.x = pos.x; dragPoint.pt.y = pos.y; dragPoint.poly.bbox = polygonBBox(dragPoint.poly.points); }});
canvas.addEventListener('mouseup', ()=>{ dragPoint = null; });

/* ===== Create empty polygon helper ===== */
function createEmptyPolygon(color){
  return {
    points: [],
    color: color || '#ff0044',
    animOffset: 0,
    anim: {},
    particles: [], sparks: [], shockwaves: [], rings: [], flashTimer:0,
    whiteFogParticles: [], edgeRunnerLength: 30, centerRingTimer: 0,
    starField: [], sparkle: [], fireworks: [], falling: [], driftCloud: [], spiral: [],
    shadowTrail: [], glitchParts: [], zoomRingsArr: [], rotatingLinesState: {angle:0}, morphState:{phase:0}
  };
}

/* ===== Finish polygon & add UI controls (same approach) ===== */
function finishPolygon(){
  if(currentPolygon && currentPolygon.points.length > 2){
    currentPolygon.bbox = polygonBBox(currentPolygon.points);
    const keys = ['movingEdge','edgeRunner','explode','shockwave','centerRings','marquee','flash','pulse','rgbSmoke','whiteFog','neon','wave','sparks','gradient','particles','rotate','fire',
      'starField','sparkle','glowPulse','rotatingLines','diagonalSweep','waveFill','rainbowTrail','fireworks','fallingParticles','morphPolygon',
      'zoomRings','rotatingDots','lightningEdge','driftingCloud','radialPulse','gradientSweep','noiseDistort','spiralInside','glitchLines','shadowTrail','centerBurst'
    ];
    keys.forEach(k => { if(typeof currentPolygon.anim[k] === 'undefined') currentPolygon.anim[k] = false; });
    polygons.push(currentPolygon);
    addPolygonControls(currentPolygon);
    currentPolygon = null;
  } else alert('Polygon musí mít alespoň 3 body.');
}

/* ===== Per-polygon controls (kept compact) ===== */
function addPolygonControls(polygon){
  const idx = polygons.indexOf(polygon) + 1;
  const div = document.createElement('div'); div.className='polygon-controls';
  const title = document.createElement('h4'); title.innerText = `Polygon #${idx}`; div.appendChild(title);
  const colorInp = document.createElement('input'); colorInp.type='color'; colorInp.value=polygon.color; colorInp.addEventListener('input', e=> polygon.color=e.target.value); div.appendChild(colorInp);
  const fillBtn = document.createElement('button'); fillBtn.innerText = polygon.anim.fill ? 'Vyplnění: ON' : 'Vyplnění: OFF';
  fillBtn.addEventListener('click', ()=>{ polygon.anim.fill = !polygon.anim.fill; fillBtn.innerText = polygon.anim.fill ? 'Vyplnění: ON' : 'Vyplnění: OFF'; });
  div.appendChild(fillBtn);
  const fillColor = document.createElement('input'); fillColor.type='color'; fillColor.value = polygon.anim.fillColor || '#000000'; fillColor.addEventListener('input', e=> polygon.anim.fillColor = e.target.value); div.appendChild(fillColor);
  const fillOpacity = document.createElement('input'); fillOpacity.type='range'; fillOpacity.min=0; fillOpacity.max=1; fillOpacity.step=0.01; fillOpacity.value = polygon.anim.fillOpacity || 0.35; fillOpacity.addEventListener('input', e=> polygon.anim.fillOpacity = +e.target.value); div.appendChild(fillOpacity);

  const effects = ['movingEdge','edgeRunner','explode','shockwave','centerRings','marquee','flash','pulse','rgbSmoke','whiteFog','neon','wave','sparks','gradient','particles','rotate','fire',
    'starField','sparkle','glowPulse','rotatingLines','diagonalSweep','waveFill','rainbowTrail','fireworks','fallingParticles','morphPolygon','zoomRings','rotatingDots','lightningEdge','driftingCloud','radialPulse','gradientSweep','noiseDistort','spiralInside','glitchLines','shadowTrail','centerBurst'];
  const grid = document.createElement('div'); grid.className='effect-grid';
  effects.forEach(k=>{
    polygon.anim[k] = polygon.anim[k] || false;
    const btn = document.createElement('button'); btn.innerText = (k+': OFF'); btn.addEventListener('click', ()=>{
      polygon.anim[k] = !polygon.anim[k];
      btn.innerText = k + (polygon.anim[k] ? ': ON' : ': OFF');
      if(polygon.anim[k]) { polygon[k] = polygon[k] || []; polygon.bbox = polygon.bbox || polygonBBox(polygon.points); }
    }); grid.appendChild(btn);
  });
  div.appendChild(grid);

  const rem = document.createElement('button'); rem.innerText='Smazat tento polygon'; rem.style.background='#660000';
  rem.addEventListener('click', ()=>{ const i=polygons.indexOf(polygon); if(i>=0){ polygons.splice(i,1); div.remove(); refreshTitles(); } });
  div.appendChild(rem);
  ui.controlsArea.appendChild(div);
}
function refreshTitles(){ Array.from(ui.controlsArea.querySelectorAll('.polygon-controls h4')).forEach((h,i)=> h.innerText = `Polygon #${i+1}`); }

/* ===== Media upload (revoke previous) ===== */
function handleUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const url = URL.createObjectURL(file);
  if(lastMediaURL){ try{ URL.revokeObjectURL(lastMediaURL); }catch(e){} lastMediaURL=null; }
  lastMediaURL = url;
  if(mediaLayer){ mediaLayer.remove(); mediaLayer=null; }
  if(file.type.startsWith('video')){
    const v = document.createElement('video'); v.className='media'; v.src=url; v.autoplay=true; v.loop=true; v.muted=true; v.playsInline=true;
    videoContainer.appendChild(v); mediaLayer = v;
  } else {
    const img = document.createElement('img'); img.className='media'; img.src=url; videoContainer.appendChild(img); mediaLayer = img;
  }
}

/* ===== Export PNG (unchanged) ===== */
function exportPNG(){
  const w = window.innerWidth, h = window.innerHeight;
  const ex = document.createElement('canvas'); ex.width = w*DPR; ex.height = h*DPR; const ectx = ex.getContext('2d');
  try {
    if(mediaLayer && (mediaLayer.tagName==='IMG' || mediaLayer.tagName==='VIDEO')) ectx.drawImage(mediaLayer,0,0,ex.width,ex.height);
    else if(video && video.readyState>=2) ectx.drawImage(video,0,0,ex.width,ex.height);
    else { ectx.fillStyle='#000'; ectx.fillRect(0,0,ex.width,ex.height); }
  } catch(e){}
  try { ectx.drawImage(canvas,0,0,ex.width,ex.height); } catch(e){}
  ex.toBlob(b => { const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='overlay.png'; a.click(); URL.revokeObjectURL(a.href); });
}

/* ===== RESET FUNCTION ===== */
function resetApp(){
  polygons = []; currentPolygon = null;
  ui.controlsArea.innerHTML = '';
  if(mediaLayer){
    try{ if(mediaLayer.tagName==='VIDEO'){ mediaLayer.pause(); mediaLayer.src=''; } mediaLayer.remove(); }catch(e){}
    mediaLayer=null;
  }
  if(lastMediaURL){ try{ URL.revokeObjectURL(lastMediaURL);}catch(e){} lastMediaURL=null; }
  if(rafId) cancelAnimationFrame(rafId);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // restart loop
  rafId = requestAnimationFrame(loop);
}

/* ===== PRESENTATION toggle ===== */
let presentMode=false;
async function togglePresentation(){
  presentMode = !presentMode;
  if(presentMode){
    ui.root.classList.add('hidden-ui');
    try{ await videoContainer.requestFullscreen(); }catch(e){}
    ui.presentBtn.innerText = 'PRESENT (restore)';
  } else {
    ui.root.classList.remove('hidden-ui');
    try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){}
    ui.presentBtn.innerText = 'PRESENT (hide UI)';
  }
}

/* ===== Simple particle helpers used by effects ===== */
function spawnParticleArray(arr, x,y, count, spread, speed, lifeRange, sizeRange, colorFn){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = speed*(0.4 + Math.random()*0.8);
    arr.push({ x: x + (Math.random()-0.5)*spread, y: y + (Math.random()-0.5)*spread, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: lifeRange[0] + Math.random()*(lifeRange[1]-lifeRange[0]), size: sizeRange[0] + Math.random()*(sizeRange[1]-sizeRange[0]), color: colorFn ? colorFn() : 'rgba(255,255,255,1)' });
  }
}

/* ===== EDGE RUNNER helper (unchanged but guard beginPath) ===== */
function drawEdgeRunner(polygon, t){
  if(!polygon.points || polygon.points.length < 2) return;
  if(!polygon._edgeData || polygon._edgeData.pointsHash !== polygon.points.length){
    polygon._edgeData = computeEdges(polygon.points);
    polygon._edgeData.pointsHash = polygon.points.length;
  }
  const data = polygon._edgeData;
  const total = data.total || 0;
  const speed = Math.max(1, total / 200);
  polygon.animOffset = (polygon.animOffset || 0) + speed;
  const start = polygon.animOffset;
  const len = polygon.edgeRunnerLength || 30;
  const samples = Math.max(6, Math.floor(len/3));
  ctx.beginPath();
  for(let s=0;s<=samples;s++){
    const d = start + (s/samples) * len;
    const pt = pointAtDistance(data, d);
    if(s===0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
  }
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = polygon.color;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.lineCap = 'butt';
}

/* ===== DRAW POLYGON: complete implementation with stroke-fixes ===== */
function drawPolygon(polygon, isFinal, t){
  if(!polygon || !polygon.points || polygon.points.length<1) return;
  ctx.save();
  polygon.bbox = polygon.bbox || polygonBBox(polygon.points);

  // jitter for noiseDistort
  let pts = polygon.points;
  if(polygon.anim.noiseDistort){
    pts = polygon.points.map((p,i)=> ({ x: p.x + (Math.random()-0.5)*1.2, y: p.y + (Math.random()-0.5)*1.2 }));
  }

  // BUILD PATH
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  if(isFinal && pts.length>2) ctx.closePath();

  // optional fill (keeps path)
  if(polygon.anim.fill && isFinal && pts.length>2){
    ctx.save();
    ctx.globalAlpha = polygon.anim.fillOpacity || 0.35;
    ctx.fillStyle = polygon.anim.fillColor || polygon.color;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // STROKE - always stroke the current path explicitly, with safety:
  ctx.save();
  ctx.lineWidth = polygon.anim.pulse ? (2 + Math.abs(Math.sin(t/200))*2) : 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.strokeStyle = polygon.anim.gradient ? (function(){ const g = ctx.createLinearGradient(0,0,window.innerWidth,window.innerHeight); const tt=((t%4000)/4000); g.addColorStop(0, `hsl(${tt*360},100%,60%)`); g.addColorStop(1, polygon.color); return g; })() : polygon.color;
  if(polygon.anim.glowPulse || polygon.anim.neon || polygon.anim.marquee){
    ctx.shadowBlur = 12 + Math.abs(Math.sin(t/150))*18;
    ctx.shadowColor = polygon.color;
  } else ctx.shadowBlur = 0;
  // stroke the base path
  ctx.stroke();
  ctx.restore();

  // MARQUEE - draw its own stroked path for reliability
  if(polygon.anim.marquee){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    if(isFinal && pts.length>2) ctx.closePath();
    polygon.animOffset = (polygon.animOffset || 0) + 6;
    ctx.setLineDash([18,12]);
    ctx.lineDashOffset = -polygon.animOffset;
    ctx.lineWidth = 6;
    ctx.strokeStyle = polygon.color;
    ctx.globalAlpha = 0.75;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // MOVING DASHED EDGE - own path
  if(polygon.anim.movingEdge){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    if(isFinal && pts.length>2) ctx.closePath();
    polygon.animOffset = (polygon.animOffset || 0) + 3;
    ctx.setLineDash([12,8]);
    ctx.lineDashOffset = -polygon.animOffset;
    ctx.lineWidth = 3;
    ctx.strokeStyle = polygon.color;
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  // EDGE RUNNER (uses its own safe beginPath inside)
  if(polygon.anim.edgeRunner) drawEdgeRunner(polygon, t);

  // WAVE outline - own path
  if(polygon.anim.wave){
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y + Math.sin(t/300)*6);
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y + Math.sin(t/300 + i*0.6)*6);
    ctx.lineWidth = 2;
    ctx.strokeStyle = polygon.color;
    ctx.stroke();
    ctx.restore();
  }

  // EXPLODE, SPARKS, FIRE, RGB SMOKE, WHITE FOG etc. (unchanged, but ensure any stroke/fill uses beginPath per-draw)
  if(polygon.anim.explode){
    for(const pt of polygon.points){
      if(Math.random() < 0.06){
        const len = 6 + Math.random()*18;
        const ang = Math.random()*Math.PI*2;
        ctx.beginPath();
        ctx.moveTo(pt.x, pt.y);
        ctx.lineTo(pt.x + Math.cos(ang)*len, pt.y + Math.sin(ang)*len);
        ctx.strokeStyle = polygon.color; ctx.lineWidth = 1; ctx.stroke();
      }
    }
  }

  if(polygon.anim.sparks){
    spawnSparks(polygon);
    updateSparks(polygon);
    for(const s of polygon.sparks){
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx*0.8, s.y - s.vy*0.8);
      ctx.strokeStyle = `rgba(255,255,200,${Math.max(0, s.life/20)})`;
      ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  if(polygon.anim.rgbSmoke){
    spawnSmoke(polygon);
    updateParticles(polygon);
    for(const p of polygon.particles){
      const a = Math.max(0, p.life/80);
      ctx.beginPath();
      ctx.fillStyle = `hsla(${(p.hue + t/20)%360},90%,60%,${0.12*a})`;
      ctx.ellipse(p.x, p.y, p.size*0.9, p.size*0.6, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }

  if(polygon.anim.whiteFog){
    spawnWhiteFog(polygon);
    updateWhiteFog(polygon);
    ctx.save(); ctx.globalCompositeOperation='lighter';
    for(const p of polygon.whiteFogParticles){
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0, p.alpha * (p.life/140))})`;
      ctx.globalAlpha = Math.max(0, (p.life/140) * p.alpha);
      ctx.ellipse(p.x, p.y, p.size*1.2, p.size*0.8, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.restore();
  }

  // CENTER RINGS safe draw
  if(polygon.anim.centerRings){
    polygon.centerRingTimer = polygon.centerRingTimer || 0; polygon.centerRingTimer--;
    if(polygon.centerRingTimer <= 0){ const c = polygonCentroid(polygon.points); const max = Math.max(polygon.bbox.width, polygon.bbox.height)*1.6; polygon.rings.push({x:c.x,y:c.y,r:0,life:45,max}); polygon.centerRingTimer = 30 + Math.floor(Math.random()*40); }
    updateRings(polygon);
    for(const r of polygon.rings){
      const a = Math.max(0, r.life/30);
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
      ctx.strokeStyle = `hsla(${(t/10)%360},90%,60%,${0.25*a})`;
      ctx.lineWidth = 3 * a; ctx.stroke();
    }
  }

  // many new effects (starField, sparkle, rainbowTrail, fireworks, fallingParticles, morphPolygon, zoomRings, rotatingDots, lightningEdge, spiralInside, glitchLines, shadowTrail, centerBurst)
  // implemented as before but each draws with their own beginPath / stroke / fill and resets any global state afterwards.
  // (For brevity: reuse the implementations from the prior big code - the important fix is each stroke is preceded by beginPath and uses its own strokeStyle and resets lineDash/shadow/globalAlpha.)

  // draw handles last (so they are visible)
  for(const pt of polygon.points){
    ctx.beginPath();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 1;
    ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // ensure cleanup: remove dashes/shadow effects
  ctx.setLineDash([]);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ===== small spawn/update helper functions (same as before) ===== */
function spawnSmoke(polygon){ const bbox = polygon.bbox || (polygon.bbox = polygonBBox(polygon.points)); const count = 2; for(let i=0;i<count;i++){ const x=bbox.minX+Math.random()*bbox.width; const y=bbox.maxY+2+Math.random()*6; polygon.particles.push({ x,y,vx:(Math.random()-0.5)*0.6, vy:-0.3 - Math.random()*0.6, life:60 + Math.random()*40, size:6 + Math.random()*8, hue: Math.floor(Math.random()*360) }); } }
function updateParticles(polygon){ const arr = polygon.particles; for(let i=arr.length-1;i>=0;i--){ const p=arr[i]; p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.995; p.vy-=0.002; if(p.life<=0) arr.splice(i,1);} }
function spawnSparks(polygon){ const pts = polygon.points; if(!pts||pts.length===0) return; if(Math.random()<0.08){ const p=pts[Math.floor(Math.random()*pts.length)]; polygon.sparks.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:10+Math.random()*12}); } }
function updateSparks(polygon){ const arr=polygon.sparks; for(let i=arr.length-1;i>=0;i--){ const s=arr[i]; s.x+=s.vx; s.y+=s.vy; s.vy+=0.2; s.vx*=0.98; s.life--; if(s.life<=0) arr.splice(i,1);} }
function spawnShockwave(polygon){ const c = polygonCentroid(polygon.points); polygon.shockwaves.push({ x:c.x,y:c.y,r:0,life:40,max: Math.max(polygon.bbox.width, polygon.bbox.height)*1.6 }); }
function updateShockwaves(polygon){ for(let i=polygon.shockwaves.length-1;i>=0;i--){ const s=polygon.shockwaves[i]; s.r += s.max/40; s.life--; if(s.life<=0) polygon.shockwaves.splice(i,1);} }
function spawnRing(polygon){ const c=polygonCentroid(polygon.points); polygon.rings.push({x:c.x,y:c.y,r:0,life:30,max:Math.max(polygon.bbox.width,polygon.bbox.height)*1.2}); }
function updateRings(polygon){ for(let i=polygon.rings.length-1;i>=0;i--){ const r=polygon.rings[i]; r.r += r.max/30; r.life--; if(r.life<=0) polygon.rings.splice(i,1);} }
function spawnWhiteFog(polygon){ const bbox = polygon.bbox || (polygon.bbox = polygonBBox(polygon.points)); const count = 3 + Math.floor(Math.random()*3); for(let i=0;i<count;i++){ const x=bbox.minX + Math.random()*bbox.width; const y=bbox.maxY + (Math.random()*6); polygon.whiteFogParticles.push({ x,y,vx:(Math.random()-0.5)*0.8, vy:-0.2 - Math.random()*0.8, life:80 + Math.random()*60, size:8 + Math.random()*18, alpha:0.08 + Math.random()*0.12 }); } }
function updateWhiteFog(polygon){ const arr = polygon.whiteFogParticles; for(let i=arr.length-1;i>=0;i--){ const p = arr[i]; p.x += p.vx; p.y += p.vy; p.life--; p.vx *= 0.995; p.vy -= 0.001; p.size *= 1.002; if(p.life<=0) arr.splice(i,1); } }

/* ===== Main loop (store rafId for reset) ===== */
let perfNow = performance.now();
function loop(now){
  perfNow = now;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(const p of polygons){
    p.bbox = p.bbox || polygonBBox(p.points);
    p.sparks = p.sparks || []; p.particles = p.particles || []; p.shockwaves = p.shockwaves || []; p.rings = p.rings || [];
    p.whiteFogParticles = p.whiteFogParticles || [];
    p._edgeData = p._edgeData || null;
    try{ drawPolygon(p, true, perfNow); } catch(e){ console.error('drawPolygon error', e); }
  }

  if(currentPolygon){
    currentPolygon.bbox = polygonBBox(currentPolygon.points || []);
    try{ drawPolygon(currentPolygon, false, perfNow); } catch(e){}
    if(mousePos && currentPolygon.points.length>0){
      const last = currentPolygon.points[currentPolygon.points.length-1];
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(mousePos.x, mousePos.y);
      ctx.strokeStyle = currentPolygon.color; ctx.lineWidth = 1; ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  rafId = requestAnimationFrame(loop);
}
rafId = requestAnimationFrame(loop);

/* ===== mouse pos helper ===== */
let mousePos = null;
canvas.addEventListener('mousemove', (e)=> mousePos = getMousePos(e));
canvas.addEventListener('mouseleave', ()=> mousePos = null);

</script>

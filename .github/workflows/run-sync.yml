name: Synchronizace Záchranka

on:
  workflow_dispatch: # Umožní spustit skript manuálně tlačítkem

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Stáhnout kód z repozitáře
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Vytvořit config.py ze Secrets
        run: |
          echo "HESLO = '${{ secrets.ZACHRANKA_HESLO }}'" > config.py

      - name: Spustit synchronizační skript
        run: python zachranka_sync.py

      - name: Uložit změny (data) zpět do repozitáře
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add zpravy_zachranka.csv
          git diff --quiet && git diff --cached --quiet || (git commit -m "Automatická aktualizace dat ze Záchranky" && git push)

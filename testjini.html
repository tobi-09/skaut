<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ml5/0.12.2/ml5.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
</head>
<body>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBiax9dVOdtX5k3Ajmq-otnfV6JOlOgS1Q",
        databaseURL: "https://projekce-0-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "projekce-0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let video;
    let detector;
    let detections = [];

    function setup() {
        createCanvas(640, 480);
        video = createCapture(VIDEO);
        video.size(640, 480);
        video.hide();
        detector = ml5.objectDetector('cocossd', modelReady);
    }

    function modelReady() {
        console.log("Model připraven!");
        detect();
    }

    function detect() {
        detector.detect(video, (err, results) => {
            if (results) {
                detections = results.filter(d => d.label === 'person');
                updateFirebase();
            }
            detect();
        });
    }

    function updateFirebase() {
        let uploadData = {};
        detections.forEach((d, i) => {
            uploadData['person' + i] = {
                x: (d.x + d.width / 2) / width, // Normalizace 0-1
                y: (d.y + d.height / 2) / height
            };
        });
        db.ref('detection').set(uploadData);
    }

    function draw() {
        image(video, 0, 0);
        detections.forEach(d => {
            stroke(0, 255, 0);
            noFill();
            rect(d.x, d.y, d.width, d.height);
        });
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hodnocení programu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Google Sans', sans-serif; background-color: #f0f2f5; }
        .star { cursor: pointer; transition: transform 0.2s, color 0.2s; }
        .star:hover { transform: scale(1.2); }
        .star.active { color: #fabb05; }
        .card { transition: box-shadow 0.3s ease; }
        .card:hover { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="text-slate-700 min-h-screen">

    <div class="w-full h-3 bg-blue-700"></div>

    <header class="max-w-2xl mx-auto mt-8 px-4">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 border-t-[10px] border-t-blue-700">
            <h1 id="gameName" class="text-3xl font-bold text-slate-900 mb-2 italic">Načítání...</h1>
            <p class="text-slate-500 border-b pb-4">Děkujeme, že nám pomáháte zlepšovat naše skautské programy. Vaše odpovědi jsou anonymní.</p>
            <p class="text-red-500 text-sm mt-2 font-medium">* Povinné pole</p>
        </div>
    </header>

    <div id="loading" class="flex flex-col justify-center items-center py-20">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-700 mb-4"></div>
        <p class="text-slate-400 animate-pulse">Načítám detaily akce...</p>
    </div>

    <main id="app" class="max-w-2xl mx-auto px-4 mt-4 hidden space-y-4">
        <div id="blocks" class="space-y-4">
            </div>

        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 card">
            <h2 class="text-lg font-medium mb-4 text-slate-900">Co bychom měli vědět? (Dobrovolné)</h2>
            <textarea id="overallComment" 
                class="w-full p-4 border-b-2 border-slate-200 bg-slate-50 focus:border-blue-600 outline-none transition rounded-t-lg resize-none" 
                rows="3" 
                placeholder="Tvoje zpráva..."></textarea>
        </div>

        <div class="flex justify-between items-center pb-12">
            <button id="submitBtn" class="bg-blue-700 hover:bg-blue-800 text-white font-medium px-8 py-2.5 rounded shadow-md transition-all active:scale-95">
                Odeslat
            </button>
            <button onclick="location.reload()" class="text-blue-700 text-sm font-medium hover:bg-blue-50 px-4 py-2 rounded transition">Vymazat formulář</button>
        </div>
    </main>

    <div id="successScreen" class="hidden max-w-2xl mx-auto mt-8 px-4">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">✓</div>
            <h2 class="text-2xl font-bold text-slate-900 mb-4">Vaše odpověď byla zaznamenána.</h2>
            <p class="text-blue-700 underline cursor-pointer hover:text-blue-900" onclick="location.reload()">Odeslat další odpověď</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAgqIX3_OHPrh27vuMJsIUpKLjVLcxMOaU",
            authDomain: "skladatel-progrmu-a-her.firebaseapp.com",
            databaseURL: "https://skladatel-progrmu-a-her-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "skladatel-progrmu-a-her"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');
        let ratings = {}; 

        if (gameId) {
            get(ref(db, 'feedback/' + gameId)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                    document.getElementById('gameName').innerText = data.meta.name || "Bez názvu";
                    
                    const container = document.getElementById('blocks');
                    data.blocks.forEach((b, idx) => {
                        const bId = b.id || `idx_${idx}`;
                        const card = document.createElement('div');
                        card.className = "bg-white p-8 rounded-xl shadow-sm border border-slate-200 card";
                        card.innerHTML = `
                            <h3 class="text-lg font-medium text-slate-900 mb-1">${b.title} <span class="text-red-500">*</span></h3>
                            <p class="text-sm text-slate-400 mb-6 font-normal">${b.type || 'Program'} • ${b.duration || '?'} min</p>
                            <div class="flex gap-2 justify-center sm:justify-start" data-block="${bId}">
                                ${[1,2,3,4,5].map(num => `
                                    <span class="star text-4xl text-slate-200" data-val="${num}">★</span>
                                `).join('')}
                            </div>
                        `;
                        container.appendChild(card);
                    });

                    // Logika hvězdiček
                    document.querySelectorAll('.star').forEach(star => {
                        star.onclick = function() {
                            const bId = this.parentElement.dataset.block;
                            const val = parseInt(this.dataset.val);
                            ratings[bId] = val;

                            // Vybarvení hvězd
                            const siblings = this.parentElement.querySelectorAll('.star');
                            siblings.forEach((s, i) => {
                                if(i < val) s.classList.add('active', 'text-yellow-400');
                                else s.classList.remove('active', 'text-yellow-400');
                            });
                        };
                    });

                } else {
                    document.getElementById('loading').innerHTML = "Program nenalezen.";
                }
            });
        }

        // Odeslání
        document.getElementById('submitBtn').onclick = async () => {
            const blockCount = document.querySelectorAll('[data-block]').length;
            if (Object.keys(ratings).length < blockCount) {
                alert("Prosím ohodnoťte všechny části programu označené hvězdičkou.");
                return;
            }

            const finalData = {
                gameId,
                ratings,
                comment: document.getElementById('overallComment').value,
                submittedAt: new Date().toISOString()
            };

            try {
                await push(ref(db, `responses/feedback/${gameId}`), finalData);
                document.getElementById('app').classList.add('hidden');
                document.getElementById('successScreen').classList.remove('hidden');
                window.scrollTo(0,0);
            } catch (e) {
                alert("Chyba při ukládání: " + e.message);
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VLNY 1968 — Tobiáš Pejsar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --accent: #ffffff;
      --muted: #888888;
      --border: rgba(255, 255, 255, 0.15);
      --font-main: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--accent);
      font-family: var(--font-main); line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    /* NAVIGACE */
    .nav-top { position: fixed; top: 30px; left: 50px; right: 50px; z-index: 1000; display: flex; justify-content: space-between; align-items: center; mix-blend-mode: difference; }
    .works-link { color: #fff; text-decoration: none; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3em; opacity: 0.6; transition: 0.3s; }
    .works-link:hover { opacity: 1; }

    .lang-switcher { display: flex; gap: 15px; }
    .lang-link { background: transparent; border: none; color: #fff; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; opacity: 0.4; }
    .lang-link:hover { opacity: 1; }

    #lang-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: 0.8s; }
    .lang-btn { background: transparent; border: 1px solid var(--border); color: #fff; padding: 15px 40px; cursor: pointer; text-transform: uppercase; margin: 10px; font-size: 13px; letter-spacing: 0.2em; }
    .lang-btn:hover { background: #fff; color: #000; }

    /* HERO */
    .hero { position: relative; width: 100%; height: 100vh; margin-bottom: 120px; }
    .hero-media { width: 100%; height: 100%; }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); } 
    .hero-info { position: absolute; bottom: 80px; left: 50px; }
    .hero-info h1 { font-size: clamp(60px, 15vw, 180px); text-transform: uppercase; letter-spacing: -0.05em; line-height: 0.8; font-weight: 500; }

    .wrap { max-width: 1500px; margin: 0 auto; padding: 0 50px; }

    /* TEXTY */
    .desc { font-size: clamp(22px, 2.5vw, 34px); color: var(--accent); line-height: 1.5; white-space: pre-line; margin-bottom: 150px; font-weight: 300; max-width: 1100px; }

    /* VIDEO SECTION */
    .video-section { margin-bottom: 150px; background: #000; }
    .video-container { position: relative; width: 100%; border: 1px solid var(--border); overflow: hidden; }
    video { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }

    .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 0; margin-bottom: 120px; }
    .meta .card { border-top: 1px solid var(--border); padding: 50px 0; }
    .meta pre { white-space: pre-wrap; font-family: var(--font-main); color: var(--muted); font-size: 14px; line-height: 1.8; text-transform: uppercase; }

    /* SLIDER */
    .chapter { border-top: 1px solid var(--border); padding-top: 100px; margin-bottom: 150px; }
    .chapter .title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5em; margin-bottom: 40px; color: var(--muted); }

    .slider { position: relative; overflow: hidden; }
    .track { display: flex; transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
    .slide { min-width: 100%; height: 85vh; background: #000; }
    .slide img { width: 100%; height: 100%; object-fit: contain; }
    
    .nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 30px; }
    .btn { pointer-events: auto; background: rgba(0,0,0,0.4); border: none; color: #fff; width: 60px; height: 100px; cursor: pointer; font-size: 30px; backdrop-filter: blur(10px); }
    .btn:hover { background: #fff; color: #000; }
    
    .dots { position: absolute; bottom: 40px; left: 50px; display: flex; gap: 15px; }
    .dot { width: 40px; height: 2px; background: rgba(255,255,255,0.2); border: none; cursor: pointer; }
    .dot.active { background: #fff; width: 80px; transition: 0.4s; }

    @media (max-width: 768px) {
      .wrap { padding: 0 25px; }
      .hero-info { left: 25px; }
      .slide { height: 60vh; }
      .nav-top { left: 25px; right: 25px; }
    }
  </style>
</head>
<body>

  <nav class="nav-top">
    <a href="index.html" class="works-link">← Portfolio</a>
    <div class="lang-switcher">
      <button class="lang-link" onclick="setLanguage('cs')">CS</button>
      <button class="lang-link" onclick="setLanguage('en')">EN</button>
    </div>
  </nav>

  <div id="lang-overlay">
    <h1 style="letter-spacing:0.8em; text-transform:uppercase; font-weight:300; font-size:14px; margin-bottom:40px;">VLNY 1968</h1>
    <button class="lang-btn" onclick="setLanguage('cs')">Spustit Archiv</button>
    <button class="lang-btn" onclick="setLanguage('en')">Launch Archive</button>
  </div>

  <header class="hero">
    <div class="hero-media"><img src="https://tobi-09.github.io/skaut/IMG_4398.PNG"></div>
    <div class="hero-info">
      <div style="font-size:11px; letter-spacing:0.8em; opacity:0.4; margin-bottom:20px; font-weight:700;">VIDEOMAPPING / HLAVNÍ ZÁZNAM</div>
      <h1 id="h-title">VLNY</h1>
    </div>
  </header>

  <div class="wrap">
    <p class="desc" id="h-desc"></p>
    
    <section class="video-section">
      <div class="video-container">
        <video controls playsinline poster="https://tobi-09.github.io/skaut/IMG_4397.PNG">
          <source src="https://tobi-09.github.io/skaut/vlnyy.mp4" type="video/mp4">
          Váš prohlížeč nepodporuje přehrávání videa.
        </video>
      </div>
    </section>

    <section class="meta">
      <div class="card"><div style="font-size:11px; opacity:0.4; margin-bottom:25px; text-transform:uppercase; letter-spacing:0.3em;">Technické Specifikace</div><pre id="m-info"></pre></div>
      <div class="card"><div style="font-size:11px; opacity:0.4; margin-bottom:25px; text-transform:uppercase; letter-spacing:0.3em;">Tvůrčí Tým</div><pre id="m-credits"></pre></div>
    </section>

    <section class="chapter">
        <div class="title" id="h-gallery-title">Visual Log (Selected Frames)</div>
        <div class="slider" id="main-slider">
            <div class="track" id="gallery-track"></div>
            <div class="nav"><button class="btn prev">‹</button><button class="btn next">›</button></div>
            <div class="dots" id="gallery-dots"></div>
        </div>
    </section>
  </div>

  <script>
    const data = {
      cs: {
        title: "VLNY",
        desc: `Přelom 60. let. Atmosféra naděje protnutá zvukem rušiček.
Vizuální rekonstrukce cesty od studentského odporu k okupaci.

Příběh začíná ve tmě na strahovských kolejích. Strategické vypínání elektřiny, které mělo umlčet nepohodlné hlasy, vyvolalo protest „Chceme světlo!“. Světlo se stalo symbolem svobody.

Mapping graduje srpnem 1968. Totální kapitulace, příjezd vojsk a okamžik, kdy se vlny naděje tříští o realitu okupace.`,
        info: "Formát: Imerzivní Projekce\nVideo: 4K Barevný Záznam\nLokace: Praha\nPremiéra: 2026",
        credits: "REŽIE & EDIT: Tobiaš Pejsar\nSOUND: Tobiaš Pejsar\nARCHIVNÍ MATERIÁLY: Archiv 68 / Vlny\nFOTO: Aleš Pejsar",
        gallery: "Vizuální Archiv"
      },
      en: {
        title: "WAVES",
        desc: `The late 1960s. An atmosphere of hope interrupted by the hum of jammers.
A visual journey from student resistance to occupation.

Starting in the dark at Strahov dorms. Strategic power outages meant to silence dissent triggered the "We want light!" protests. Light became freedom.

The mapping culminates in August 1968. The surrender, the arrival of tanks, and the moment hope was crushed by occupation.`,
        info: "Format: Immersive Projection\nVideo: 4K Color Record\nLocation: Prague\nPremiere: 2026",
        credits: "DIRECTION & EDIT: Tobias Pejsar\nSOUND: Tobias Pejsar\nARCHIVE: Archiv 68 / Vlny Movie\nPHOTO: Aleš Pejsar",
        gallery: "Visual Archive"
      }
    };

    const photos = [
      "https://tobi-09.github.io/skaut/IMG_4389.PNG",
      "https://tobi-09.github.io/skaut/IMG_4390.PNG",
      "https://tobi-09.github.io/skaut/IMG_4392.PNG",
      "https://tobi-09.github.io/skaut/IMG_4393.PNG",
      "https://tobi-09.github.io/skaut/IMG_4395.PNG",
      "https://tobi-09.github.io/skaut/IMG_4397.PNG",
      "https://tobi-09.github.io/skaut/IMG_4398.PNG",
      "https://tobi-09.github.io/skaut/IMG_4400.PNG",
      "https://tobi-09.github.io/skaut/IMG_4401.PNG",
      "https://tobi-09.github.io/skaut/IMG_4403.PNG"
    ];

    let currentIdx = 0;
    let timer;

    function setLanguage(l) {
      localStorage.setItem('lang', l);
      document.getElementById('lang-overlay').classList.add('hidden');
      document.body.style.overflow = 'auto';
      render(l);
    }

    function render(l) {
      const t = data[l];
      document.getElementById('h-title').textContent = t.title;
      document.getElementById('h-desc').textContent = t.desc;
      document.getElementById('m-info').textContent = t.info;
      document.getElementById('m-credits').textContent = t.credits;
      document.getElementById('h-gallery-title').textContent = t.gallery;

      const track = document.getElementById('gallery-track');
      const dots = document.getElementById('gallery-dots');
      
      track.innerHTML = photos.map(p => `<div class="slide"><img src="${p}"></div>`).join('');
      dots.innerHTML = photos.map((_, i) => `<button class="dot ${i===0?'active':''}" onclick="jumpTo(${i})"></button>`).join('');

      initSlider();
    }

    function initSlider() {
      const track = document.getElementById('gallery-track');
      const dotElements = document.querySelectorAll('.dot');
      const total = photos.length;

      if(timer) clearInterval(timer);

      const update = () => {
        track.style.transform = `translateX(-${currentIdx * 100}%)`;
        dotElements.forEach((d, i) => d.classList.toggle('active', i === currentIdx));
      };

      window.jumpTo = (i) => { currentIdx = i; update(); };
      document.querySelector('.next').onclick = () => { currentIdx = (currentIdx + 1) % total; update(); };
      document.querySelector('.prev').onclick = () => { currentIdx = (currentIdx - 1 + total) % total; update(); };

      timer = setInterval(() => {
        currentIdx = (currentIdx + 1) % total;
        update();
      }, 5000);
    }

    window.onload = () => {
      const saved = localStorage.getItem('lang');
      if (saved) setLanguage(saved);
      else document.body.style.overflow = 'hidden';
    };
  </script>
</body>
</html>

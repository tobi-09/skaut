<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Video Mapping — opravené efekty (funkční) + Export PNG</title>
<style>
  :root{--ui-bg:rgba(0,0,0,0.65);--ui-color:#fff}
  html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,Segoe UI,Roboto,Arial}
  #video-container{position:fixed;inset:0;overflow:hidden;background:#000;z-index:0}
  #video-container video,#video-container img,#video-container .media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:0}
  #canvas-overlay{position:fixed;inset:0;cursor:crosshair;z-index:5;pointer-events:auto}
  .controls{position:fixed;left:12px;top:12px;background:var(--ui-bg);color:var(--ui-color);padding:10px;border-radius:10px;z-index:120;min-width:320px;max-width:540px;backdrop-filter:blur(3px)}
  .hidden-ui{display:none !important;opacity:0 !important;pointer-events:none !important}
  .controls input[type=color]{width:100%}
  .controls button,.controls input[type=file]{width:100%;margin-top:6px;padding:8px;border-radius:6px;border:0;background:#222;color:#fff}
  .hint{font-size:12px;opacity:0.9;margin-top:6px}
  #polygonList{margin-top:8px;max-height:56vh;overflow:auto}
  details.polygon-panel{margin-top:8px;padding:8px;border-radius:6px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
  details.polygon-panel summary{font-weight:700;cursor:pointer;outline:none}
  .effect-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .eff-wrap{flex:1 1 48%;display:flex;flex-direction:column;gap:6px}
  .mini-range{width:100%;height:28px}
  label.block{display:block;margin-top:8px;font-size:12px}
  .small{font-size:12px}
  .muted{opacity:0.8;font-size:12px}
  .row{display:flex;gap:8px}
  .col{flex:1}
</style>
</head>
<body>

<div id="video-container">
  <video id="video" src="" autoplay loop muted playsinline></video>
  <canvas id="canvas-overlay"></canvas>
</div>

<div class="controls" id="ui">
  <div class="row">
    <input id="colorPicker" type="color" value="#ff0044" title="Barva nového polygonu"/>
    <button id="finishPolygon">Dokončit polygon</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="clearPolygons">Vymazat vše</button>
    <button id="resetBtn">RESET</button>
  </div>

  <div class="row" style="margin-top:8px">
    <button id="presentBtn">PRESENT</button>
    <button id="fullscreen">Fullscreen</button>
  </div>

  <div class="row" style="margin-top:8px">
    <button id="exportPNG">Export obrysů PNG</button>
  </div>

  <label class="block">Nahrát médium (obraz/video)</label>
  <input id="uploadMedia" type="file" accept="image/*,video/*"/>

  <label class="block">Globální intenzita</label>
  <input id="globalIntensity" type="range" min="0.5" max="4" step="0.1" value="1.8"/>
  <div class="muted">Vyšší = silnější čáry / větší částice / rychlejší animace</div>

  <div class="hint">Klikni pro přidání bodu. Dvojklik dokončí polygon. Rozbal polygon v seznamu níže a nastav barvu/vyplnění a efekty.</div>

  <div id="polygonList"></div>
</div>

<script>
/* ---------- základ (HiDPI, elementy) ---------- */
const canvas = document.getElementById('canvas-overlay');
const ctx = canvas.getContext('2d');
let DPR = Math.max(1, window.devicePixelRatio || 1);
function resizeCanvas(){
  DPR = Math.max(1, window.devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', ()=> setTimeout(resizeCanvas,30));
document.addEventListener('fullscreenchange', ()=> setTimeout(resizeCanvas,60));
resizeCanvas();

const videoContainer = document.getElementById('video-container');
const video = document.getElementById('video');
const ui = {
  root: document.getElementById('ui'),
  color: document.getElementById('colorPicker'),
  finishBtn: document.getElementById('finishPolygon'),
  clearBtn: document.getElementById('clearPolygons'),
  resetBtn: document.getElementById('resetBtn'),
  presentBtn: document.getElementById('presentBtn'),
  fullscreenBtn: document.getElementById('fullscreen'),
  upload: document.getElementById('uploadMedia'),
  list: document.getElementById('polygonList'),
  globalIntensity: document.getElementById('globalIntensity'),
  exportBtn: document.getElementById('exportPNG')
};
window.EXAGGERATION = parseFloat(ui.globalIntensity.value) || 1.8;
ui.globalIntensity.addEventListener('input', ()=> window.EXAGGERATION = parseFloat(ui.globalIntensity.value));

/* ---------- math / helpers ---------- */
function getMousePos(evt){ const rect = canvas.getBoundingClientRect(); return { x: (evt.clientX - rect.left), y: (evt.clientY - rect.top) }; }
function polygonCentroid(points){ let x=0,y=0; for(const p of points){ x+=p.x; y+=p.y; } return {x:x/points.length, y:y/points.length}; }
function polygonBBox(points){ let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9; for(const p of points){ if(p.x<minX)minX=p.x; if(p.y<minY)minY=p.y; if(p.x>maxX)maxX=p.x; if(p.y>maxY)maxY=p.y; } if(maxX<minX) {minX=0; maxX=0; minY=0; maxY=0;} return {minX,minY,maxX,maxY,width:maxX-minX,height:maxY-minY}; }
function computeEdges(points){ const edges=[]; let total=0; for(let i=0;i<points.length;i++){ const a=points[i], b=points[(i+1)%points.length]; const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy); edges.push({a,b,len,dx,dy}); total+=len;} return {edges,total}; }
function pointAtDistance(pointsData, dist){ const {edges,total}=pointsData; if(!edges||edges.length===0) return {x:0,y:0}; if(total===0) return edges[0].a; let d=(dist%total+total)%total; for(const e of edges){ if(d<=e.len){ const t=e.len===0?0:d/e.len; return {x:e.a.x + e.dx*t, y:e.a.y + e.dy*t}; } d-=e.len;} const last=edges[edges.length-1]; return {x:last.b.x,y:last.b.y}; }
/* hex->hsl */
function hexToHSL(hex){ hex = hex.replace('#',''); if(hex.length===3) hex = hex.split('').map(c=>c+c).join(''); const r = parseInt(hex.substring(0,2),16)/255; const g = parseInt(hex.substring(2,4),16)/255; const b = parseInt(hex.substring(4,6),16)/255; const max = Math.max(r,g,b), min = Math.min(r,g,b); let h=0,s=0,l=(max+min)/2; if(max!==min){ const d=max-min; s = l>0.5? d/(2-max-min): d/(max+min); switch(max){ case r: h=(g-b)/d + (g<b?6:0); break; case g: h=(b-r)/d + 2; break; case b: h=(r-g)/d + 4; break; } h = h*60; } return {h: Math.round(h), s: Math.round(s*100), l: Math.round(l*100)}; }

/* ---------- stav ---------- */
let mediaLayer = null, lastMediaURL = null;
let polygons = [], currentPolygon = null, rafId = null;
let dragPoint = null, mousePos = null;

/* ---------- UI wiring ---------- */
ui.finishBtn.addEventListener('click', finishPolygon);
ui.clearBtn.addEventListener('click', ()=>{ polygons=[]; currentPolygon=null; ui.list.innerHTML=''; });
ui.resetBtn.addEventListener('click', ()=> { if(!confirm('Opravdu RESETovat?')) return; resetApp(); });
ui.presentBtn.addEventListener('click', togglePresentation);
ui.fullscreenBtn.addEventListener('click', ()=> enterFullscreen(videoContainer));
ui.upload.addEventListener('change', handleUpload);
ui.exportBtn.addEventListener('click', exportOutlinePNG);

async function enterFullscreen(elem){ try{ if(!elem) elem=document.documentElement; if(elem.requestFullscreen) await elem.requestFullscreen(); else if(elem.webkitRequestFullscreen) elem.webkitRequestFullscreen(); else if(elem.msRequestFullscreen) elem.msRequestFullscreen(); }catch(e){console.warn('fullscreen error',e);} }

/* ---------- myš / kreslení polygonu (drag bodů) ---------- */
canvas.addEventListener('click', (e)=>{ if(dragPoint) return; const pos=getMousePos(e); if(!currentPolygon) currentPolygon = createEmptyPolygon(ui.color.value); currentPolygon.points.push(pos); });
canvas.addEventListener('dblclick', (e)=>{ e.preventDefault(); finishPolygon(); });
canvas.addEventListener('mousedown', (e)=>{ const pos=getMousePos(e); const t=8; for(const poly of polygons.concat(currentPolygon? [currentPolygon]:[])){ for(const pt of poly.points){ if(Math.hypot(pt.x-pos.x,pt.y-pos.y)<=t){ dragPoint={poly,pt}; return; }}}});
canvas.addEventListener('mousemove', (e)=>{ mousePos = getMousePos(e); if(dragPoint){ dragPoint.pt.x = mousePos.x; dragPoint.pt.y = mousePos.y; dragPoint.poly.bbox = polygonBBox(dragPoint.poly.points); }});
canvas.addEventListener('mouseup', ()=> dragPoint=null);
canvas.addEventListener('mouseleave', ()=> mousePos=null);

/* ---------- polygon factory ---------- */
function createEmptyPolygon(color){
  const hsl = hexToHSL(color || '#ff0044');
  return {
    points: [], color: color || '#ff0044', colorHue: hsl.h || 0,
    animOffset:0, intensity:1,
    anim: { fill:false, colorCycle:false },
    fillColor:'#000000', fillOpacity:0.35, fillType:'solid',
    // effect arrays (initialized)
    particles:[], sparks:[], smoke:[], fog:[], rings:[], shockwaves:[], fireworks:[], falling:[], rotatingDots:[], spiral:[], zoomRings:[], lightning:[], driftCloud:[],
    _edgeData:null, _morphState:{t:0,dir:1,seed:Math.random()}
  };
}

/* ---------- dokončení polygonu + přidání UI ---------- */
function finishPolygon(){
  if(currentPolygon && currentPolygon.points.length>2){
    currentPolygon.bbox = polygonBBox(currentPolygon.points);
    const keys = ['movingEdge','edgeRunner','explode','shockwave','centerRings','marquee','flash','pulse','rgbSmoke','whiteFog','neon','wave','sparks','gradient','particles','rotate','fire','starField','sparkle','glowPulse','rotatingDots','zoomRings','spiralInside','lightningEdge','driftingCloud','noiseDistort','glitchLines','morphPolygon','centerBurst','fallingParticles','fireworks','rainbowTrail','waveFill'];
    keys.forEach(k=>{ if(typeof currentPolygon.anim[k] === 'undefined') currentPolygon.anim[k] = false; if(typeof currentPolygon[k+'_power'] === 'undefined') currentPolygon[k+'_power'] = 1; });
    polygons.push(currentPolygon);
    addPolygonControls(currentPolygon);
    currentPolygon = null;
  } else alert('Polygon musí mít alespoň 3 body.');
}

/* ---------- UI per-polygon (rework: collapsible panels + sliders) ---------- */
function addPolygonControls(polygon){
  const idx = polygons.indexOf(polygon)+1;
  const details = document.createElement('details'); details.className='polygon-panel'; details.open=true;
  const summary = document.createElement('summary'); summary.innerText = `Polygon #${idx} — body: ${polygon.points.length}`; details.appendChild(summary);

  // color + cycle
  const row = document.createElement('div'); row.className='row'; row.style.marginTop='6px';
  const colorInp = document.createElement('input'); colorInp.type='color'; colorInp.value = polygon.color; colorInp.addEventListener('input', e=>{ polygon.color = e.target.value; const h = hexToHSL(polygon.color); polygon.colorHue = h.h; });
  const cycleBtn = document.createElement('button'); cycleBtn.innerText = polygon.anim.colorCycle ? 'Color cycle: ON' : 'Color cycle: OFF';
  cycleBtn.addEventListener('click', ()=>{ polygon.anim.colorCycle = !polygon.anim.colorCycle; cycleBtn.innerText = polygon.anim.colorCycle ? 'Color cycle: ON' : 'Color cycle: OFF'; });
  row.appendChild(colorInp); row.appendChild(cycleBtn); details.appendChild(row);

  // fill controls
  const fillRow = document.createElement('div'); fillRow.style.marginTop='8px';
  const fillBtn = document.createElement('button'); fillBtn.innerText = polygon.anim.fill ? 'Vyplnění: ON' : 'Vyplnění: OFF';
  fillBtn.addEventListener('click', ()=>{ polygon.anim.fill = !polygon.anim.fill; fillBtn.innerText = polygon.anim.fill ? 'Vyplnění: ON' : 'Vyplnění: OFF'; });
  const fillColor = document.createElement('input'); fillColor.type='color'; fillColor.value = polygon.fillColor || '#000000'; fillColor.addEventListener('input', e=> polygon.fillColor = e.target.value);
  const fillOpacity = document.createElement('input'); fillOpacity.type='range'; fillOpacity.min=0; fillOpacity.max=1; fillOpacity.step=0.01; fillOpacity.value = polygon.fillOpacity || 0.35; fillOpacity.addEventListener('input', e=> polygon.fillOpacity = parseFloat(e.target.value));
  const fillType = document.createElement('select'); const o1=document.createElement('option'); o1.value='solid'; o1.text='solid'; const o2=document.createElement('option'); o2.value='gradient'; o2.text='gradient'; fillType.appendChild(o1); fillType.appendChild(o2); fillType.value = polygon.fillType || 'solid'; fillType.addEventListener('change', e=> polygon.fillType = e.target.value);
  fillRow.appendChild(fillBtn); fillRow.appendChild(fillColor); fillRow.appendChild(fillOpacity); fillRow.appendChild(fillType); details.appendChild(fillRow);

  // intensity
  const ilabel = document.createElement('label'); ilabel.className='block small'; ilabel.innerText = 'Intenzita polygonu';
  const irange = document.createElement('input'); irange.type='range'; irange.min=0.3; irange.max=3; irange.step=0.1; irange.value = polygon.intensity || 1; irange.addEventListener('input', ()=> polygon.intensity = parseFloat(irange.value));
  details.appendChild(ilabel); details.appendChild(irange);

  // effects organized
  const categories = {
    'Hrany': ['movingEdge','edgeRunner','marquee','wave','lightningEdge','glowPulse'],
    'Částice & Iskry': ['particles','rgbSmoke','sparkle','sparks','fire','starField','fireworks','fallingParticles'],
    'Atmosféra': ['whiteFog','driftingCloud','centerBurst','rainbowTrail'],
    'Střed & Vlny': ['centerRings','shockwave','zoomRings','rotatingDots','spiralInside','waveFill'],
    'Styl & Deformace': ['gradient','noiseDistort','glitchLines','morphPolygon','gradientSweep']
  };

  for(const [catName, keys] of Object.entries(categories)){
    const box = document.createElement('div'); box.style.marginTop='8px';
    const title = document.createElement('div'); title.innerText = catName; title.style.fontWeight = '700'; box.appendChild(title);
    const grid = document.createElement('div'); grid.className='effect-grid';
    keys.forEach(k=>{
      polygon.anim[k] = polygon.anim[k] || false;
      polygon[k+'_power'] = polygon[k+'_power'] || 1;
      const wrap = document.createElement('div'); wrap.className='eff-wrap';
      const btn = document.createElement('button'); btn.innerText = k + ': ' + (polygon.anim[k] ? 'ON' : 'OFF');
      btn.addEventListener('click', ()=>{ polygon.anim[k] = !polygon.anim[k]; btn.innerText = k + ': ' + (polygon.anim[k] ? 'ON' : 'OFF'); });
      const mini = document.createElement('input'); mini.type='range'; mini.className='mini-range'; mini.min=0.2; mini.max=4; mini.step=0.1; mini.value = polygon[k+'_power'];
      mini.addEventListener('input', ()=> polygon[k+'_power'] = parseFloat(mini.value));
      wrap.appendChild(btn); wrap.appendChild(mini); grid.appendChild(wrap);
    });
    box.appendChild(grid); details.appendChild(box);
  }

  const rem = document.createElement('button'); rem.innerText='Smazat polygon'; rem.style.background='#660000';
  rem.addEventListener('click', ()=>{ const i=polygons.indexOf(polygon); if(i>=0){ polygons.splice(i,1); details.remove(); refreshTitles(); }});
  details.appendChild(rem);

  ui.list.appendChild(details);
}
function refreshTitles(){ Array.from(ui.list.querySelectorAll('summary')).forEach((s,i)=> s.innerText = `Polygon #${i+1} — body: ${polygons[i].points.length}`); }

/* ---------- media upload ---------- */
function handleUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const url = URL.createObjectURL(file);
  if(lastMediaURL){ try{ URL.revokeObjectURL(lastMediaURL); }catch(e){} lastMediaURL=null; }
  lastMediaURL = url;
  if(mediaLayer){ mediaLayer.remove(); mediaLayer=null; }
  if(file.type.startsWith('video')){ const v=document.createElement('video'); v.className='media'; v.src=url; v.autoplay=true; v.loop=true; v.muted=true; v.playsInline=true; v.style.pointerEvents='none'; videoContainer.appendChild(v); mediaLayer=v; }
  else { const img=document.createElement('img'); img.className='media'; img.src=url; img.style.pointerEvents='none'; videoContainer.appendChild(img); mediaLayer=img; }
}

/* ---------- reset / present ---------- */
function resetApp(){ polygons=[]; currentPolygon=null; ui.list.innerHTML=''; if(mediaLayer){ try{ if(mediaLayer.tagName==='VIDEO'){ mediaLayer.pause(); mediaLayer.src=''; } mediaLayer.remove(); }catch(e){} mediaLayer=null; } if(lastMediaURL){ try{ URL.revokeObjectURL(lastMediaURL);}catch(e){} lastMediaURL=null;} if(rafId) cancelAnimationFrame(rafId); ctx.clearRect(0,0,canvas.width,canvas.height); rafId = requestAnimationFrame(loop); }
let presentMode=false;
async function togglePresentation(){ presentMode=!presentMode; if(presentMode){ ui.root.classList.add('hidden-ui'); try{ await enterFullscreen(videoContainer);}catch(e){} ui.presentBtn.innerText='PRESENT (restore)'; } else { ui.root.classList.remove('hidden-ui'); try{ if(document.fullscreenElement) await document.exitFullscreen(); }catch(e){} ui.presentBtn.innerText='PRESENT'; } }

/* ========== EFEKTY - spawn/update/draw ========== */
/* Všechny efekty používají bezpečné beginPath/stroke/fill a respektují polygon[k+'_power'] a polygon.intensity a global EXAGGERATION.
   Pro každý polygon uchováváme pole částic (např. polygon.sparks) a udržujeme jejich počet pod limitem pro výkon. */

/* helper spawn general */
function spawnParticles(arr, x,y, count, speed, lifeBase, sizeBase, colorFn){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = speed*(0.5 + Math.random()*0.8);
    arr.push({ x:x + (Math.random()-0.5)*8, y:y + (Math.random()-0.5)*8, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp, life: lifeBase + Math.random()*lifeBase, size: sizeBase*(0.6 + Math.random()*1.4), color: colorFn?colorFn(): 'rgba(255,255,255,1)'});
  }
}

/* sparks (short bright lines) handled inline */

/* fireworks spawn */
function spawnFirework(polygon){
  if(polygon.fireworks.length > 12) return;
  const c = polygonCentroid(polygon.points);
  const x = c.x + (Math.random()-0.5)*polygon.bbox.width*0.6;
  const y = c.y + (Math.random()-0.5)*polygon.bbox.height*0.4;
  const hue = Math.floor(Math.random()*360);
  polygon.fireworks.push({ x,y, particles: [], hue, life: 60 + Math.random()*40 });
  spawnParticles(polygon.fireworks[polygon.fireworks.length-1].particles, x, y, 20, 6, 40, 3, ()=> `hsla(${hue},90%,60%,1)`);
}

/* spawn falling particles (rain / confetti) */
function spawnFalling(polygon){
  if(polygon.falling.length > 80) return;
  const b = polygon.bbox || polygonBBox(polygon.points);
  for(let i=0;i<2;i++){
    polygon.falling.push({ x: b.minX + Math.random()*b.width, y: b.minY - Math.random()*20, vx:(Math.random()-0.5)*1.2, vy: 0.6 + Math.random()*1.4, life: 200, size: 1.2 + Math.random()*3, color:'rgba(255,255,255,0.85)'});
  }
}

/* lightning edge: create short jagged strokes along edges */
function maybeSpawnLightning(polygon){
  if(Math.random() < 0.01 * (polygon.lightningEdge_power||1)) {
    const data = polygon._edgeData || (polygon._edgeData = computeEdges(polygon.points));
    const total = data.total || 0;
    const pos = Math.random()*total;
    const a = pointAtDistance(data,pos);
    // simple bolt: small polyline outward
    const len = 20 + Math.random()*40;
    const ang = -Math.PI/2 + (Math.random()-0.5)*Math.PI*0.9;
    const points = [];
    let curx = a.x, cury = a.y;
    for(let i=0;i<4;i++){
      const jitter = (Math.random()-0.5)*10;
      curx += Math.cos(ang + i*0.12)*len*0.18 + jitter;
      cury += Math.sin(ang + i*0.12)*len*0.18 + jitter;
      points.push({x:curx,y:cury});
    }
    polygon.lightning.push({ points, life: 6 + Math.random()*6 });
  }
}

/* morph polygon: simple sinusoidal displacement of vertices */
function morphStep(polygon, t){
  const ms = polygon._morphState;
  if(!polygon.anim.morphPolygon) return;
  ms.t += 0.02 * (polygon.morphPolygon_power||1) * (polygon.intensity||1);
  for(let i=0;i<polygon.points.length;i++){
    const p = polygon.points[i];
    const ang = (i / polygon.points.length) * Math.PI*2 + ms.t;
    p._orig = p._orig || {x:p.x, y:p.y};
    p.x = p._orig.x + Math.sin(ang*1.3 + ms.seed*10) * 6 * (polygon.morphPolygon_power||1);
    p.y = p._orig.y + Math.cos(ang*1.1 + ms.seed*20) * 6 * (polygon.morphPolygon_power||1);
  }
}

/* noiseDistort: small jitter every frame (non-destructive) applied when drawing */

/* glitchLines: brief horizontal/vertical line artifacts inside bbox */
function maybeSpawnGlitch(polygon){
  if(Math.random() < 0.004 * (polygon.glitchLines_power||1)){
    const b = polygon.bbox || polygonBBox(polygon.points);
    const count = 2 + Math.floor(Math.random()*4);
    for(let i=0;i<count;i++){
      const x = b.minX + Math.random()*b.width;
      const y = b.minY + Math.random()*b.height;
      polygon.glitchParts.push({ x,y,w: 20 + Math.random()*b.width*0.4, h: 2+Math.random()*8, life: 12 + Math.random()*12, color:`hsla(${Math.floor(Math.random()*360)},80%,60%,0.8)`});
    }
  }
}

/* update / draw helpers for each effect - they ensure beginPath per stroke/fill and cap particle counts */
function updateAndDrawEffects(polygon, t){
  const I = (polygon.intensity||1) * window.EXAGGERATION;

  // SPARKS
  if(polygon.anim.sparks){
    if(Math.random() < 0.18*I) {
      const p0 = polygon.points[Math.floor(Math.random()*polygon.points.length)];
      polygon.sparks.push({ x:p0.x, y:p0.y, vx:(Math.random()-0.5)*6*I, vy:(Math.random()-0.5)*6*I, life:6 + Math.random()*8});
    }
    for(let i=polygon.sparks.length-1;i>=0;i--){
      const s = polygon.sparks[i];
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx*0.4, s.y - s.vy*0.4);
      ctx.strokeStyle = `rgba(255,230,180,${Math.max(0, s.life/10)})`;
      ctx.lineWidth = 1.2 * I * (polygon.sparks_power||1);
      ctx.stroke();
      s.x += s.vx; s.y += s.vy; s.vy += 0.25*I; s.vx *= 0.98; s.life--;
      if(s.life<=0) polygon.sparks.splice(i,1);
    }
  }

  // RGB SMOKE (colorful blobs)
  if(polygon.anim.rgbSmoke){
    if(Math.random() < 0.35*I) {
      const b = polygon.bbox || polygonBBox(polygon.points);
      const x = b.minX + Math.random()*b.width; const y = b.maxY + Math.random()*8;
      polygon.smoke.push({ x,y,vx:(Math.random()-0.5)*0.8*I, vy:-0.2*I - Math.random()*0.9*I, life:100*I + Math.random()*40*I, size:8*I + Math.random()*14*I, hue: Math.floor(Math.random()*360) });
    }
    for(let i=polygon.smoke.length-1;i>=0;i--){
      const p = polygon.smoke[i];
      const a = Math.max(0, p.life/(100*I));
      ctx.beginPath();
      ctx.fillStyle = `hsla(${(p.hue + t/30)%360},85%,60%,${0.14*a})`;
      ctx.ellipse(p.x, p.y, p.size*1.2, p.size*0.9, 0, 0, Math.PI*2);
      ctx.fill();
      p.x += p.vx; p.y += p.vy; p.vy -= 0.002*I; p.life--;
      if(p.life<=0) polygon.smoke.splice(i,1);
    }
  }

  // WHITE FOG (soft white ellipses)
  if(polygon.anim.whiteFog){
    if(Math.random() < 0.6*I){
      const b = polygon.bbox || polygonBBox(polygon.points);
      const x = b.minX + Math.random()*b.width; const y = b.maxY + Math.random()*12;
      polygon.fog.push({ x,y,vx:(Math.random()-0.5)*0.6*I, vy:-0.2*I - Math.random()*0.6*I, life:90*I + Math.random()*40*I, size:10*I + Math.random()*22*I, a:0.06 + Math.random()*0.18 });
    }
    for(let i=polygon.fog.length-1;i>=0;i--){
      const p = polygon.fog[i];
      const alpha = Math.max(0, (p.life/(90*I))*p.a);
      ctx.beginPath();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.ellipse(p.x, p.y, p.size*1.2, p.size*0.8, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      p.x += p.vx; p.y += p.vy; p.life--; p.size *= 1.001;
      if(p.life<=0) polygon.fog.splice(i,1);
    }
  }

  // CENTER RINGS
  if(polygon.anim.centerRings){
    polygon._ringTimer = polygon._ringTimer || 0;
    polygon._ringTimer -= 1;
    if(polygon._ringTimer <= 0){
      const c = polygonCentroid(polygon.points);
      const max = Math.max(polygon.bbox.width, polygon.bbox.height) * 1.6;
      polygon.rings.push({ x:c.x, y:c.y, r:0, life:40, max });
      polygon._ringTimer = 20 + Math.floor(Math.random()*40)/Math.max(1, (polygon.centerRings_power||1));
    }
    for(let i=polygon.rings.length-1;i>=0;i--){
      const r = polygon.rings[i];
      r.r += r.max/35 * (polygon.centerRings_power||1) * I;
      r.life--;
      const a = Math.max(0, r.life/40);
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
      ctx.strokeStyle = `hsla(${(t/8)%360},90%,60%,${0.5*a})`;
      ctx.lineWidth = 2.5 * a * I;
      ctx.stroke();
      if(r.life<=0) polygon.rings.splice(i,1);
    }
  }

  // SHOCKWAVE
  if(polygon.anim.shockwave){
    if(Math.random() < 0.02 * (polygon.shockwave_power||1) * I) {
      const c = polygonCentroid(polygon.points);
      const max = Math.max(polygon.bbox.width, polygon.bbox.height)*1.8;
      polygon.shockwaves.push({ x:c.x, y:c.y, r:0, life:40, max });
    }
    for(let i=polygon.shockwaves.length-1;i>=0;i--){
      const s = polygon.shockwaves[i];
      s.r += s.max/28 * (polygon.shockwave_power||1) * I;
      s.life--;
      const alpha = Math.max(0, s.life/40);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,255,255,${0.12*alpha})`;
      ctx.lineWidth = 6 * alpha * I;
      ctx.stroke();
      if(s.life<=0) polygon.shockwaves.splice(i,1);
    }
  }

  // ZOOM RINGS (center burst expanding filled rings)
  if(polygon.anim.zoomRings){
    if(Math.random() < 0.02 * (polygon.zoomRings_power||1) * I){
      const c = polygonCentroid(polygon.points);
      polygon.zoomRings.push({ x:c.x, y:c.y, r: 4, life: 28 + Math.random()*20, max: Math.max(polygon.bbox.width, polygon.bbox.height) * (1.2 + Math.random()*0.8) });
    }
    for(let i=polygon.zoomRings.length-1;i>=0;i--){
      const z = polygon.zoomRings[i];
      z.r += z.max / z.life * (polygon.zoomRings_power||1) * I;
      z.life--;
      const a = Math.max(0, z.life/60);
      ctx.beginPath();
      ctx.arc(z.x, z.y, z.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${0.06 * a})`;
      ctx.fill();
      if(z.life<=0) polygon.zoomRings.splice(i,1);
    }
  }

  // ROTATING DOTS
  if(polygon.anim.rotatingDots){
    polygon._rotAngle = (polygon._rotAngle || 0) + 0.06*(polygon.rotatingDots_power||1) * I;
    const c = polygonCentroid(polygon.points);
    const R = Math.max(polygon.bbox.width, polygon.bbox.height) * 0.45;
    const count = Math.min(20, 6 + Math.floor(6*(polygon.rotatingDots_power||1)));
    for(let i=0;i<count;i++){
      const ang = polygon._rotAngle + (i/count)*Math.PI*2;
      const x = c.x + Math.cos(ang)*R;
      const y = c.y + Math.sin(ang)*R;
      ctx.beginPath(); ctx.fillStyle = `hsla(${(t/10 + i*30)%360},80%,65%,0.9)`; ctx.arc(x,y,3 * I, 0, Math.PI*2); ctx.fill();
    }
  }

  // SPIRAL INSIDE
  if(polygon.anim.spiralInside){
    polygon._spiro = polygon._spiro || 0;
    polygon._spiro += 0.06 * (polygon.spiralInside_power||1) * I;
    const c = polygonCentroid(polygon.points);
    const arms = 2 + Math.floor((polygon.spiralInside_power||1)*2);
    for(let i=0;i<50;i++){
      const ang = i*0.35 + polygon._spiro;
      const r = (i/50) * Math.max(1, polygon.bbox.width*0.45);
      const x = c.x + Math.cos(ang*arms)*r;
      const y = c.y + Math.sin(ang*arms)*r;
      ctx.beginPath(); ctx.fillStyle = `hsla(${(t/8 + i*6)%360},90%,60%,${0.5 - i/120})`; ctx.arc(x,y,2 * I,0,Math.PI*2); ctx.fill();
    }
  }

  // FIREWORKS
  if(polygon.anim.fireworks){
    if(Math.random() < 0.02*I) spawnFirework(polygon);
    for(let i=polygon.fireworks.length-1;i>=0;i--){
      const fw = polygon.fireworks[i];
      // draw sub-particles
      for(let j=fw.particles.length-1;j>=0;j--){
        const p = fw.particles[j];
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life/40);
        ctx.arc(p.x, p.y, Math.max(1, p.size), 0, Math.PI*2);
        ctx.fill();
        p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life--;
        if(p.life<=0) fw.particles.splice(j,1);
      }
      fw.life--;
      if(fw.particles.length === 0 || fw.life <= 0) polygon.fireworks.splice(i,1);
    }
  }

  // FALLING (rain/confetti)
  if(polygon.anim.fallingParticles){
    spawnFalling(polygon);
    for(let i=polygon.falling.length-1;i>=0;i--){
      const f = polygon.falling[i];
      ctx.beginPath(); ctx.fillStyle = f.color; ctx.globalAlpha = Math.min(1, f.life/200); ctx.arc(f.x, f.y, f.size * I,0,Math.PI*2); ctx.fill();
      f.x += f.vx; f.y += f.vy; f.vy += 0.02*(polygon.fallingParticles_power||1) * I; f.life--;
      if(f.y > polygon.bbox.maxY + 40 || f.life <= 0) polygon.falling.splice(i,1);
    }
    ctx.globalAlpha = 1;
  }

  // LIGHTNING
  if(polygon.anim.lightningEdge){
    maybeSpawnLightning(polygon);
    for(let i=polygon.lightning.length-1;i>=0;i--){
      const L = polygon.lightning[i];
      ctx.beginPath();
      ctx.moveTo(L.points[0].x, L.points[0].y);
      for(let k=1;k<L.points.length;k++) ctx.lineTo(L.points[k].x, L.points[k].y);
      ctx.strokeStyle = `rgba(220,240,255,${0.9 * (L.life/8)})`;
      ctx.lineWidth = 2.5 * (polygon.lightningEdge_power||1) * I;
      ctx.stroke();
      L.life--;
      if(L.life<=0) polygon.lightning.splice(i,1);
    }
  }

  // GLITCH LINES
  if(polygon.anim.glitchLines){
    maybeSpawnGlitch(polygon);
    for(let i=polygon.glitchParts.length-1;i>=0;i--){
      const g = polygon.glitchParts[i];
      ctx.beginPath();
      ctx.fillStyle = g.color;
      ctx.globalAlpha = Math.max(0, g.life/20);
      ctx.fillRect(g.x, g.y, g.w, g.h);
      g.life--;
      if(g.life<=0) polygon.glitchParts.splice(i,1);
    }
    ctx.globalAlpha = 1;
  }

  // MORPH POLYGON
  if(polygon.anim.morphPolygon) morphStep(polygon, t);

  // limit arrays for perf
  if(polygon.smoke.length > 160) polygon.smoke.splice(0, polygon.smoke.length - 140);
  if(polygon.fog.length > 120) polygon.fog.splice(0, polygon.fog.length - 100);
  if(polygon.sparks.length > 200) polygon.sparks.splice(0, polygon.sparks.length - 160);
  if(polygon.fireworks.length > 12) polygon.fireworks.splice(0, polygon.fireworks.length - 12);
}

/* ---------- kreslení polygonu (vše v jednom, bezpečné) ---------- */
function drawPolygon(polygon, isFinal, t){
  if(!polygon || !polygon.points || polygon.points.length<1) return;
  ctx.save();
  polygon.bbox = polygon.bbox || polygonBBox(polygon.points);
  const I = (polygon.intensity || 1) * window.EXAGGERATION;

  // stroke color (color cycle)
  let strokeColor = polygon.color;
  if(polygon.anim.colorCycle){
    const hue = ((polygon.colorHue || 0) + (t/20)) % 360;
    strokeColor = `hsl(${Math.round(hue)},85%,60%)`;
  }

  // noiseDistort: create temp pts
  let pts = polygon.points;
  if(polygon.anim.noiseDistort){
    pts = polygon.points.map(p=> ({ x: p.x + (Math.random()-0.5)*1.2*I, y: p.y + (Math.random()-0.5)*1.2*I }));
  }

  // build path
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  if(isFinal && pts.length>2) ctx.closePath();

  // fill
  if(polygon.anim.fill && isFinal && pts.length>2){
    ctx.save();
    const alpha = Math.max(0, (polygon.fillOpacity || 0.35) * Math.min(1, I*0.9));
    if(polygon.fillType === 'solid'){
      ctx.globalAlpha = alpha;
      ctx.fillStyle = polygon.fillColor || polygon.color;
      ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      const c = polygonCentroid(polygon.points);
      const rad = Math.max(polygon.bbox.width, polygon.bbox.height) * 0.9;
      const g = ctx.createRadialGradient(c.x, c.y, 2, c.x, c.y, rad);
      let baseHue = polygon.colorHue || 0;
      if(polygon.anim.colorCycle) baseHue = (baseHue + t/20) % 360;
      g.addColorStop(0, `hsla(${Math.round(baseHue)},90%,60%,${alpha})`);
      g.addColorStop(1, `hsla(${Math.round((baseHue+60)%360)},80%,40%,0.03)`);
      ctx.fillStyle = g; ctx.fill();
    }
    ctx.restore();
  }

  // base stroke
  ctx.save();
  ctx.lineWidth = (polygon.anim.pulse ? (2 + Math.abs(Math.sin(t/200)) * 2) : 2) * Math.max(1, I*0.7) * (polygon.stroke_power||1);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = (polygon.anim.gradient ? (function(){ const g=ctx.createLinearGradient(0,0,innerWidth,innerHeight); const tt=((t%4000)/4000); g.addColorStop(0,`hsl(${tt*360},100%,60%)`); g.addColorStop(1,strokeColor); return g; })() : strokeColor);
  if(polygon.anim.glowPulse || polygon.anim.neon){ ctx.shadowBlur = 18 * I * (polygon.glowPulse_power||1); ctx.shadowColor = strokeColor; } else ctx.shadowBlur = 0;
  ctx.stroke();
  ctx.restore();

  // marquee
  if(polygon.anim.marquee){
    ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    polygon.animOffset = (polygon.animOffset || 0) + 6 * I * (polygon.marquee_power||1);
    ctx.setLineDash([18*I,12*I]); ctx.lineDashOffset = -polygon.animOffset; ctx.lineWidth = 6 * I * (polygon.marquee_power||1);
    ctx.strokeStyle = strokeColor; ctx.globalAlpha = 0.75; ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1; ctx.restore();
  }

  // movingEdge
  if(polygon.anim.movingEdge){
    ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
    polygon.animOffset = (polygon.animOffset || 0) + 3 * I * (polygon.movingEdge_power||1);
    ctx.setLineDash([12*I,8*I]); ctx.lineDashOffset = -polygon.animOffset; ctx.lineWidth = 3 * I; ctx.strokeStyle = strokeColor; ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  }

  // edgeRunner
  if(polygon.anim.edgeRunner){
    if(!polygon._edgeData || polygon._edgeData.pointsHash !== polygon.points.length){ polygon._edgeData = computeEdges(polygon.points); polygon._edgeData.pointsHash = polygon.points.length; }
    const data = polygon._edgeData;
    const total = data.total || 0;
    const speed = Math.max(1, total/120) * (polygon.edgeRunner_power||1) * I;
    polygon.animOffset = (polygon.animOffset || 0) + speed;
    const start = polygon.animOffset;
    const len = (polygon.edgeRunnerLength||30) * (polygon.edgeRunner_power||1) * I;
    const samples = Math.max(6, Math.floor(len/3));
    ctx.beginPath();
    for(let s=0;s<=samples;s++){
      const d = start + (s/samples)*len; const pt = pointAtDistance(data,d);
      if(s===0) ctx.moveTo(pt.x,pt.y); else ctx.lineTo(pt.x,pt.y);
    }
    ctx.lineWidth = 4 * I; ctx.lineCap = 'round'; ctx.strokeStyle = strokeColor; ctx.stroke(); ctx.setLineDash([]);
  }

  // wave outline
  if(polygon.anim.wave){
    ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y + Math.sin(t/300)*6*(polygon.wave_power||1));
    for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y + Math.sin(t/300 + i*0.6)*6*(polygon.wave_power||1));
    ctx.lineWidth = 2 * I; ctx.strokeStyle = strokeColor; ctx.stroke(); ctx.restore();
  }

  // explode short lines on verts
  if(polygon.anim.explode){
    for(const pt of polygon.points){
      if(Math.random() < 0.06){ const len = 6 + Math.random()*28*(polygon.explode_power||1); const ang = Math.random()*Math.PI*2; ctx.beginPath(); ctx.moveTo(pt.x,pt.y); ctx.lineTo(pt.x + Math.cos(ang)*len, pt.y + Math.sin(ang)*len); ctx.strokeStyle = strokeColor; ctx.lineWidth = 1 * I; ctx.stroke(); }
    }
  }

  // draw handles last so they are clickable
  for(const pt of polygon.points){
    ctx.beginPath(); ctx.fillStyle = '#fff'; ctx.globalAlpha = 1; ctx.arc(pt.x,pt.y,4*Math.min(1.6,I),0,Math.PI*2); ctx.fill();
  }

  // after base drawing, update and draw per-effect particles and other effects
  updateAndDrawEffects(polygon, t);

  // draw lightning, glitched rects etc. handled inside updateAndDrawEffects
  ctx.setLineDash([]); ctx.shadowBlur = 0; ctx.globalAlpha = 1; ctx.restore();
}

/* ---------- hlavní smyčka ---------- */
let perfNow = performance.now();
function loop(now){
  perfNow = now;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(const p of polygons){
    p.bbox = p.bbox || polygonBBox(p.points);
    // ensure arrays exist
    p.sparks = p.sparks || []; p.smoke = p.smoke || []; p.fog = p.fog || []; p.rings = p.rings || []; p.shockwaves = p.shockwaves || [];
    p.fireworks = p.fireworks || []; p.falling = p.falling || []; p.lightning = p.lightning || []; p.glitchParts = p.glitchParts || [];
    try{ drawPolygon(p, true, perfNow); } catch(e){ console.error('drawPolygon error', e); }
  }

  if(currentPolygon){
    currentPolygon.bbox = polygonBBox(currentPolygon.points || []);
    try{ drawPolygon(currentPolygon, false, perfNow); } catch(e){}
    if(mousePos && currentPolygon.points.length>0){
      const last = currentPolygon.points[currentPolygon.points.length-1];
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(mousePos.x, mousePos.y);
      ctx.strokeStyle = currentPolygon.color; ctx.lineWidth = 1; ctx.setLineDash([6,6]); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  rafId = requestAnimationFrame(loop);
}
rafId = requestAnimationFrame(loop);


/* === Export PNG s bílými obrysy na černém pozadí === */
function exportOutlinePNG(){
  // export canvas at device-pixel resolution
  const exportCanvas = document.createElement('canvas');
  // match internal (device) pixel size
  exportCanvas.width = canvas.width;
  exportCanvas.height = canvas.height;
  const ectx = exportCanvas.getContext('2d');
  // use same transform as main canvas so we can draw using CSS px coordinates
  ectx.setTransform(DPR,0,0,DPR,0,0);

  // black background (draw using CSS px coords)
  ectx.fillStyle = '#000';
  ectx.fillRect(0,0,innerWidth,innerHeight);

  // white outlines
  ectx.strokeStyle = '#fff';
  ectx.lineWidth = 2; // in CSS px (transform scales by DPR)
  ectx.lineJoin = 'round';
  ectx.lineCap = 'round';

  for(const polygon of polygons){
    if(!polygon || !polygon.points || polygon.points.length < 2) continue;
    ectx.beginPath();
    ectx.moveTo(polygon.points[0].x, polygon.points[0].y);
    for(let i=1;i<polygon.points.length;i++) ectx.lineTo(polygon.points[i].x, polygon.points[i].y);
    if(polygon.points.length>2) ectx.closePath();
    ectx.stroke();
  }

  // create download
  exportCanvas.toBlob(function(blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'polygons_outline.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 2000);
  }, 'image/png');
}

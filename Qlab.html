<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QLab Firebase Ovladač</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212; color: #ffffff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        /* PIN obrazovka */
        #loginScreen {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; width: 100%; max-width: 320px;
            background: #1e1e1e; padding: 30px; border-radius: 16px;
            border: 1px solid #333; margin-top: 50px;
        }
        #loginScreen input {
            width: 100%; padding: 15px; font-size: 24px; text-align: center;
            letter-spacing: 8px; border-radius: 10px; border: 1px solid #444;
            background: #121212; color: white; margin: 15px 0; box-sizing: border-box;
        }
        .btn-login {
            width: 100%; padding: 15px; font-size: 18px; font-weight: bold;
            background: #2e7d32; color: white; border: none; border-radius: 10px; cursor: pointer;
        }

        /* Hlavní ovladač */
        #appScreen { display: none; flex-direction: column; align-items: center; width: 100%; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 400px; margin-bottom: 15px;
        }
        .status {
            padding: 6px 14px; border-radius: 20px;
            font-size: 13px; font-weight: bold; background-color: #1b5e20; color: #a5d6a7;
        }
        .btn-logout {
            background: #333; color: #ccc; border: none; padding: 6px 12px;
            border-radius: 8px; font-size: 12px; cursor: pointer;
        }
        .display-box {
            width: 100%; max-width: 400px; background: #1e1e1e;
            border: 1px solid #333; border-radius: 12px; padding: 15px;
            margin-bottom: 20px; box-sizing: border-box;
        }
        .label { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: 1px; margin-bottom: 4px; }
        .running-list { margin-bottom: 15px; min-height: 28px; }
        .running-item {
            background: #1b5e20; color: #fff; padding: 8px 12px;
            border-radius: 6px; font-weight: bold; margin-bottom: 5px;
            display: flex; justify-content: space-between;
        }
        .running-item.paused { background: #f9a825; color: #121212; }
        .empty-msg { color: #555; font-style: italic; font-size: 14px; }
        .next-cue {
            background: #2a2a2a; padding: 12px; border-radius: 8px;
            border-left: 4px solid #4caf50; font-size: 18px; font-weight: bold;
        }
        .cue-num { color: #81c784; margin-right: 8px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 400px; }
        .grid button { padding: 20px; font-size: 16px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; }
        .grid button:active { transform: scale(0.96); }
        .btn-go { grid-column: span 2; background-color: #2e7d32; font-size: 28px; padding: 30px; }
        .btn-resume { background-color: #0277bd; }
        .btn-pause { background-color: #f9a825; color: #121212 !important; }
        .btn-stop { background-color: #d84315; }
        .btn-reset { background-color: #455a64; }
        .btn-nav { background-color: #2c2c2c; }
        .btn-panic { background-color: #c62828; grid-column: span 2; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div style="font-size: 18px; font-weight: bold;">Zadej PIN pro QLab</div>
        <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="••••">
        <button class="btn-login" onclick="savePin()">Odemknout</button>
    </div>

    <div id="appScreen">
        <div class="top-bar">
            <div class="status">Firebase Cloud (Zabezpečeno)</div>
            <button class="btn-logout" onclick="logout()">Zamknout</button>
        </div>

        <div class="display-box">
            <div class="label">Právě hraje / Pozastaveno:</div>
            <div id="runningList" class="running-list">
                <div class="empty-msg">Nic nehraje</div>
            </div>

            <div class="label">Připraveno na GO (Další):</div>
            <div class="next-cue">
                <span id="nextNum" class="cue-num"></span>
                <span id="nextName">Čekám na data...</span>
            </div>
        </div>

        <div class="grid">
            <button class="btn-go" onclick="sendOSC('/go')">GO</button>
            <button class="btn-pause" onclick="sendOSC('/pause')">⏸ PAUSE</button>
            <button class="btn-resume" onclick="sendOSC('/resume')">▶ RESUME</button>
            <button class="btn-stop" onclick="sendOSC('/stop')">⏹ STOP</button>
            <button class="btn-reset" onclick="sendOSC('/reset')">⏮ RESET</button>
            <button class="btn-nav" onclick="sendOSC('/playhead/previous')">▲ Předchozí</button>
            <button class="btn-nav" onclick="sendOSC('/playhead/next')">▼ Další</button>
            <button class="btn-panic" onclick="sendOSC('/panic')">PANIC (Fade Out)</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, onValue } from "https://gstatic.com";

        const firebaseConfig = {
            databaseURL: "https://firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userPin = localStorage.getItem("qlab_pin") || "";

        function checkAuth() {
            if (userPin.length === 4) {
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("appScreen").style.display = "flex";
            } else {
                document.getElementById("loginScreen").style.display = "flex";
                document.getElementById("appScreen").style.display = "none";
            }
        }

        window.savePin = function() {
            const val = document.getElementById("pinInput").value.trim();
            if (val.length === 4) {
                userPin = val;
                localStorage.setItem("qlab_pin", val);
                checkAuth();
            } else {
                alert("Zadej 4 číslice.");
            }
        };

        window.logout = function() {
            userPin = "";
            localStorage.removeItem("qlab_pin");
            document.getElementById("pinInput").value = "";
            checkAuth();
        };

        checkAuth();

        const runningListEl = document.getElementById('runningList');
        const nextNumEl = document.getElementById('nextNum');
        const nextNameEl = document.getElementById('nextName');

        onValue(ref(db, "qlab_status"), (snapshot) => {
            const status = snapshot.val();
            if (!status) return;

            nextNameEl.textContent = status.nextName || "---";
            nextNumEl.textContent = status.nextNum ? `[${status.nextNum}]` : "";

            const running = status.running || [];
            if (running.length === 0) {
                runningListEl.innerHTML = '<div class="empty-msg">Nic nehraje</div>';
            } else {
                runningListEl.innerHTML = running.map(c => `
                    <div class="running-item ${c.isPaused ? 'paused' : ''}">
                        <span>${c.number ? '[' + c.number + '] ' : ''}${c.name}</span>
                        <span>${c.isPaused ? '⏸ PAUZA' : '▶ HRAJE'}</span>
                    </div>
                `).join('');
            }
        });

        window.sendOSC = function(address, args = []) {
            set(ref(db, "qlab_command"), {
                address: address,
                args: args,
                pin: userPin,
                timestamp: Date.now()
            });
        };
    </script>
</body>
</html>

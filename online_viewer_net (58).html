<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Immersivní večeře – Dekodér QR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top, #181820 0%, #050509 60%);
      color: #f5f5f5;
    }
    header {
      padding: 30px 20px 10px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(230,193,122,0.4);
      background: rgba(5,5,9,0.75);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e6c17a;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .card {
      max-width: 640px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 20px;
      background: #101018;
      border: 1px solid #252538;
      box-shadow: 0 18px 48px rgba(0,0,0,0.7);
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #e6c17a, #f3ddaf);
      color: #211910;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }
    .btn.secondary {
      background: transparent;
      border: 1px solid rgba(230,193,122,0.6);
      color: #e6c17a;
    }
    #reader {
      width: 100%;
      min-height: 240px;
      background: #050509;
      border-radius: 14px;
      overflow: hidden;
    }
    .upload-box {
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px dashed rgba(230,193,122,0.4);
      font-size: 13px;
    }
    input[type="file"] {
      margin-top: 8px;
      color: #fff;
      font-size: 12px;
    }
    .hint {
      margin-top: 6px;
      font-size: 11px;
      color: #9a9aad;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(5,5,9,0.85);
      border: 1px solid rgba(230,193,122,0.4);
      display: none;
    }
    .row {
      margin-bottom: 10px;
    }
    .label {
      font-size: 11px;
      color: #9a9aad;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .value {
      font-size: 14px;
      margin-top: 2px;
    }
    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #9a9aad;
    }
    .status.error {
      color: #f28b82;
    }
    .status.ok {
      color: #8bc34a;
    }
  </style>
</head>

<body>

<header>
  <div class="badge">IMMERSIVNÍ VEČEŘE</div>
  <h1>Dekodér QR</h1>
</header>

<div class="card">

  <div class="controls">
    <button id="startCam" class="btn">Spustit kameru</button>
    <div class="upload-box">
      <div>nebo nahrajte obrázek QR kódu</div>
      <input type="file" id="fileInput" accept="image/*">
      <div class="hint">Můžete nahrát screenshot nebo fotku QR z mobilu.</div>
    </div>
    <div id="status" class="status">Kamera ještě nebyla spuštěna.</div>
  </div>

  <div id="reader"></div>

  <div id="result" class="result">
    <div class="row"><div class="label">Jméno</div><div id="r-n" class="value"></div></div>
    <div class="row"><div class="label">Porce</div><div id="r-p" class="value"></div></div>
    <div class="row"><div class="label">Dieta</div><div id="r-d" class="value"></div></div>
    <div class="row"><div class="label">Sezení</div><div id="r-s" class="value"></div></div>
    <div class="row"><div class="label">Souhlas</div><div id="r-c" class="value"></div></div>
  </div>
</div>

<script>
// mapa čísel na jména – uprav si podle skutečných hostů
const names = {
  1: "Aleš Pejsar",
  2: "Dana Pejsarova",
  3: "Krystina Pejsarova",
  4: "Matiaš pejsar",
  5: "5 Jméno Příjmení",
  6: "6 Jméno Příjmení"
};

function translatePortion(p) {
  if (p === "1" || p === 1) return "1 – menší";
  if (p === "2" || p === 2) return "2 – standardní";
  if (p === "3" || p === 3) return "3 – větší";
  return "neuvedeno";
}

function translateSeat(s) {
  if (s === "l") return "levá";
  if (s === "p") return "pravá";
  if (s === "b") return "bez preference";
  return "neuvedeno";
}

function translateConsent(c) {
  return c === 1 || c === "1" ? "souhlas udělen" : "ne";
}

function showData(data) {
  document.getElementById("r-n").textContent = names[data.n] || "neuvedeno";
  document.getElementById("r-p").textContent = translatePortion(data.p);
  document.getElementById("r-d").textContent = data.d || "neuvedeno";
  document.getElementById("r-s").textContent = translateSeat(data.s);
  document.getElementById("r-c").textContent = translateConsent(data.c);
  document.getElementById("result").style.display = "block";
}

function parseJson(text) {
  try { return JSON.parse(text); }
  catch { return null; }
}

let scanned = false;
let scanner = null;
let cameraRunning = false;

const statusEl = document.getElementById("status");

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (type ? " " + type : "");
}

async function startCamera() {
  if (!scanner) {
    scanner = new Html5Qrcode("reader");
  }

  if (cameraRunning) {
    setStatus("Kamera už běží.", "ok");
    return;
  }

  scanned = false;

  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 240 },
      decoded => {
        if (scanned) return;
        scanned = true;

        const data = parseJson(decoded);
        if (!data) {
          scanned = false;
          return;
        }

        scanner.stop().then(() => {
          cameraRunning = false;
          setStatus("QR úspěšně načten z kamery.", "ok");
        });
        showData(data);
      }
    );
    cameraRunning = true;
    setStatus("Kamera spuštěna, namiřte na QR kód.", "ok");
  } catch (err) {
    console.error("Nepodařilo se spustit kameru:", err);
    setStatus("Nepodařilo se spustit kameru: " + err, "error");
  }
}

document.getElementById("startCam").addEventListener("click", () => {
  startCamera();
});

// nahrání souboru
document.getElementById("fileInput").addEventListener("change", async e => {
  const file = e.target.files[0];
  if (!file) return;

  // lazy init scanneru, pokud ještě neexistuje
  if (!scanner) {
    scanner = new Html5Qrcode("reader");
  }

  // pokud běží kamera, zastavit
  if (cameraRunning) {
    try {
      await scanner.stop();
    } catch (err) {
      console.warn("Chyba při zastavování kamery:", err);
    }
    cameraRunning = false;
  }

  try {
    const decoded = await scanner.scanFile(file, true);
    const data = parseJson(decoded);
    if (data) {
      setStatus("QR úspěšně načten ze souboru.", "ok");
      showData(data);
    } else {
      setStatus("Soubor obsahuje neplatný QR obsah.", "error");
    }
  } catch (err) {
    console.error("Chyba při načítání souboru:", err);
    setStatus("Chyba při čtení QR ze souboru: " + err, "error");
  }
});
</script>

</body>
</html>

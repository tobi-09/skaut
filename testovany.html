<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Immersive Experience — Oživlá Večeře</title>
  <style>
    :root{
      --bg:#050509; --card:#0b0b10; --muted:rgba(255,255,255,0.7);
      --accent:#e6e6e6;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Inter, system-ui, -apple-system, sans-serif;
      background:var(--bg); color:var(--accent); overflow-x: hidden;
    }

    /* JAZYKOVÝ PŘEPÍNAČ */
    .lang-switcher { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px; }
    .lang-link {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff;
      padding: 5px 10px; font-size: 11px; text-transform: uppercase; cursor: pointer; border-radius: 4px;
    }

    /* ÚVODNÍ VOLBA JAZYKA */
    #lang-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease;
    }
    #lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .lang-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff;
      padding: 12px 30px; cursor: pointer; text-transform: uppercase; margin: 10px;
    }
    .lang-btn:hover { background: #fff; color: #000; }

    /* HERO SEKCE */
    .hero { position: relative; width: 100%; height: 85vh; margin-bottom: 40px; }
    .hero-media { width: 100%; height: 100%; }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; }
    .hero-info { position: absolute; bottom: 50px; left: 30px; z-index: 10; }
    .hero-info h1 { font-size: clamp(30px, 7vw, 65px); margin: 0; text-transform: uppercase; letter-spacing: -0.02em; }

    .wrap { max-width:1100px; margin:0 auto; padding: 0 25px; }

    /* TEXTOVÉ BLOKY */
    .desc { font-size: 16px; color: var(--muted); line-height: 1.7; white-space: pre-line; margin-bottom: 60px; }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; margin-bottom:60px; }
    .meta .card { background:linear-gradient(180deg,#0b0b12,#050509); padding:24px; border-radius:12px; border:1px solid rgba(255,255,255,0.03); }
    .meta pre { white-space:pre-wrap; font-family:inherit; color:var(--muted); font-size:14px; line-height:1.6; margin:0; }

    /* VIDEA */
    .video-section { margin: 60px 0; }
    .video-box { border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.06); background:#000; }
    video { width:100%; display:block; }

    /* KAPITOLY A OBRÁZKY */
    .chapter { border-top:1px solid rgba(255,255,255,0.05); padding-top:50px; margin-top:50px; }
    .chapter .title { font-size: 14px; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 15px; }
    .chapter .text { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 30px; }

    .chapter-hero, .slide { 
      width: 100%; height: 600px; border-radius: 12px; overflow: hidden; background: #000; 
    }
    .chapter-hero img, .slide img { width: 100%; height: 100%; object-fit: cover; }

    /* SLIDER */
    .slider { position: relative; margin-top: 20px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .track { display: flex; transition: transform 0.7s cubic-bezier(0.2, 1, 0.2, 1); }
    .slide { min-width: 100%; flex-shrink: 0; }
    .nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 15px; }
    .btn { pointer-events: auto; background: rgba(0,0,0,0.5); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 20px; }
    .dots { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
    .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.3); border-radius: 50%; border: none; cursor: pointer; }
    .dot.active { background: #fff; }

    /* RESPONZIVNÍ ÚPRAVA PRO MOBIL */
    @media (max-width: 768px) {
      .hero { height: 60vh; }
      .chapter-hero, .slide { height: 300px; } /* Zmenšení obrázků na mobilu */
      .chapter-hero img, .slide img { object-fit: contain; } /* Aby fotky nebyly ořezané */
      .wrap { padding: 0 18px; }
      .desc, .chapter .text { font-size: 14px; }
      .meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="lang-switcher">
    <button class="lang-link" onclick="setLanguage('cs')">CS</button>
    <button class="lang-link" onclick="setLanguage('en')">EN</button>
  </div>

  <div id="lang-overlay">
    <h2 style="letter-spacing:0.2em; text-transform:uppercase;">Oživlá Večeře</h2>
    <div>
      <button class="lang-btn" onclick="setLanguage('cs')">Čeština</button>
      <button class="lang-btn" onclick="setLanguage('en')">English</button>
    </div>
  </div>

  <header class="hero">
    <div class="hero-media"><img src="https://tobi-09.github.io/skaut/img/IMG_4298.jpg"></div>
    <div class="hero-info">
      <div style="font-size:11px; letter-spacing:0.3em; opacity:0.6; margin-bottom:10px">IMMERSIVE EXPERIENCE</div>
      <h1 id="h-title">Oživlá Večeře</h1>
    </div>
  </header>

  <div class="wrap">
    <p class="desc" id="h-desc"></p>

    <section class="video-section">
      <div class="video-box">
        <video controls playsinline poster="https://tobi-09.github.io/skaut/img/IMG_4271.jpg">
          <source src="https://tobi-09.github.io/skaut/img/1.2videa.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <section class="meta">
      <div class="card"><div style="font-size:11px; opacity:0.4; margin-bottom:15px; text-transform:uppercase;">Info</div><pre id="m-info"></pre></div>
      <div class="card"><div style="font-size:11px; opacity:0.4; margin-bottom:15px; text-transform:uppercase;">Credits</div><pre id="m-credits"></pre></div>
    </section>

    <div id="content-root"></div>
  </div>

  <script>
    const data = {
      cs: {
        title: "Oživlá Večeře",
        desc: `Tato imerzivní zkušenost sleduje cestu jídla nikoli jako objektu, ale jako svědka času. Cestu, která dnes trvá miliony vteřin a stovky kilometrů — a přesto začala v absolutním tichu.

Vyprávění nás zve k návratu na samotný začátek. Do prázdna. Do okamžiku, který neměl včerejšek. Před chutí. Před směrem. Před samotným časem.

Zkušenost se rozvíjí ve třech etapách: kosmická evoluce, planetární život a lidské systémy. Postupně se přesouvá od přírodních procesů ke konstruovaným realitám — od organických rytmů ke strukturám, městům a automatizovaným sítím.`,
        info: "ROLE: Režie · Design · Koncept\nTYP: Imerzivní zážitek\nPREMIÉRA: 1. 1. 2026 · Praha",
        credits: "REŽIE & KONCEPT: Tobiaš Pejsar\nSOUND & VIZUÁL: Tobiaš Pejsar\nFOTO: Tobiaš Pejsar, Aleš Pejsar",
        chaps: [
          { t: "Kapitola 1 – Vesmír", d: "Cesta jídla k nám trvá miliony vteřin. Pojďme se podívat zpět do ticha a vzduchoprázdna. Formují se první hvězdy a spolu s nimi planetky – žhavé a rozpálené." },
          { t: "Kapitola 2 – Lidstvo", d: "Ve formujících se oceánech začíná život. Na Zemi se rodí první lidé. Člověk buduje monumenty, infrastrukturu a domy. Oheň dává lidstvu sílu a světlo." },
          { t: "Kapitola 3 – Budoucnost", d: "Co jednou následovalo gravitaci, nyní následuje algoritmy a logistiku. Jídlo se stává tichým spojovníkem mezi počátky a technologickou budoucností." }
        ]
      },
      en: {
        title: "Animated Dinner",
        desc: `This immersive experience follows the journey of food as a witness of time. A journey that today spans millions of seconds — yet once began in absolute silence.`,
        info: "ROLE: Direction · Design · Concept\nTYPE: Immersive Experience\nPREMIERE: Jan 1, 2026 · Prague",
        credits: "DIRECTION & CONCEPT: Tobiaš Pejsar\nSOUND & VISUALS: Tobiaš Pejsar\nPHOTO: Tobiaš Pejsar, Aleš Pejsar",
        chaps: [
          { t: "Chapter 1 – Universe", d: "The journey begins in silence. First stars and planets are formed — glowing with heat and motion." },
          { t: "Chapter 2 – Humanity", d: "Life begins in the oceans. Humans are born. Humanity builds monumental structures and infrastructure." },
          { t: "Chapter 3 – Future", d: "What once followed gravity now follows algorithms and logistics. Food as a link to the future." }
        ]
      }
    };

    const photoGroups = [
      ["https://tobi-09.github.io/skaut/img/IMG_4243.jpg", "https://tobi-09.github.io/skaut/img/IMG_4244.jpg", "https://tobi-09.github.io/skaut/img/IMG_4311.jpg", "https://tobi-09.github.io/skaut/img/IMG_4313.jpg", "https://tobi-09.github.io/skaut/img/IMG_4314.jpg", "https://tobi-09.github.io/skaut/img/IMG_4315.jpg"],
      ["https://tobi-09.github.io/skaut/img/FullSizeRender.JPG", "https://tobi-09.github.io/skaut/img/IMG_4247.jpg", "https://tobi-09.github.io/skaut/img/IMG_4248.jpg", "https://tobi-09.github.io/skaut/img/IMG_4250.jpg", "https://tobi-09.github.io/skaut/img/IMG_4251.jpg", "https://tobi-09.github.io/skaut/img/IMG_4253.jpg", "https://tobi-09.github.io/skaut/img/IMG_4254.jpg", "https://tobi-09.github.io/skaut/img/IMG_4255.jpg", "https://tobi-09.github.io/skaut/img/IMG_4256.jpg", "https://tobi-09.github.io/skaut/img/IMG_4257.jpg", "https://tobi-09.github.io/skaut/img/IMG_4259.jpg", "https://tobi-09.github.io/skaut/img/IMG_4264.jpg", "https://tobi-09.github.io/skaut/img/IMG_4267.jpg", "https://tobi-09.github.io/skaut/img/IMG_4269.jpg", "https://tobi-09.github.io/skaut/img/IMG_4270.jpg", "https://tobi-09.github.io/skaut/img/IMG_4271.jpg", "https://tobi-09.github.io/skaut/img/IMG_4272.jpg"],
      ["https://tobi-09.github.io/skaut/img/IMG_4274.jpg", "https://tobi-09.github.io/skaut/img/IMG_4276.jpg", "https://tobi-09.github.io/skaut/img/IMG_4277.jpg", "https://tobi-09.github.io/skaut/img/IMG_4278.jpg", "https://tobi-09.github.io/skaut/img/IMG_4279.jpg", "https://tobi-09.github.io/skaut/img/IMG_4280.jpg", "https://tobi-09.github.io/skaut/img/IMG_4281.jpg", "https://tobi-09.github.io/skaut/img/IMG_4282.jpg", "https://tobi-09.github.io/skaut/img/IMG_4283.jpg", "https://tobi-09.github.io/skaut/img/IMG_4284.jpg", "https://tobi-09.github.io/skaut/img/IMG_4285.jpg", "https://tobi-09.github.io/skaut/img/IMG_4286.jpg", "https://tobi-09.github.io/skaut/img/IMG_4287.jpg", "https://tobi-09.github.io/skaut/img/IMG_4288.jpg", "https://tobi-09.github.io/skaut/img/IMG_4289.jpg", "https://tobi-09.github.io/skaut/img/IMG_4290.jpg", "https://tobi-09.github.io/skaut/img/IMG_4291.jpg", "https://tobi-09.github.io/skaut/img/IMG_4304.jpg", "https://tobi-09.github.io/skaut/img/IMG_4305.jpg", "https://tobi-09.github.io/skaut/img/IMG_4307.jpg"]
    ];

    function setLanguage(l) {
      localStorage.setItem('lang', l);
      document.getElementById('lang-overlay').classList.add('hidden');
      document.body.style.overflow = 'auto';
      render(l);
    }

    function render(l) {
      const t = data[l];
      document.getElementById('h-title').textContent = t.title;
      document.getElementById('h-desc').textContent = t.desc;
      document.getElementById('m-info').textContent = t.info;
      document.getElementById('m-credits').textContent = t.credits;

      const root = document.getElementById('content-root');
      root.innerHTML = '';

      photoGroups.forEach((pics, i) => {
        // Druhé video mezi kapitolami
        if (i === 1) {
          root.innerHTML += `<section class="video-section"><div class="video-box"><video controls playsinline><source src="https://tobi-09.github.io/skaut/img/2.2videa.mp4" type="video/mp4"></video></div></section>`;
        }

        const sec = document.createElement('section');
        sec.className = 'chapter';
        sec.innerHTML = `
          <div class="title">${t.chaps[i].t}</div>
          <p class="text">${t.chaps[i].d}</p>
          <div class="chapter-hero"><img src="${pics[0]}"></div>
          <div class="slider">
            <div class="track">${pics.slice(1).map(p => `<div class="slide"><img src="${p}"></div>`).join('')}</div>
            <div class="nav"><button class="btn prev">‹</button><button class="btn next">›</button></div>
            <div class="dots">${pics.slice(1).map((_, j) => `<button class="dot ${j===0?'active':''}"></button>`).join('')}</div>
          </div>
        `;
        root.appendChild(sec);
      });
      initSliders();
    }

    function initSliders() {
      document.querySelectorAll('.slider').forEach(s => {
        const tr = s.querySelector('.track');
        const slides = s.querySelectorAll('.slide');
        const dots = s.querySelectorAll('.dot');
        let idx = 0;
        const up = () => {
          tr.style.transform = `translateX(-${idx * 100}%)`;
          dots.forEach((d, k) => d.classList.toggle('active', k === idx));
        };
        s.querySelector('.next').onclick = () => { idx = (idx + 1) % slides.length; up(); };
        s.querySelector('.prev').onclick = () => { idx = (idx - 1 + slides.length) % slides.length; up(); };
        dots.forEach((d, k) => d.onclick = () => { idx = k; up(); });
      });
    }

    window.onload = () => {
      const saved = localStorage.getItem('lang');
      if (saved) setLanguage(saved);
      else document.body.style.overflow = 'hidden';
    };
  </script>
</body>
</html>

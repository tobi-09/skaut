<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Immersive Experience — Oživlá Večeře</title>
  <style>
    :root{
      --bg:#050509; --card:#0b0b10; --muted:rgba(255,255,255,0.7);
      --accent:#e6e6e6;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, sans-serif;
      background:var(--bg);
      color:var(--accent);
      overflow-x: hidden;
    }

    .lang-switcher { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px; }
    .lang-link {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff;
      padding: 5px 10px; font-size: 11px; text-transform: uppercase; cursor: pointer; border-radius: 4px;
    }

    #lang-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .lang-btns { display: flex; gap: 20px; margin-top: 30px; }
    .lang-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff;
      padding: 12px 30px; cursor: pointer; text-transform: uppercase;
    }

    /* HERO */
    .hero { position: relative; width: 100%; height: 80vh; margin-bottom: 30px; }
    .hero-media { width: 100%; height: 100%; }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; }
    .hero-info { position: absolute; bottom: 40px; left: 30px; z-index: 10; }
    .hero-info h1 { font-size: clamp(28px, 6vw, 60px); margin: 0; text-transform: uppercase; }

    .wrap { max-width:1100px; margin:0 auto; padding: 0 24px; }

    /* TEXTY */
    .desc { font-size: 15px; color: var(--muted); line-height: 1.6; white-space: pre-line; margin-bottom: 40px; }
    .video-box { border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.06); background:#000; margin-bottom: 40px; }
    video { width:100%; display:block; }

    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px; margin-bottom:50px; }
    .meta .card { background:linear-gradient(180deg,#0b0b12,#050509); padding:20px; border-radius:12px; border:1px solid rgba(255,255,255,0.03); }
    .meta pre { white-space:pre-wrap; font-family:inherit; color:var(--muted); font-size:13px; line-height:1.5; margin:0; }

    /* KAPITOLY A SLIDER */
    .chapter { border-top: 1px solid rgba(255,255,255,0.05); padding-top: 40px; margin-top: 40px; }
    .chapter .title { font-size: 14px; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 12px; }
    .chapter .text { color: var(--muted); font-size: 14px; line-height: 1.5; margin-bottom: 20px; }

    /* OPRAVA VELIKOSTI OBRÁZKŮ */
    .chapter-hero, .slide { 
      width: 100%; 
      height: 500px; /* Výška pro desktop */
      border-radius: 10px; 
      overflow: hidden; 
      background: #000; 
      margin-bottom: 15px;
    }
    .chapter-hero img, .slide img { width: 100%; height: 100%; object-fit: cover; }

    .slider { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .track { display: flex; transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.2, 1); }
    .slide { min-width: 100%; margin-bottom: 0; }
    
    .nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); padding: 0 10px; pointer-events: none; }
    .btn { pointer-events: auto; background: rgba(0,0,0,0.5); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
    
    .slider-footer { background: #0b0b12; padding: 10px 15px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); text-transform: uppercase; }

    /* MOBILNÍ ZOBRAZENÍ - ZMENŠENÍ */
    @media (max-width: 768px) {
      .hero { height: 50vh; }
      .wrap { padding: 0 16px; }
      
      /* Zde se zmenšují obrázky na mobilu */
      .chapter-hero, .slide { 
        height: 280px; /* Menší výška pro mobil */
      }
      .chapter-hero img, .slide img { 
        object-fit: contain; /* Celý obrázek bez ořezu */
      }
      
      .hero-info { left: 20px; bottom: 20px; }
      .meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="lang-switcher">
    <button class="lang-link" onclick="setLanguage('cs')">CS</button>
    <button class="lang-link" onclick="setLanguage('en')">EN</button>
  </div>

  <div id="lang-overlay">
    <div class="lang-box">
      <h2 style="text-transform:uppercase; letter-spacing:0.2em">Oživlá Večeře</h2>
      <div class="lang-btns">
        <button class="lang-btn" onclick="setLanguage('cs')">Čeština</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
      </div>
    </div>
  </div>

  <header class="hero">
    <div class="hero-media"><img src="https://tobi-09.github.io/skaut/img/IMG_4298.jpg"></div>
    <div class="hero-info">
      <div style="font-size:10px; letter-spacing:0.3em; text-transform:uppercase; opacity:0.6; margin-bottom:8px">Immersive Experience</div>
      <h1 id="hero-title">Oživlá Večeře</h1>
    </div>
  </header>

  <div class="wrap">
    <p class="desc" id="main-desc"></p>

    <div class="video-box">
      <video controls playsinline poster="https://tobi-09.github.io/skaut/img/IMG_4271.jpg">
        <source src="https://tobi-09.github.io/skaut/img/1.2videa.mp4" type="video/mp4">
      </video>
    </div>

    <section class="meta">
      <div class="card"><div style="font-size:10px; text-transform:uppercase; margin-bottom:10px; opacity:0.5">Info</div><pre id="info-content"></pre></div>
      <div class="card"><div style="font-size:10px; text-transform:uppercase; margin-bottom:10px; opacity:0.5">Credits</div><pre id="credits-content"></pre></div>
    </section>

    <div id="chapters-container"></div>
  </div>

  <script>
    const content = {
      cs: {
        mainDesc: `Tato imerzivní zkušenost sleduje cestu jídla nikoli jako objektu, ale jako svědka času. Cestu, která dnes trvá miliony vteřin a stovky kilometrů — a přesto začala v absolutním tichu.`,
        info: "ROLE: Režie · Design · Koncept\nTYP: Imerzivní zážitek\nPREMIÉRA: 1. 1. 2026",
        credits: "REŽIE: Tobiaš Pejsar\nVIZUÁL: Tobiaš Pejsar\nFOTO: Tobiaš Pejsar, Aleš Pejsar",
        chaps: [
          { t: "Kapitola 1 – Vesmír", d: "Formují se první hvězdy a spolu s nimi planetky – žhavé a rozpálené. Cesta jídla začíná v hlubokém tichu vesmíru." },
          { t: "Kapitola 2 – Lidstvo", d: "Na Zemi se rodí první lidé a Slunce poprvé nebude samo. Člověk buduje ohromné monumenty a infrastrukturu." },
          { t: "Kapitola 3 – Budoucnost", d: "Co jednou následovalo gravitaci, nyní následuje algoritmy a logistiku. Jídlo jako spojovník věků." }
        ]
      },
      en: {
        mainDesc: `This immersive experience follows the journey of food not as an object, but as a witness of time. A journey that today spans millions of seconds.`,
        info: "ROLE: Direction · Design · Concept\nTYPE: Immersive Experience\nPREMIERE: Jan 1, 2026",
        credits: "DIRECTION: Tobiaš Pejsar\nVISUALS: Tobiaš Pejsar\nPHOTO: Tobiaš Pejsar, Aleš Pejsar",
        chaps: [
          { t: "Chapter 1 – Universe", d: "The first stars form, and with them, the planets – glowing and hot. The journey begins in silence." },
          { t: "Chapter 2 – Humanity", d: "First humans are born on Earth. Humanity builds monumental structures and infrastructure." },
          { t: "Chapter 3 – Future", d: "What once followed gravity now follows algorithms and logistics." }
        ]
      }
    };

    const photos = [
      ["https://tobi-09.github.io/skaut/img/IMG_4243.jpg", "https://tobi-09.github.io/skaut/img/IMG_4244.jpg", "https://tobi-09.github.io/skaut/img/IMG_4311.jpg"],
      ["https://tobi-09.github.io/skaut/img/FullSizeRender.JPG", "https://tobi-09.github.io/skaut/img/IMG_4247.jpg", "https://tobi-09.github.io/skaut/img/IMG_4248.jpg"],
      ["https://tobi-09.github.io/skaut/img/IMG_4274.jpg", "https://tobi-09.github.io/skaut/img/IMG_4276.jpg", "https://tobi-09.github.io/skaut/img/IMG_4277.jpg"]
    ];

    function setLanguage(lang) {
      localStorage.setItem('pref_lang', lang);
      document.getElementById('lang-overlay').classList.add('hidden');
      document.body.style.overflow = 'auto';
      render(lang);
    }

    function render(lang) {
      const t = content[lang];
      document.getElementById('main-desc').textContent = t.mainDesc;
      document.getElementById('info-content').textContent = t.info;
      document.getElementById('credits-content').textContent = t.credits;

      const container = document.getElementById('chapters-container');
      container.innerHTML = '';

      photos.forEach((pics, i) => {
        const sec = document.createElement('div');
        sec.className = 'chapter';
        sec.innerHTML = `
          <div class="title">${t.chaps[i].t}</div>
          <div class="text">${t.chaps[i].d}</div>
          <div class="chapter-hero"><img src="${pics[0]}"></div>
          <div class="slider">
            <div class="track">${pics.slice(1).map(p => `<div class="slide"><img src="${p}"></div>`).join('')}</div>
            <div class="nav"><button class="btn" onclick="move(this, -1)">‹</button><button class="btn" onclick="move(this, 1)">›</button></div>
            <div class="slider-footer"><span>Fotografie</span><span>← →</span></div>
          </div>
        `;
        container.appendChild(sec);
      });
    }

    function move(btn, dir) {
      const track = btn.closest('.slider').querySelector('.track');
      const slides = track.querySelectorAll('.slide').length;
      let cur = parseInt(track.dataset.idx || 0);
      cur = (cur + dir + slides) % slides;
      track.style.transform = `translateX(-${cur * 100}%)`;
      track.dataset.idx = cur;
    }

    window.onload = () => {
      const saved = localStorage.getItem('pref_lang');
      if (saved) setLanguage(saved);
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Immersive Experience — Oživlá Večeře</title>
  <style>
    :root{
      --bg:#050509; --card:#0b0b10; --muted:rgba(255,255,255,0.7);
      --accent:#e6e6e6;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Inter, system-ui, -apple-system, sans-serif;
      background:var(--bg); color:var(--accent); overflow-x: hidden; padding-bottom: 60px;
    }
    .lang-switcher { position: fixed; top: 20px; right: 20px; z-index: 1000; display: flex; gap: 10px; }
    .lang-link {
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: #fff;
      padding: 5px 10px; font-size: 11px; text-transform: uppercase; cursor: pointer; border-radius: 4px;
    }
    #lang-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.6s;
    }
    #lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .wrap { max-width:1100px; margin:0 auto; padding: 40px 20px; }
    .hero { margin-bottom: 60px; }
    .hero-media { width: 100%; height: 65vh; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 30px; }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; }
    .desc { font-size: 16px; line-height: 1.8; color: var(--muted); white-space: pre-line; margin-bottom: 40px; }
    .video-section { margin: 60px 0; }
    .video-box { border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.06); background:#000; }
    video { width:100%; display:block; }
    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; margin-bottom:60px; }
    .meta .card { background:linear-gradient(180deg,#0b0b12,#050509); padding:24px; border-radius:12px; border:1px solid rgba(255,255,255,0.03); }
    .meta pre { white-space:pre-wrap; font-family:inherit; color:var(--muted); font-size:14px; margin:0; line-height:1.6; }
    .chapter { border-top: 1px solid rgba(255,255,255,0.05); padding-top: 50px; margin-top: 50px; }
    .chapter .title { font-size: 22px; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.1em; }
    .chapter-hero, .slide { width: 100%; height: 600px; border-radius: 12px; overflow: hidden; background: #000; }
    .chapter-hero img, .slide img { width: 100%; height: 100%; object-fit: cover; }
    .slider { position: relative; margin-top: 20px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .track { display: flex; transition: transform 0.8s cubic-bezier(0.2, 1, 0.2, 1); }
    .slide { min-width: 100%; }
    .nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 15px; }
    .btn { pointer-events: auto; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; }
    .slider-footer { background: #0b0b12; padding: 12px 20px; display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); text-transform: uppercase; }

    @media (max-width: 900px) {
      .hero-media, .chapter-hero, .slide { height: 45vh; }
      .chapter-hero img, .slide img { object-fit: contain; }
      .desc { font-size: 15px; }
    }
  </style>
</head>
<body>

  <div class="lang-switcher">
    <button class="lang-link" onclick="setLanguage('cs')">CS</button>
    <button class="lang-link" onclick="setLanguage('en')">EN</button>
  </div>

  <div id="lang-overlay">
    <h2 style="letter-spacing:0.3em; font-weight:300;">OŽIVLÁ VEČEŘE</h2>
    <div style="display:flex; gap:20px; margin-top:30px;">
      <button class="lang-link" style="padding:10px 25px" onclick="setLanguage('cs')">Čeština</button>
      <button class="lang-link" style="padding:10px 25px" onclick="setLanguage('en')">English</button>
    </div>
  </div>

  <div class="wrap">
    <header class="hero">
      <div class="hero-media"><img src="https://tobi-09.github.io/skaut/img/IMG_4298.jpg"></div>
      <div class="tag">Immersive Experience</div>
      <h1 id="h-title" style="font-size: clamp(30px, 7vw, 60px); margin:0 0 20px;"></h1>
      <p class="desc" id="h-desc"></p>
    </header>

    <section class="video-section">
      <div class="video-box">
        <video controls playsinline poster="https://tobi-09.github.io/skaut/img/IMG_4271.jpg">
          <source src="https://tobi-09.github.io/skaut/img/1.2videa.mp4" type="video/mp4">
        </video>
      </div>
    </section>

    <section class="meta">
      <div class="card"><div style="font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:15px; text-transform:uppercase;">Info</div><pre id="m-info"></pre></div>
      <div class="card"><div style="font-size:11px; color:rgba(255,255,255,0.4); margin-bottom:15px; text-transform:uppercase;">Credits</div><pre id="m-credits"></pre></div>
    </section>

    <div id="ch-root"></div>
  </div>

  <script>
    const data = {
      cs: {
        title: "Oživlá Večeře",
        desc: `Tato imerzivní zkušenost sleduje cestu jídla nikoli jako objektu, ale jako svědka času. Cestu, která dnes trvá miliony vteřin a stovky kilometrů — a přesto začala v absolutním tichu.

Vyprávění nás zve k návratu na samotný začátek. Do prázdna. Do okamžiku, který neměl včerejšek. Před chutí. Před směrem. Před samotným časem.

Zkušenost se rozvíjí ve třech etapách, které odrážejí kosmickou evoluci, planetární život a lidské systémy. Postupně se přesouvá od přírodních procesů ke konstruovaným realitám — od organických rytmů ke strukturám, městům a automatizovaným sítím.`,
        info: "ROLE: Režie · Design · Koncept\nTYP: Imerzivní zážitek\nDATUM: 2026\nPREMIÉRA: 1. 1. 2026 · Praha",
        credits: "REŽIE, DESIGN & KONCEPT: Tobiaš Pejsar\nSOUND & VIZUÁL: Tobiaš Pejsar\nFOTOGRAFIE: Tobiaš Pejsar, Aleš Pejsar",
        more: "Více fotografií",
        chaps: [
          { t: "Kapitola 1 – Vesmír", d: "Cesta jídla k nám trvá miliony vteřin. Pojďme se podívat zpět do ticha a vzduchoprázdna, do dne, který neměl včerejšek. Formují se první hvězdy a spolu s nimi planetky – žhavé a rozpálené." },
          { t: "Kapitola 2 – Lidstvo", d: "Ve formujících se oceánech začíná život. Na Zemi se rodí první lidé a Slunce poprvé nebude samo. Oheň dává člověku teplo, světlo a sílu budovat monumenty a infrastrukturu." },
          { t: "Kapitola 3 – Budoucnost", d: "Co jednou následovalo gravitaci, nyní následuje algoritmy a logistiku. Jídlo se stává tichým spojovníkem mezi počátky a budoucností, formovaným silami technologie." }
        ]
      },
      en: {
        title: "Animated Dinner",
        desc: `This immersive experience follows the journey of food not as an object, but as a witness of time. A journey that today spans millions of seconds and hundreds of kilometers — yet once began in absolute silence.

The narrative invites us to return to the beginning. To emptiness. To a moment without yesterday. Before taste. Before direction. Before time itself.

The experience unfolds in three stages, mirroring cosmic evolution, planetary life, and human systems. Moving from natural processes to constructed realities — from organic rhythms to structures, cities, and automated networks.`,
        info: "ROLE: Direction · Design · Concept\nTYPE: Immersive Experience\nDATE: 2026\nPREMIERE: Jan 1, 2026 · Prague",
        credits: "DIRECTION, DESIGN & CONCEPT: Tobiaš Pejsar\nSOUND & VISUALS: Tobiaš Pejsar\nPHOTO: Tobiaš Pejsar, Aleš Pejsar",
        more: "More photos",
        chaps: [
          { t: "Chapter 1 – Universe", d: "The journey of food takes millions of seconds. Let's look back into the silence, to a day without yesterday. The first stars and planets are formed – glowing and hot." },
          { t: "Chapter 2 – Humanity", d: "Life begins in the oceans. The first humans are born, and the Sun is no longer alone. Fire gives warmth, light, and the power to build monuments and infrastructure." },
          { t: "Chapter 3 – Future", d: "What once followed gravity now follows algorithms and logistics. Food becomes a silent link between origins and futures, shaped by technology." }
        ]
      }
    };

    const photoGroups = [
      ["https://tobi-09.github.io/skaut/img/IMG_4243.jpg", "https://tobi-09.github.io/skaut/img/IMG_4244.jpg", "https://tobi-09.github.io/skaut/img/IMG_4311.jpg", "https://tobi-09.github.io/skaut/img/IMG_4313.jpg", "https://tobi-09.github.io/skaut/img/IMG_4314.jpg", "https://tobi-09.github.io/skaut/img/IMG_4315.jpg"],
      ["https://tobi-09.github.io/skaut/img/FullSizeRender.JPG", "https://tobi-09.github.io/skaut/img/IMG_4247.jpg", "https://tobi-09.github.io/skaut/img/IMG_4248.jpg", "https://tobi-09.github.io/skaut/img/IMG_4250.jpg", "https://tobi-09.github.io/skaut/img/IMG_4251.jpg", "https://tobi-09.github.io/skaut/img/IMG_4253.jpg", "https://tobi-09.github.io/skaut/img/IMG_4254.jpg", "https://tobi-09.github.io/skaut/img/IMG_4255.jpg", "https://tobi-09.github.io/skaut/img/IMG_4256.jpg", "https://tobi-09.github.io/skaut/img/IMG_4257.jpg", "https://tobi-09.github.io/skaut/img/IMG_4259.jpg", "https://tobi-09.github.io/skaut/img/IMG_4264.jpg", "https://tobi-09.github.io/skaut/img/IMG_4267.jpg", "https://tobi-09.github.io/skaut/img/IMG_4269.jpg", "https://tobi-09.github.io/skaut/img/IMG_4270.jpg", "https://tobi-09.github.io/skaut/img/IMG_4271.jpg", "https://tobi-09.github.io/skaut/img/IMG_4272.jpg"],
      ["https://tobi-09.github.io/skaut/img/IMG_4274.jpg", "https://tobi-09.github.io/skaut/img/IMG_4276.jpg", "https://tobi-09.github.io/skaut/img/IMG_4277.jpg", "https://tobi-09.github.io/skaut/img/IMG_4278.jpg", "https://tobi-09.github.io/skaut/img/IMG_4279.jpg", "https://tobi-09.github.io/skaut/img/IMG_4280.jpg", "https://tobi-09.github.io/skaut/img/IMG_4281.jpg", "https://tobi-09.github.io/skaut/img/IMG_4282.jpg", "https://tobi-09.github.io/skaut/img/IMG_4283.jpg", "https://tobi-09.github.io/skaut/img/IMG_4284.jpg", "https://tobi-09.github.io/skaut/img/IMG_4285.jpg", "https://tobi-09.github.io/skaut/img/IMG_4286.jpg", "https://tobi-09.github.io/skaut/img/IMG_4287.jpg", "https://tobi-09.github.io/skaut/img/IMG_4288.jpg", "https://tobi-09.github.io/skaut/img/IMG_4289.jpg", "https://tobi-09.github.io/skaut/img/IMG_4290.jpg", "https://tobi-09.github.io/skaut/img/IMG_4291.jpg", "https://tobi-09.github.io/skaut/img/IMG_4304.jpg", "https://tobi-09.github.io/skaut/img/IMG_4305.jpg", "https://tobi-09.github.io/skaut/img/IMG_4307.jpg"]
    ];

    function setLanguage(l) {
      localStorage.setItem('lang', l);
      document.getElementById('lang-overlay').classList.add('hidden');
      document.body.style.overflow = 'auto';
      render(l);
    }

    function render(l) {
      const t = data[l];
      document.getElementById('h-title').textContent = t.title;
      document.getElementById('h-desc').textContent = t.desc;
      document.getElementById('m-info').textContent = t.info;
      document.getElementById('m-credits').textContent = t.credits;

      const root = document.getElementById('ch-root');
      root.innerHTML = '';
      photoGroups.forEach((pics, i) => {
        if (i === 1) {
          root.innerHTML += `<section class="video-section"><div class="video-box"><video controls playsinline><source src="https://tobi-09.github.io/skaut/img/2.2videa.mp4" type="video/mp4"></video></div></section>`;
        }
        const sec = document.createElement('section');
        sec.className = 'chapter';
        sec.innerHTML = `
          <div class="title">${t.chaps[i].t}</div>
          <p class="text" style="color:var(--muted); line-height:1.6; margin-bottom:25px;">${t.chaps[i].d}</p>
          <div class="chapter-hero"><img src="${pics[0]}"></div>
          <div class="slider">
            <div class="track">${pics.slice(1).map(p => `<div class="slide"><img src="${p}"></div>`).join('')}</div>
            <div class="nav"><button class="btn prev">‹</button><button class="btn next">›</button></div>
            <div class="slider-footer"><span>${t.more}</span><span>← →</span></div>
          </div>
        `;
        root.appendChild(sec);
      });
      initSliders();
    }

    function initSliders() {
      document.querySelectorAll('.slider').forEach(s => {
        const tr = s.querySelector('.track');
        const slides = s.querySelectorAll('.slide');
        let idx = 0;
        s.querySelector('.next').onclick = () => { idx = (idx + 1) % slides.length; tr.style.transform = `translateX(-${idx * 100}%)`; };
        s.querySelector('.prev').onclick = () => { idx = (idx - 1 + slides.length) % slides.length; tr.style.transform = `translateX(-${idx * 100}%)`; };
      });
    }

    window.onload = () => {
      const saved = localStorage.getItem('lang');
      if (saved) setLanguage(saved);
      else document.body.style.overflow = 'hidden';
    };
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jednorázová Schránka (Burn-after-reading)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 25px;
        }
        .section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        h2 {
            font-size: 18px;
            color: #34495e;
            margin-top: 0;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.btn-get {
            background-color: #e67e22;
        }
        button.btn-get:hover {
            background-color: #d35400;
        }
        .result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            word-break: break-all;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .output-box {
            background-color: #edf2f7;
            border: 1px solid #cbd5e0;
            color: #2d3748;
            font-weight: bold;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Vložit a vymazat po přečtení</h1>

    <!-- SEKCE PRO VLOŽENÍ -->
    <div class="section">
        <h2>1. Uložit do schránky</h2>
        <label for="write-key">Kód zprávy (unikátní název):</label>
        <input type="text" id="write-key" placeholder="např. tajne-heslo-12">
        
        <label for="write-text">Obsah zprávy:</label>
        <textarea id="write-text" placeholder="Sem napište tajnou zprávu..."></textarea>
        
        <button onclick="vlozitZpravu()">Uložit zprávu</button>
        <div id="write-result" class="result"></div>
    </div>

    <!-- SEKCE PRO VYBRÁNÍ -->
    <div class="section">
        <h2>2. Vyzvednout ze schránky</h2>
        <label for="read-key">Zadejte kód zprávy:</label>
        <input type="text" id="read-key" placeholder="např. tajne-heslo-12">
        
        <button class="btn-get" onclick="vybratZpravu()">Vyzvednout a smazat</button>
        <div id="read-result" class="result"></div>
    </div>
</div>

<script>
    // Vaše URL adresa Firebase Realtime Databáze
    const DB_URL = "https://firebasedatabase.app";

    // Pomocná funkce pro zobrazení výsledků na stránce
    function zobrazVysledek(elementId, text, typ, extraKlasa = '') {
        const el = document.getElementById(elementId);
        el.className = `result ${typ} ${extraKlasa}`;
        el.innerText = text;
        el.style.display = 'block';
    }

    // 1. Logika pro vložení zprávy
    async function vlozitZpravu() {
        const klic = document.getElementById('write-key').value.trim();
        const text = document.getElementById('write-text').value.trim();
        const resultId = 'write-result';

        if (!klic || !text) {
            zobrazVysledek(resultId, "Vyplňte prosím kód i obsah zprávy.", "error");
            return;
        }

        try {
            const response = await fetch(`${DB_URL}/${klic}.json`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ obsah: text, vytvoreno: Date.now() })
            });

            if (response.ok) {
                zobrazVysledek(resultId, `Zpráva s kódem "${klic}" byla úspěšně uložena do Firebase.`, "success");
                document.getElementById('write-text').value = ''; // Vyčistit pole
            } else {
                zobrazVysledek(resultId, "Chyba při ukládání: Databáze odmítla požadavek.", "error");
            }
        } catch (error) {
            zobrazVysledek(resultId, "Chyba sítě nebo spojení s Firebase.", "error");
            console.error(error);
        }
    }

    // 2. Logika pro jednorázové vyzvednutí a smazání
    async function vybratZpravu() {
        const klic = document.getElementById('read-key').value.trim();
        const resultId = 'read-result';

        if (!klic) {
            zobrazVysledek(resultId, "Zadejte kód zprávy, kterou chcete vyzvednout.", "error");
            return;
        }

        const url = `${DB_URL}/${klic}.json`;

        try {
            // KROK A: Načtení dat (GET)
            const response = await fetch(url);
            const data = await response.json();

            // Pokud zpráva neexistuje (už byla smazána nebo nebyla vytvořena)
            if (!data || !data.obsah) {
                zobrazVysledek(resultId, "Tato zpráva neexistuje, nebo již byla vyzvednuta a zničena.", "error");
                return;
            }

            // KROK B: Okamžité smazání (DELETE)
            const deleteResponse = await fetch(url, { method: 'DELETE' });

            if (deleteResponse.ok) {
                zobrazVysledek(resultId, `Obsah zprávy:\n\n${data.obsah}\n\n(Zpráva byla v databázi úspěšně zničena)`, "output-box");
            } else {
                zobrazVysledek(resultId, `Data byla načtena, ale nepodařilo se je z databáze smazat! Obsah: ${data.obsah}`, "error");
            }

        } catch (error) {
            zobrazVysledek(resultId, "Chyba při komunikaci s databází.", "error");
            console.error(error);
        }
    }
</script>

</body>
</html>

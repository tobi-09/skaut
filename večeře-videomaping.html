<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Immersive Experience — Oživlá Večeře</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --accent: #ffffff;
      --muted: #999999;
      --border: rgba(255, 255, 255, 0.15);
      --font-main: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font-main);
      background: var(--bg); color: var(--accent);
      line-height: 1.4; -webkit-font-smoothing: antialiased;
    }

    .lang-switcher { position: fixed; top: 30px; right: 40px; z-index: 1000; display: flex; gap: 15px; }
    .lang-link {
      background: transparent; border: none; color: #fff;
      font-size: 12px; font-weight: 700; text-transform: uppercase; 
      cursor: pointer; opacity: 0.4; letter-spacing: 0.1em;
    }
    .lang-link:hover { opacity: 1; }

    #lang-overlay {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: 0.8s; }
    .lang-btn {
      background: transparent; border: 1px solid var(--border); color: #fff;
      padding: 15px 40px; cursor: pointer; text-transform: uppercase; margin: 10px;
      font-size: 13px; letter-spacing: 0.2em;
    }
    .lang-btn:hover { background: #fff; color: #000; }

    .hero { position: relative; width: 100%; height: 100vh; margin-bottom: 120px; }
    .hero-media { width: 100%; height: 100%; }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
    .hero-info { position: absolute; bottom: 80px; left: 50px; z-index: 10; }
    .hero-info h1 { 
      font-size: clamp(50px, 12vw, 140px); 
      margin: 0; text-transform: uppercase; 
      letter-spacing: -0.05em; line-height: 0.8; font-weight: 500;
    }

    .wrap { max-width: 1500px; margin: 0 auto; padding: 0 50px; }

    .desc { 
      font-size: clamp(22px, 2.5vw, 32px); 
      color: var(--accent); line-height: 1.5; 
      white-space: pre-line; margin-bottom: 150px; 
      font-weight: 300; max-width: 1100px;
      letter-spacing: -0.02em;
    }

    .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 0; margin-bottom: 120px; }
    .meta .card { border-top: 1px solid var(--border); padding: 50px 0; }
    .meta pre { 
      white-space: pre-wrap; font-family: var(--font-main); 
      color: var(--muted); font-size: 15px; line-height: 1.8; margin: 0; 
    }

    .video-section { margin: 120px 0; }
    video { width: 100%; display: block; border: 1px solid var(--border); }

    .chapter { border-top: 1px solid var(--border); padding-top: 100px; margin-top: 150px; }
    .chapter .title { 
      font-size: 14px; text-transform: uppercase; letter-spacing: 0.5em; 
      margin-bottom: 40px; color: var(--muted); font-weight: 700;
    }
    .chapter .text { 
      color: var(--accent); font-size: clamp(20px, 2vw, 26px); 
      line-height: 1.6; margin-bottom: 80px; max-width: 900px; font-weight: 300;
    }

    .chapter-hero, .slide { width: 100%; height: 85vh; background: #000; }
    .chapter-hero img, .slide img { width: 100%; height: 100%; object-fit: cover; }

    .slider { position: relative; margin-top: 60px; overflow: hidden; }
    .track { display: flex; transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1); }
    .slide { min-width: 100%; }
    
    .nav { position: absolute; top: 50%; width: 100%; display: flex; justify-content: space-between; transform: translateY(-50%); pointer-events: none; padding: 0 30px; }
    .btn { 
      pointer-events: auto; background: rgba(255,255,255,0.1); border: none; 
      color: #fff; width: 60px; height: 60px; cursor: pointer; font-size: 30px;
    }
    .btn:hover { background: #fff; color: #000; }
    
    .dots { position: absolute; bottom: 40px; left: 50px; display: flex; gap: 15px; }
    .dot { width: 40px; height: 2px; background: rgba(255,255,255,0.2); border: none; cursor: pointer; }
    .dot.active { background: #fff; width: 80px; transition: 0.4s; }

    @media (max-width: 768px) {
      .wrap { padding: 0 25px; }
      .hero-info { left: 25px; }
      .desc { font-size: 20px; }
      .chapter-hero, .slide { height: 50vh; }
    }
  </style>
</head>
<body>

  <div class="lang-switcher">
          <li><a href="https://tobi-09.github.io/skaut/rozhan%C3%AD%20videomaping.html">Works</a></li>
    <button class="lang-link" onclick="setLanguage('cs')">CS</button>
    <button class="lang-link" onclick="setLanguage('en')">EN</button>
  </div>

  <div id="lang-overlay">
    <h2 style="letter-spacing:0.5em; text-transform:uppercase; font-weight:400; font-size:16px; margin-bottom:40px;">Oživlá Večeře</h2>
    <div>
      <button class="lang-btn" onclick="setLanguage('cs')">Čeština</button>
      <button class="lang-btn" onclick="setLanguage('en')">English</button>
    </div>
  </div>

  <header class="hero">
    <div class="hero-media"><img src="https://tobi-09.github.io/skaut/img/IMG_4298.jpg"></div>
    <div class="hero-info">
      <div style="font-size:13px; letter-spacing:0.6em; opacity:0.6; margin-bottom:25px; font-weight:700;">IMMERSIVE EXPERIENCE</div>
      <h1 id="h-title"></h1>
    </div>
  </header>

  <div class="wrap">
    <p class="desc" id="h-desc"></p>
    <section class="video-section">
      <video controls playsinline poster="https://tobi-09.github.io/skaut/img/IMG_4271.jpg">
        <source src="https://tobi-09.github.io/skaut/img/1.2videa.mp4" type="video/mp4">
      </video>
    </section>
    <section class="meta">
      <div class="card"><div style="font-size:11px; opacity:0.4; margin-bottom:25px; text-transform:uppercase; letter-spacing:0.3em;">Info</div><pre id="m-info"></pre></div>
      <div class="card"><div style="font-size:11px; opacity:0.4; margin-bottom:25px; text-transform:uppercase; letter-spacing:0.3em;">Credits</div><pre id="m-credits"></pre></div>
    </section>
    <div id="content-root"></div>
  </div>

  <script>
    const data = {
      cs: {
        title: "Oživlá Večeře",
        desc: `Tato imerzivní zkušenost sleduje cestu jídla nikoli jako objektu, ale jako svědka času.
Cestu, která dnes trvá miliony vteřin a stovky kilometrů — a přesto začala v absolutním tichu.

Vyprávění nás zve k návratu na samotný začátek.
Do prázdna.
Do okamžiku, který neměl včerejšek.

Před chutí.
Před směrem.
Před samotným časem.

Obraz a zvuk sledují zrození hmoty z ničeho: vznik hvězd, formování planet, těles žhnoucích teplem a pohybem. Mezi nimi jedna planeta zahajuje dlouhou a křehkou proměnu. Vznikají oceány. Měsíc si pomalu nachází svou dráhu. Život se rodí, přizpůsobuje a odvažuje se vystoupit z vody.

Jak se formují kontinenty a mění prostředí, živé bytosti ovládají nová území. Objevuje se člověk — ne jako závěr, ale jako bod obratu. Poprvé Slunce není samo v pozorování vesmíru.

Zkušenost se rozvíjí ve třech etapách, které odrážejí kosmickou evoluci, planetární život a lidské systémy. Postupně se přesouvá od přírodních procesů ke konstruovaným realitám — od organických rytmů ke strukturám, městům, strojům a automatizovaným sítím. To, co dříve následovalo gravitaci a instinkt, dnes následuje algoritmy, logistiku a umělou inteligenci.

Prostřednictvím abstrakce, nikoli ilustrace, dílo klade otázky zrychlení, kontroly a autorství. Odráží, jak se systémy vytvořené k udržení života staly složitými, autonomními a neprůhlednými. Jídlo se stává tichým spojovníkem mezi počátky a budoucnostmi — formovaným stejnými silami, které utvářely hvězdy, společnosti i technologie.

Zkušenost nevysvětluje.
Pozoruje.

Ptá se, zda je pokrok lineární, zda efektivita nahrazuje smysl a zda systémy, které jsme vytvořili, nezačaly na oplátku pozorovat nás. Končící na prahu nového roku, dílo otevírá prostor k zamyšlení — ne jako uzavření, ale jako obnovu.`,
        info: "Role: Režie · Design · Koncept\nTyp: Imerzivní zážitek\nDatum: 2026 \noriginalní jazyk dabingu: čeština ",
        credits: "REŽIE · DESIGN · KONCEPT\nTobiaš Pejsar\n\nVIZUÁLNÍ ART & PROJEKČNÍ OBSAH\nTobiaš Pejsar\n\nSOUND DESIGN & HUDBA\nTobiaš Pejsar\n\nTEXT / NARACE\nTobiaš Pejsar\n\nTECHNICKÝ & PROSTOROVÝ DESIGN\nTobiaš Pejsar\n\nFOTOGRAFIE\nTobiaš Pejsar\nAleš Pejsar",
        chaps: [
          { t: "Kapitola 1 – Vesmír", d: "Cesta jídla k nám trvá miliony vteřin a stovky kilometrů. Ale ne vždy tomu tak bylo. Pojďme se podívat zpět do ticha a vzduchoprázdna, do dne, který neměl včerejšek. Formují se první hvězdy a spolu s nimi planetky – žhavé a rozpálené." },
          { t: "Kapitola 2 – Lidstvo", d: "Ale tu naši na jejím dobrodružství čeká dlouhá cesta. formujícím oceánem pomalu začíná híbat Měsíc.Živočichové na pevnině ovládají nová území. na Zemy se rodí první lide a slunce po prvénebude ve vesmiru samo,  ohěn  da člověku teplo světlo a časem i sýlu , šlechtické rody rozdělují svět na uzemy a dnešní zěmne , člověk buduje ohromné monumenty krytickou infrastrukturu a domy" },
          { t: "Kapitola 3 – Budoucnost", d: "Co jednou následovalo gravitaci, nyní následuje algoritmy a logistiku. Jídlo se stává tichým spojovníkem mezi počátky a technologickou budoucností." }
        ]
      },
      en: {
        title: "Animated Dinner",
        desc: `This immersive experience follows the journey of food not as an object, but as a witness of time.
A journey that today spans millions of seconds and hundreds of kilometers — yet once began in absolute silence.

The narrative invites us to return to the beginning.
To emptiness.
To a moment without yesterday.

Before taste.
Before direction.
Before time itself.

Visuals and sound trace the emergence of matter from nothingness: the birth of stars, the formation of planets, bodies glowing with heat and motion. Among them, one planet begins a long and fragile transformation. Oceans take shape. The Moon slowly claims its orbit. Life emerges, adapts, and dares to leave the water.

As continents form and environments shift, living beings conquer new territories. Humanity appears — not as a conclusion, but as a turning point. For the first time, the Sun is no longer alone in observing the universe.

The experience unfolds in three stages, mirroring cosmic evolution, planetary life, and human systems. It gradually shifts from natural processes to constructed realities — from organic rhythms to structures, cities, machines, and automated networks. What once followed gravity and instinct now follows algorithms, logistics, and artificial intelligence.

Through abstraction rather than illustration, the work questions acceleration, control, and authorship. It reflects on how systems designed to sustain life have grown complex, autonomous, and opaque. Food becomes a silent connector between origins and futures — shaped by the same forces that formed stars, societies, and technologies.

The experience does not explain.
It observes.

It asks whether progress is linear, whether efficiency replaces meaning, and whether the systems we created now observe us in return. Ending at the threshold of a new year, the work opens space for reflection — not as closure, but as renewal.`,
        info: "ROLE: Direction · Design · Concept\nTYPE: Immersive Experience\nPREMIERE: Jan 1, 2026 · Prague \n original dubbing language: Czech",
        credits: "DIRECTION · DESIGN · CONCEPT\nTobias Pejsar\n\nVISUAL ART & PROJECTION CONTENT\nTobias Pejsar\n\nSOUND DESIGN & MUSIC\nTobias Pejsar\n\nTEXT / NARRATION\nTobias Pejsar\n\nTECHNICAL & SPATIAL DESIGN\nTobias Pejsar\n\nPHOTOGRAPHY\nTobias Pejsar\nAleš Pejsar",
        chaps: [
          { t: "Chapter 1 – Universe", d: "The journey of food to us takes millions of seconds and hundreds of kilometers. But it was not always like this. Let us return to silence and emptiness, to a day without yesterday. The first stars form, followed by planets — glowing and molten." },
          { t: "Chapter 2 – Humanity", d: "But our planet faces a long journey ahead. Through the forming oceans, the Moon slowly begins to move. Living beings on land conquer new territories. On Earth, the first humans are born, and for the first time, the Sun will not be alone in the universe. The fire gives humanity warmth, light, and over time, strength. Noble families divide the world into territories and the lands we know today. Humanity builds monumental structures, critical infrastructure, and homes. " },
          { t: "Chapter 3 – Future", d: "What once followed gravity now follows algorithms and logistics. Food as a link to the future." }
        ]
      }
    };

    const photoGroups = [
      ["https://tobi-09.github.io/skaut/img/IMG_4243.jpg", "https://tobi-09.github.io/skaut/img/IMG_4244.jpg", "https://tobi-09.github.io/skaut/img/IMG_4311.jpg", "https://tobi-09.github.io/skaut/img/IMG_4313.jpg", "https://tobi-09.github.io/skaut/img/IMG_4314.jpg", "https://tobi-09.github.io/skaut/img/IMG_4315.jpg"],
      ["https://tobi-09.github.io/skaut/img/FullSizeRender.JPG", "https://tobi-09.github.io/skaut/img/IMG_4247.jpg", "https://tobi-09.github.io/skaut/img/IMG_4248.jpg", "https://tobi-09.github.io/skaut/img/IMG_4250.jpg", "https://tobi-09.github.io/skaut/img/IMG_4251.jpg", "https://tobi-09.github.io/skaut/img/IMG_4253.jpg", "https://tobi-09.github.io/skaut/img/IMG_4254.jpg", "https://tobi-09.github.io/skaut/img/IMG_4255.jpg", "https://tobi-09.github.io/skaut/img/IMG_4256.jpg", "https://tobi-09.github.io/skaut/img/IMG_4257.jpg", "https://tobi-09.github.io/skaut/img/IMG_4259.jpg", "https://tobi-09.github.io/skaut/img/IMG_4264.jpg", "https://tobi-09.github.io/skaut/img/IMG_4267.jpg", "https://tobi-09.github.io/skaut/img/IMG_4269.jpg", "https://tobi-09.github.io/skaut/img/IMG_4270.jpg", "https://tobi-09.github.io/skaut/img/IMG_4271.jpg", "https://tobi-09.github.io/skaut/img/IMG_4272.jpg"],
      ["https://tobi-09.github.io/skaut/img/IMG_4274.jpg", "https://tobi-09.github.io/skaut/img/IMG_4276.jpg", "https://tobi-09.github.io/skaut/img/IMG_4277.jpg", "https://tobi-09.github.io/skaut/img/IMG_4278.jpg", "https://tobi-09.github.io/skaut/img/IMG_4279.jpg", "https://tobi-09.github.io/skaut/img/IMG_4280.jpg", "https://tobi-09.github.io/skaut/img/IMG_4281.jpg", "https://tobi-09.github.io/skaut/img/IMG_4282.jpg", "https://tobi-09.github.io/skaut/img/IMG_4283.jpg", "https://tobi-09.github.io/skaut/img/IMG_4284.jpg", "https://tobi-09.github.io/skaut/img/IMG_4285.jpg", "https://tobi-09.github.io/skaut/img/IMG_4286.jpg", "https://tobi-09.github.io/skaut/img/IMG_4287.jpg", "https://tobi-09.github.io/skaut/img/IMG_4288.jpg", "https://tobi-09.github.io/skaut/img/IMG_4289.jpg", "https://tobi-09.github.io/skaut/img/IMG_4290.jpg", "https://tobi-09.github.io/skaut/img/IMG_4291.jpg", "https://tobi-09.github.io/skaut/img/IMG_4304.jpg", "https://tobi-09.github.io/skaut/img/IMG_4305.jpg", "https://tobi-09.github.io/skaut/img/IMG_4307.jpg"]
    ];

    let timers = [];

    function setLanguage(l) {
      localStorage.setItem('lang', l);
      document.getElementById('lang-overlay').classList.add('hidden');
      document.body.style.overflow = 'auto';
      render(l);
    }

    function render(l) {
      const t = data[l];
      document.getElementById('h-title').textContent = t.title;
      document.getElementById('h-desc').textContent = t.desc;
      document.getElementById('m-info').textContent = t.info;
      document.getElementById('m-credits').textContent = t.credits;

      const root = document.getElementById('content-root');
      root.innerHTML = '';
      timers.forEach(clearInterval);
      timers = [];

      photoGroups.forEach((pics, i) => {
        if (i === 1) {
          root.innerHTML += `<section class="video-section"><video controls playsinline><source src="https://tobi-09.github.io/skaut/img/2.2videa.mp4" type="video/mp4"></video></section>`;
        }
        const sec = document.createElement('section');
        sec.className = 'chapter';
        sec.innerHTML = `
          <div class="title">${t.chaps[i].t}</div>
          <p class="text">${t.chaps[i].d}</p>
          <div class="chapter-hero"><img src="${pics[0]}"></div>
          <div class="slider" id="slider-${i}">
            <div class="track">${pics.slice(1).map(p => `<div class="slide"><img src="${p}"></div>`).join('')}</div>
            <div class="nav"><button class="btn prev">‹</button><button class="btn next">›</button></div>
            <div class="dots">${pics.slice(1).map((_, j) => `<button class="dot ${j===0?'active':''}"></button>`).join('')}</div>
          </div>
        `;
        root.appendChild(sec);
      });
      initSliders();
    }

    function initSliders() {
      document.querySelectorAll('.slider').forEach(s => {
        const tr = s.querySelector('.track');
        const dots = s.querySelectorAll('.dot');
        const slides = s.querySelectorAll('.slide');
        let idx = 0;

        const up = () => {
          tr.style.transform = `translateX(-${idx * 100}%)`;
          dots.forEach((d, k) => d.classList.toggle('active', k === idx));
        };

        const nextSlide = () => { idx = (idx + 1) % slides.length; up(); };
        
        // Automatický posun každých 5 vteřin
        const timer = setInterval(nextSlide, 5000);
        timers.push(timer);

        s.querySelector('.next').onclick = () => { nextSlide(); };
        s.querySelector('.prev').onclick = () => { idx = (idx - 1 + slides.length) % slides.length; up(); };
        dots.forEach((d, k) => d.onclick = () => { idx = k; up(); });
      });
    }

    window.onload = () => {
      const saved = localStorage.getItem('lang');
      if (saved) setLanguage(saved);
      else document.body.style.overflow = 'hidden';
    };
  </script>
</body>
</html>

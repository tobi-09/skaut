<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Immersive Experience — Oživlá Večeře</title>
  <style>
    :root{
      --bg:#050509; --card:#0b0b10; --muted:rgba(255,255,255,0.7);
      --accent:#e6e6e6;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter, system-ui, -apple-system, sans-serif;
      background:var(--bg);
      color:var(--accent);
      overflow-x: hidden;
    }

    /* LANGUAGE SWITCHER */
    .lang-switcher {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      gap: 10px;
    }
    .lang-link {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 5px 10px;
      font-size: 11px;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.1em;
      border-radius: 4px;
      transition: 0.3s;
    }
    .lang-link:hover { background: #fff; color: #000; }

    /* LANGUAGE OVERLAY */
    #lang-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    #lang-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .lang-box { text-align: center; }
    .lang-box h2 { font-weight: 300; margin-bottom: 30px; letter-spacing: 0.2em; text-transform: uppercase; }
    .lang-btns { display: flex; gap: 20px; justify-content: center; }
    .lang-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 12px 30px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: 0.3s;
    }
    .lang-btn:hover { background: #fff; color: #000; }

    /* HERO */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      margin-bottom: 40px;
    }
    .hero-media { width: 100%; height: 100%; }
    .hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .hero-info {
      position: absolute;
      bottom: 60px;
      left: 60px;
      text-align: left;
      z-index: 10;
    }
    .hero-info h1 {
      font-size: clamp(32px, 8vw, 70px);
      margin: 0;
      line-height: 0.9;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .hero-info .tag {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.4em;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    .wrap { max-width:1100px; margin:0 auto; padding: 0 28px; }

    /* VIDEO SECTION */
    .video-section { margin-bottom: 60px; }
    .video-section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 20px; color: var(--muted); }
    .video-box { border-radius:12px; overflow:hidden; border:1px solid rgba(255,255,255,0.06); background:#000; }
    video { width:100%; display:block; }

    /* TEXT SECTIONS */
    .description-block { margin: 60px 0; }
    .desc { font-size: 16px; color: var(--muted); line-height: 1.7; max-width: 850px; white-space: pre-line; }

    .meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px; margin-bottom:60px; }
    .meta .card { background:linear-gradient(180deg,#0b0b12,#050509); padding:24px; border-radius:12px; border:1px solid rgba(255,255,255,0.03); }
    .meta .title { font-size:11px; text-transform:uppercase; letter-spacing:0.2em; color:rgba(255,255,255,0.4); margin-bottom:15px; }
    .meta pre { white-space:pre-wrap; font-family:inherit; color:var(--muted); font-size:14px; margin:0; line-height:1.6; }

    /* CHAPTERS */
    .chapter { border-top:1px solid rgba(255,255,255,0.05); padding-top:50px; margin-top:50px; }
    .chapter .head { margin-bottom:25px; }
    .chapter .title { font-size:13px; text-transform:uppercase; letter-spacing:0.2em; margin-bottom:10px; color: #fff; }
    .chapter .text { color:var(--muted); font-size:15px; line-height:1.6; }

    .chapter-hero { width:100%; height:600px; border-radius:12px; overflow:hidden; margin-bottom:20px; border:1px solid rgba(255,255,255,0.05); }
    .chapter-hero img { width:100%; height:100%; object-fit:cover; }

    /* SLIDER */
    .slider { position:relative; border-radius:12px; overflow:hidden; background:#000; width:100%; border:1px solid rgba(255,255,255,0.05); }
    .track { display:flex; transition:transform 0.8s cubic-bezier(0.2, 0.9, 0.2, 1); }
    .slide { min-width:100%; height:600px; flex-shrink:0; }
    .slide img { width:100%; height:100%; object-fit:cover; }
    
    .nav { position:absolute; top:50%; left:0; right:0; display:flex; justify-content:space-between; transform:translateY(-50%); pointer-events:none; padding:0 15px; z-index:10; }
    .btn { pointer-events:auto; background:rgba(0,0,0,0.4); border:1px solid rgba(255,255,255,0.1); color:#fff; width:44px; height:44px; border-radius:50%; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
    
    .dots { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:8px; }
    .dot { width:6px; height:6px; background:rgba(255,255,255,0.3); border:none; border-radius:50%; cursor:pointer; transition: 0.3s; }
    .dot.active { background:#fff; transform:scale(1.4); }

    @media (max-width:900px){
      .hero-info { left: 20px; bottom: 40px; }
      .hero-info h1 { font-size: 38px; }
      .chapter-hero, .slide { height: 280px; }
      .wrap { padding: 0 20px; }
      .lang-switcher { top: 10px; right: 10px; }
    }
  </style>
</head>
<body>

  <div class="lang-switcher">
    <button class="lang-link" onclick="setLanguage('cs')">CS</button>
    <button class="lang-link" onclick="setLanguage('en')">EN</button>
  </div>

  <div id="lang-overlay">
    <div class="lang-box">
      <h2>Oživlá Večeře</h2>
      <div class="lang-btns">
        <button class="lang-btn" onclick="setLanguage('cs')">Čeština</button>
        <button class="lang-btn" onclick="setLanguage('en')">English</button>
      </div>
    </div>
  </div>

  <header class="hero">
    <div class="hero-media">
      <img src="https://tobi-09.github.io/skaut/img/IMG_4298.jpg" alt="Hero" />
    </div>
    <div class="hero-info">
      <div class="tag">Immersive Experience</div>
      <h1 id="hero-title">Oživlá Večeře</h1>
    </div>
  </header>

  <div class="wrap">
    <section class="description-block">
      <p class="desc" id="main-desc"></p>
    </section>

    <section class="video-section" aria-labelledby="video-title">
      <h2 id="video-title">Video</h2>
      <div class="video-box">
        <video controls playsinline preload="metadata" poster="https://tobi-09.github.io/skaut/img/IMG_4271.jpg">
          <source src="https://tobi-09.github.io/skaut/img/1.2videa.mp4" type="video/mp4">
          Váš prohlížeč nepodporuje video tag.
        </video>
      </div>
    </section>

    <section class="meta">
      <div class="card">
        <div class="title" id="title-info">Info</div>
        <pre id="info-content"></pre>
      </div>
      <div class="card">
        <div class="title" id="title-credits">Credits</div>
        <pre id="credits-content"></pre>
      </div>
    </section>

    <main id="chapters"></main>
  </div>

        mainDesc: `Tato imerzivní zkušenost sleduje cestu jídla nikoli jako objektu, ale jako svědka času.
Cestu, která dnes trvá miliony vteřin a stovky kilometrů — a přesto začala v absolutním tichu.

Vyprávění nás zve k návratu na samotný začátek.
Do prázdna.
Do okamžiku, který neměl včerejšek.

Před chutí.
Před směrem.
Před samotným časem.

Obraz a zvuk sledují zrození hmoty z ničeho: vznik hvězd, formování planet, těles žhnoucích teplem a pohybem. Mezi nimi jedna planeta zahajuje dlouhou a křehkou proměnu. Vznikají oceány. Měsíc si pomalu nachází svou dráhu. Život se rodí, přizpůsobuje a odvažuje se vystoupit z vody.

Jak se formují kontinenty a mění prostředí, živé bytosti ovládají nová území. Objevuje se člověk — ne jako závěr, ale jako bod obratu. Poprvé Slunce není samo v pozorování vesmíru.

Zkušenost se rozvíjí ve třech etapách, které odrážejí kosmickou evoluci, planetární život a lidské systémy. Postupně se přesouvá od přírodních procesů ke konstruovaným realitám — od organických rytmů ke strukturám, městům, strojům a automatizovaným sítím. To, co dříve následovalo gravitaci a instinkt, dnes následuje algoritmy, logistiku a umělou inteligenci.

Prostřednictvím abstrakce, nikoli ilustrace, dílo klade otázky zrychlení, kontroly a autorství. Odráží, jak se systémy vytvořené k udržení života staly složitými, autonomními a neprůhlednými. Jídlo se stává tichým spojovníkem mezi počátky a budoucnostmi — formovaným stejnými silami, které utvářely hvězdy, společnosti i technologie.

Zkušenost nevysvětluje.
Pozoruje.

Ptá se, zda je pokrok lineární, zda efektivita nahrazuje smysl a zda systémy, které jsme vytvořili, nezačaly na oplátku pozorovat nás. Končící na prahu nového roku, dílo otevírá prostor k zamyšlení — ne jako uzavření, ale jako obnovu.`,

          { title: "Kapitola 1 – Vesmír", text: "Cesta jídla k nám trvá miliony vteřin a stovky kilometrů. Ale ne vždy tomu tak bylo. Pojďme se podívat zpět do ticha a vzduchoprázdna, do dne, který neměl včerejšek. Formují se první hvězdy a spolu s nimi planetky – žhavé a rozpálené." },
          { title: "Kapitola 2 – Lidstvo", text: "Ale tu naši na jejím dobrodružství čeká dlouhá cesta. Ve formujících se oceánech pomalu začíná zobat Měsíc. Živočichové na pevnině ovládají nová území. Na Zemi se rodí první lidé a Slunce poprvé od vzniku vesmíru nebude samo. Oheň da člověku teplo, světlo a časem i sílu. Šlechtické rody rozdělují svět na území a dnešní země. Člověk buduje ohromné monumenty, kritickou infrastrukturu a domy." },
          { title: "Kapitola 3 – Budoucnost", text: "Co jednou následovalo gravitaci, nyní následuje algoritmy a logistiku. Jídlo se stává tichým pojítkem mezi počátky a budoucností." }

      en: {
        hero: "Animated Dinner",
        mainDesc: `This immersive experience follows the journey of food not as an object, but as a witness of time.
A journey that today spans millions of seconds and hundreds of kilometers — yet once began in absolute silence.

The narrative invites us to return to the beginning.
To emptiness.
To a moment without yesterday.

Before taste.
Before direction.
Before time itself.

Visuals and sound trace the emergence of matter from nothingness: the birth of stars, the formation of planets, bodies glowing with heat and motion. Among them, one planet begins a long and fragile transformation. Oceans take shape. The Moon slowly claims its orbit. Life emerges, adapts, and dares to leave the water.

As continents form and environments shift, living beings conquer new territories. Humanity appears — not as a conclusion, but as a turning point. For the first time, the Sun is no longer alone in observing the universe.

The experience unfolds in three stages, mirroring cosmic evolution, planetary life, and human systems. It gradually shifts from natural processes to constructed realities — from organic rhythms to structures, cities, machines, and automated networks. What once followed gravity and instinct now follows algorithms, logistics, and artificial intelligence.

Through abstraction rather than illustration, the work questions acceleration, control, and authorship. It reflects on how systems designed to sustain life have grown complex, autonomous, and opaque. Food becomes a silent connector between origins and futures — shaped by the same forces that formed stars, societies, and technologies.

The experience does not explain.
It observes.

It asks whether progress is linear, whether efficiency replaces meaning, and whether the systems we created now observe us in return. Ending at the threshold of a new year, the work opens space for reflection — not as closure, but as renewal.`,
        info: "Role: Direction · Design · Concept\nType: Immersive \nPREMIERE: 1. 1. 2026 · Prague, Czech Republic",
        credits: "DIRECTION · DESIGN · CONCEPT\nTobias Pejsar\n\nVISUAL ART & PROJECTION CONTENT\nTobias Pejsar\n\nSOUND DESIGN & MUSIC\nTobias Pejsar\n\nTEXT / NARRATION\nTobias Pejsar\n\nTECHNICAL & SPATIAL DESIGN\nTobias Pejsar\n\nPHOTOGRAPHY\nTobias Pejsar\nAleš Pejsar",
        chapters: [
          { title: "Chapter 1 – Universe", text: "The journey of food to us takes millions of seconds and hundreds of kilometers. Yet it was not always this way. Let us return to silence and vacuum, to a day without yesterday. The first stars form, followed by planets — glowing with heat and motion." },
          { title: "Chapter 2 – Humanity", text: "But our planet faces a long journey ahead. Oceans begin to take shape, and the Moon slowly finds its orbit. Life emerges in water, adapts, and dares to step onto land. Living beings conquer new territories. On Earth, the first humans are born, and for the first time, the Sun will not be alone in the universe. The fire gives humanity warmth, light, and over time, strength. Noble families divide the world into territories and the lands we know today. Humanity builds monumental structures, critical infrastructure, and homes." },
          { title: "Chapter 3 – Future", text: "What once followed gravity now follows algorithms and logistics. Food becomes a silent connector between origins and futures." }

    function renderContent(lang) {
      const t = translations[lang];
      document.getElementById('hero-title').textContent = t.hero;
      document.getElementById('main-desc').textContent = t.mainDesc;
      document.getElementById('info-content').textContent = t.info;
      document.getElementById('credits-content').textContent = t.credits;

      const chaptersRoot = document.getElementById("chapters");
      chaptersRoot.innerHTML = "";

      [0,1,2].forEach(i => {
        const part = chapterPhotos[i];
        if(!part || part.length === 0) return;

        const chap = document.createElement("section");
        chap.className = "chapter";
        chap.innerHTML = `
          <div class="head">
            <div class="title">${t.chapters[i].title}</div>
            <div class="text">${t.chapters[i].text}</div>
          </div>
          <div class="chapter-hero">
            <img src="${part[0]}">
          </div>`;

        if(part.length > 1) {
          let sliderHtml = `<div class="slider"><div class="track">`;
          part.slice(1).forEach(f => { sliderHtml += `<div class="slide"><img src="${f}"></div>`; });
          sliderHtml += `</div><div class="nav"><button class="btn" data-dir="prev">‹</button><button class="btn" data-dir="next">›</button></div><div class="dots">`;
          part.slice(1).forEach((_, j) => { sliderHtml += `<button class="dot${j===0?' active':''}" data-index="${j}"></button>`; });
          sliderHtml += `</div></div>`;
          chap.innerHTML += sliderHtml;
        }
        chaptersRoot.appendChild(chap);
      });
      initSliders();
    }

    function setLanguage(lang) {
      localStorage.setItem('pref_lang', lang);
      document.getElementById('lang-overlay').classList.add('hidden');
      document.body.style.overflow = 'auto';
      renderContent(lang);
    }

    function initSliders(){
      document.querySelectorAll(".slider").forEach(slider => {
        const track = slider.querySelector(".track"), slides = slider.querySelectorAll(".slide"), dots = slider.querySelectorAll(".dot");
        let i = 0;
        const up = () => { track.style.transform = `translateX(${-i * 100}%)`; dots.forEach((d, k) => d.classList.toggle("active", k === i)); };
        slider.querySelector('[data-dir="next"]').onclick = () => { i = (i + 1) % slides.length; up(); };
        slider.querySelector('[data-dir="prev"]').onclick = () => { i = (i - 1 + slides.length) % slides.length; up(); };
        dots.forEach(d => d.onclick = (e) => { i = parseInt(e.target.dataset.index); up(); });
      });
    }

    window.onload = () => {
      const saved = localStorage.getItem('pref_lang');
      if (saved) { setLanguage(saved); } else { document.body.style.overflow = 'hidden'; }
    };
  </script>
</body>
</html>
